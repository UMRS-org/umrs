[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umrs-protocol"
# Static and lockstep with the platform release; cut.sh seds this line.
version = "0.2.0rc4"
description = "UMRS wire protocol, handshake signing, error codes and the HPC gate: the stdlib-only contract shared by UMRS and its clients (ADR-117 D-2)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "RCCS AI Platform Team" },
]
keywords = ["umrs", "protocol", "contracts", "schemas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Pure stdlib: no runtime dependencies (ADR-117 D-3; tests/test_stdlib_only.py).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/umrs_protocol"]

# Own pytest root, so `pytest tests` here never picks up the superproject's
# ini (its addopts and testpaths belong to other suites).
[tool.pytest.ini_options]
testpaths = ["tests"]

# =============================================================================
# Ruff: an exact mirror of the ai4s-platform root config (pyproject.toml
# [tool.ruff]), so the modules copied from r4-contracts stay clean under both.
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
# hpc_gate.py bytes are the gate release (gate_sha256, tests/golden/gate.json):
# a reformat would be a new gate release, so the formatter never touches it.
exclude = ["src/umrs_protocol/hpc_gate.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B009",   # do not call getattr with a constant attribute value
    "ARG001", # unused function argument (common in APIs)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "S101"]
"tests/test_tool_calling.py" = ["ARG001", "S101", "ARG002"]
"**/__init__.py" = ["F401"]
"science/tests/**/*.py" = ["ARG001", "S101", "ARG002"]
"tests/test_*_e2e.py" = ["ARG001", "S101", "ARG002"]
"tests/test_e2e_smoke.py" = ["E402"]
"tests/test_n8n_workflows.py" = ["ARG001", "S101", "ARG002"]
"**/conftest.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["umrs_protocol"]
