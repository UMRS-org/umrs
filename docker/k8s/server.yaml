apiVersion: v1
kind: Service
metadata:
  name: umrs-server
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: control
      port: 5555
      targetPort: 5555
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umrs-server
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umrs
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umrs
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: umrs-server
          image: localhost:5001/umrs-server:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "src/server_umrs.py", "-c", "/root/conf_umrs.json"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DB_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: umrs-postgres-secret
                  key: DB_SUPERUSER_PASSWORD
            - name: DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: umrs-postgres-secret
                  key: DB_USER_PASSWORD
          envFrom:
            - configMapRef:
                name: umrs-config
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 5555
              name: control
          readinessProbe:
            tcpSocket:
              port: control
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: control
            initialDelaySeconds: 30
            periodSeconds: 10
