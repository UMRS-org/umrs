apiVersion: batch/v1
kind: Job
metadata:
  name: umrs-api-test
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: tests
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umrs
        app.kubernetes.io/component: tests
    spec:
      restartPolicy: Never
      containers:
        - name: umrs-api-test
          image: localhost:5001/umrs-api-test:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - configMapRef:
                name: umrs-config
