apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: object-storage
spec:
  selector:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: object-storage
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: iam
      port: 8111
      targetPort: 8111
    - name: metrics
      port: 9327
      targetPort: 9327
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: object-storage
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umrs
      app.kubernetes.io/component: object-storage
  volumeClaimTemplates:
    - metadata:
        name: seaweedfs-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umrs
        app.kubernetes.io/component: object-storage
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -volume.max=0
            - -volume.index=leveldb
            - -s3
            - -s3.port=9000
            - -metricsPort=9327
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: umrs-s3-secret
                  key: S3_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: umrs-s3-secret
                  key: S3_ROOT_PASSWORD
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 8111
              name: iam
            - containerPort: 9327
              name: metrics
          volumeMounts:
            - name: seaweedfs-data
              mountPath: /data
