apiVersion: v1
kind: Service
metadata:
  name: umrs-embed-worker
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: embedding-worker
spec:
  selector:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: embedding-worker
  ports:
    - name: zmq
      port: 6000
      targetPort: 6000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umrs-embed-worker
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: embedding-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umrs
      app.kubernetes.io/component: embedding-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umrs
        app.kubernetes.io/component: embedding-worker
    spec:
      containers:
        - name: umrs-embed-worker
          image: localhost:5001/umrs-embed-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "src/embedding_worker.py"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - configMapRef:
                name: umrs-config
          ports:
            - containerPort: 6000
              name: zmq
