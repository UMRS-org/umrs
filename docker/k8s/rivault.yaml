apiVersion: v1
kind: Service
metadata:
  name: rivault
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: rivault
spec:
  selector:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: rivault
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rivault
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
    app.kubernetes.io/component: rivault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umrs
      app.kubernetes.io/component: rivault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umrs
        app.kubernetes.io/component: rivault
    spec:
      containers:
        - name: rivault
          image: localhost:5001/rivault:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: RIVAULT_MODELS_FILE
              value: /app/src/rivault_models.json
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
