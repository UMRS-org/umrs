apiVersion: v1
kind: ConfigMap
metadata:
  name: umrs-config
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
data:
  DB_HOST: postgres
  POSTGRES_DB: images_and_texts_ejeannot
  UMRS_SERVER_HOST: umrs-server
  EMBEDDING_WORKER_ADDRESS: tcp://umrs-embed-worker:6000
  EMBEDDING_WORKER_BIND: tcp://0.0.0.0:6000
  EMBEDDING_DEVICE: cuda
  RIVAULT_ENDPOINT: http://rivault:8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: umrs-init-sql
  namespace: umrs-system
  labels:
    app.kubernetes.io/name: umrs
data:
  init_pgvector.sql: |
    -- Initialize pgvector on the default 'postgres' database and ensure a default admin role exists.
    CREATE EXTENSION IF NOT EXISTS vector;

    DO $$
    BEGIN
       IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'ejeannot') THEN
          CREATE ROLE ejeannot WITH LOGIN PASSWORD 'ejeannot' CREATEDB;
       END IF;
    END$$;
