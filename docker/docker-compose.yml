# Docker Compose for UMRS project
version: '3.8'

services:
  umrs-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: umrs-server
    depends_on:
      - postgres
      - seaweedfs
    ports:
      # Map UMRS HTTP API to 8001 on the host to avoid conflicts with
      # other stacks (e.g. RiVault/vLLM) that may also use 8000.
      - "8001:8000"
      - "5555:5555" # ZeroMQ control plane
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_SUPERUSER_PASSWORD=postgres
      - DB_USER_PASSWORD=ejeannot
      - UMRS_SERVER_HOST=umrs-server
      - SENTENCE_TRANSFORMERS_HOME=/shared/models/sentence_transformers
      - HF_HOME=/shared/models/hf
    volumes:
      - ./s3cfg:/root/.s3cfg:ro
      - $GLOBUS_DIR:/GLOBUS
      - model_cache:/shared/models
    restart: unless-stopped
    command: ["python", "src/server_umrs.py", "-c", "/root/conf_umrs.json"]

  # SeaweedFS object store (ADR-055; MinIO adapter support stays in code,
  # no deployment runs it anymore).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    ports:
      - "9000:9000"
      - "8111:8111"
      - "9327:9327"
    environment:
      - AWS_ACCESS_KEY_ID=s3admin
      - AWS_SECRET_ACCESS_KEY=s3admin
    command: >
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
      -volume.max=0 -volume.index=leveldb
      -s3 -s3.port=9000 -metricsPort=9327
    volumes:
      - s3_data:/data
    restart: unless-stopped

  postgres:
    # `ankane/pgvector:latest` breaks fresh init because the entrypoint calls
    # `ls`, but the image does not ship the required shell/coreutils.
    image: pgvector/pgvector:pg15
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=images_and_texts_ejeannot

      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    restart: unless-stopped

volumes:
  s3_data:
  pg_data:
  model_cache:
