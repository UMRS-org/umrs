# Docker Compose for UMRS project
version: '3.8'

services:
  umrs-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: umrs-server
    ports:
      - "8000:8000"
    expose:
      - 8000
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_SUPERUSER_PASSWORD=postgres
      - DB_USER_PASSWORD=ejeannot
    #volumes:
      #- ./s3cfg:/root/.s3cfg:ro
      #- $GLOBUS_DIR:/GLOBUS # mount globus directory
    networks:
      - umrs-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
      - ./s3cfg:/config/.s3cfg:ro
    networks:
      - umrs-net
    restart: unless-stopped

  postgres:
    image: ankane/pgvector:latest
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=images_and_texts_ejeannot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    networks:
      - umrs-net
    restart: unless-stopped

  umrs-client-tester:
    build:
      context: ..
      dockerfile: docker/Dockerfile.umrs-client-tester
    container_name: umrs-client-tester
    depends_on:
      - umrs-server
      - minio
      - postgres
    working_dir: /client
    networks:
      - umrs-net
    restart: "no"
    # Override default command for interactive testing
    # command: ["tail", "-f", "/dev/null"]

volumes:
  minio_data:
  pg_data:

networks:
  umrs-net:
    driver: bridge

