# Docker Compose for UMRS project
version: '3.8'

services:
  umrs-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: umrs-server
    ports:
      - "8000:8000"
      - "5555:5555" # ZeroMQ control plane
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_SUPERUSER_PASSWORD=postgres
      - DB_USER_PASSWORD=ejeannot
      - UMRS_SERVER_HOST=umrs-server
    volumes:
      - ./s3cfg:/root/.s3cfg:ro
      - $GLOBUS_DIR:/GLOBUS
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
      - ./s3cfg:/config/.s3cfg:ro
    restart: unless-stopped

  postgres:
    image: ankane/pgvector:latest
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=images_and_texts_ejeannot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    restart: unless-stopped

  umrs-api-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.umrs-api-test
    container_name: umrs-api-test
    depends_on:
      - umrs-server
      - minio
      - postgres
    environment:
      - PYTHONUNBUFFERED=1
      - UMRS_SERVER_HOST=umrs-server
    volumes:
      - ./s3cfg:/root/.s3cfg:ro
      - ./s3cfg_user1:/root/.s3cfg_user1:ro
      - ./s3cfg_user2:/root/.s3cfg_user2:ro
      - ../data:/app/data:ro
      - ../docker/user_files:/app/user_files:ro
    command: ["/bin/bash", "-c", "chmod +x ./test_umrs_api.sh && ./test_umrs_api.sh"]

volumes:
  minio_data:
  pg_data:
