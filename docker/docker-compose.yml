# Docker Compose for UMRS project
version: '3.8'

services:
  umrs-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: umrs-server
    ports:
      - "8000:8000"   # HTTP port (for backward compatibility)
      - "8443:8443"   # HTTPS port
    expose:
      - 8000
      - 8443
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_SUPERUSER_PASSWORD=postgres
      - DB_USER_PASSWORD=ejeannot
    #volumes:
      #- ./s3cfg:/root/.s3cfg:ro
      #- $GLOBUS_DIR:/GLOBUS # mount globus directory
    networks:
      - umrs-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # HTTPS port for MinIO (with SSL certs)
      - "9001:9001"   # MinIO Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001" --certs-dir /root/.minio/certs
    volumes:
      - minio_data:/data
      - ./s3cfg:/config/.s3cfg:ro
      - ./ssl:/root/.minio/certs:ro   # Mount SSL certs (server.crt, server.key, optionally CAs)
    networks:
      - umrs-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  postgres:
    image: ankane/pgvector:latest
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=images_and_texts_ejeannot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    networks:
      - umrs-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d images_and_texts_ejeannot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  umrs-api-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.umrs-api-test
    container_name: umrs-api-test
    depends_on:
      umrs-server:
        condition: service_healthy
    environment:
      - UMRS_API_URL=https://umrs-server:8443
    volumes:
      - ../data:/app/data:ro
      - ./conf_umrs_user1.json:/app/conf_umrs_user1.json:ro
      - ./conf_umrs_user2.json:/app/conf_umrs_user2.json:ro
    networks:
      - umrs-net
    restart: no


volumes:
  minio_data:
  pg_data:

networks:
  umrs-net:
    driver: bridge

