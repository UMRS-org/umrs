upstream openwebui_upstream {
    server rivault-openwebui:8080;
}

upstream vllm_upstream {
    server rivault-vllm:8000;
}

upstream ollama_upstream {
    server rivault-ollama:11434;
}

server {
    listen 443 ssl;
    server_name _;

    # For local testing you can use self-signed certs or remove SSL and
    # change the listen directive to `listen 80;`.
    #ssl_certificate     /etc/nginx/ssl/server.crt;
    #ssl_certificate_key /etc/nginx/ssl/server.key;

    # OpenWebUI UI
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://openwebui_upstream/;
    }

    # vLLM OpenAI-compatible API
    location /v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://vllm_upstream/;
    }

    # Ollama API passthrough
    location /ollama/ {
        rewrite ^/ollama/?(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ollama_upstream/;
    }
}
