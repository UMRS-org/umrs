[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "umrs"
version = "0.1.0"
description = "UMRS — Unified Model Registry & Storage"
requires-python = ">=3.10"
dependencies = [
    "pyzmq",
    "boto3",
    "pillow",
    "psycopg2-binary",
    "tabulate",
    "pandas",
    "jsonschema",
    "charset-normalizer",
    "requests",
    "configparser",
]

[project.optional-dependencies]
client = [
    "httpx",
    "pyyaml",
    "rich>=13.0",
]
server = [
    "httpx",
    "pyyaml",
    "diskcache",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-jose[cryptography]",
    "torch",
    "torchvision",
    "transformers",
    "sentence-transformers",
    "scikit-learn",
    "spacy",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "bentoml>=1.3.0",
    "opencv-python-headless",
    "posix_ipc",
    "sysv_ipc",
]
all = [
    "umrs[client,server]",
]

[project.scripts]
umrs-client = "umrs.client.cli:main"
umrs-server = "umrs.server.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["umrs*"]

[tool.setuptools]
py-modules = ["client_umrs", "server_umrs"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    # UMRS uses callback and backend interfaces where method signatures must
    # remain stable even when an implementation does not consume every argument.
    "ARG002",
    # Pipeline steps expose optional setup/teardown hooks with default no-op
    # implementations.
    "B027",
    # Legacy control-flow and cleanup blocks are intentionally left explicit
    # where rewriting them would make review harder without changing behavior.
    "SIM102",
    "SIM105",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"umrs/jobs/ha.py" = ["E402"]
"umrs/mini-rivault-llm/tests/model-mcp-test2.py" = ["E402"]
"umrs/server/runtime.py" = ["E402"]
