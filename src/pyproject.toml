[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "umrs"
version = "0.1.0"
description = "UMRS — Unified Model Registry & Storage"
requires-python = ">=3.10"
# Base dependencies are intentionally minimal so the lightweight client install
# (``umrs[client]``) stays small. Heavy transport/storage/server dependencies
# live in the extras below. ``jsonschema`` is required at import time by the
# shared config loaders used by both client and server.
# ``r4-contracts`` is stdlib-only shared DTOs; foundation modules (skills,
# recipes, security, jobs/provenance) import it at module load. From a source
# checkout install it editable alongside umrs: ``pip install -e ../r4-contracts``.
dependencies = [
    "jsonschema",
    "r4-contracts>=0.1.0",
]

[project.optional-dependencies]
# Lightweight client: gateway-mediated operations only (HTTP via httpx/urllib).
# Includes boto3 for S3/MinIO connectivity checks and bucket access, plus
# psycopg2-binary for the `list-recovery-status` Postgres inspection helper
# (see umrs/src/client_umrs.py:_list_recovery_postgres_status).
# No pyzmq/pillow. Install with: pip install umrs[client]
client = [
    "httpx",
    "pyyaml",
    "rich>=13.0",
    "textual>=0.47",
    "boto3",
    "psycopg2-binary",
]
# OTel tracing (WP-12 round 2): no-op unless OTEL_EXPORTER_OTLP_ENDPOINT
# is set; instrumented FastAPI + OTLP/HTTP JSON exporter.
# Install with: pip install umrs[otel]
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
# Full client: adds direct ZMQ transport (pyzmq) and S3 bucket upload/download
# (boto3/pillow), plus the CURVE session bootstrap transport (requests).
# Install with: pip install umrs[client-full]
client-full = [
    "umrs[client]",
    "pyzmq",
    "boto3",
    "pillow",
    "charset-normalizer",
    "requests",
]
# Server: full client transport plus the server runtime and ML stack.
server = [
    "umrs[client-full]",
    "psycopg2-binary",
    "tabulate",
    "pandas",
    "diskcache",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-jose[cryptography]",
    "torch",
    "torchvision",
    "transformers",
    "sentence-transformers",
    "scikit-learn",
    "spacy",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "bentoml>=1.3.0",
    "opencv-python-headless",
    "sysv_ipc",
    "pypdf>=4.0",
    "python-pptx>=1.0",
]
all = [
    "umrs[server]",
]
# Minimal deps for HTTP route tests (no torch/ML stack).
api-test = [
    "fastapi",
    "httpx",
    "python-multipart",
    "boto3",
    "pytest>=7.0",
]

[project.scripts]
umrs = "umrs.client.cli:main"
umrs-client = "umrs.client.cli:main"  # backwards-compatible alias
umrs-server = "umrs.server.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["umrs*"]

[tool.setuptools]
py-modules = ["client_umrs", "server_umrs"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    # UMRS uses callback and backend interfaces where method signatures must
    # remain stable even when an implementation does not consume every argument.
    "ARG002",
    # Pipeline steps expose optional setup/teardown hooks with default no-op
    # implementations.
    "B027",
    # Legacy control-flow and cleanup blocks are intentionally left explicit
    # where rewriting them would make review harder without changing behavior.
    "SIM102",
    "SIM105",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"umrs/jobs/ha.py" = ["E402"]
"umrs/mini-rivault-llm/tests/model-mcp-test2.py" = ["E402"]
"umrs/server/runtime.py" = ["E402"]
