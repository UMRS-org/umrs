# std@1 — the L0 standard layer (ADR-081 D-3), shipped as UMRS package data.
#
# Only standard IRIs that were checked against the published vocabularies:
# PROV-O, SOSA/SSN, Web Annotation, schema.org, ML-Schema, DCTERMS, SKOS,
# OWL and BFO part-of. Nothing here is fetched at run time; stand-alone and
# air-gapped installs get these terms from the seed migration.
#
# Format (parsed by umrs.knowledge.ontologies.parse_doc): `classes`,
# `relations` and `attributes` lists; each term `id` is a CURIE whose prefix
# is declared under `prefixes`.
ontology: std
version: "1"
iri_base: ""
origin: standard
description: Standard vocabularies the r4 core profile builds on.
prefixes:
  prov: "http://www.w3.org/ns/prov#"
  sosa: "http://www.w3.org/ns/sosa/"
  oa: "http://www.w3.org/ns/oa#"
  schema: "https://schema.org/"
  mls: "http://www.w3.org/ns/mls#"
  dcterms: "http://purl.org/dc/terms/"
  skos: "http://www.w3.org/2004/02/skos/core#"
  owl: "http://www.w3.org/2002/07/owl#"
  obo: "http://purl.obolibrary.org/obo/"
imports: []
classes:
  - {id: "owl:Thing", label: Thing, bucket: entity}
  - {id: "prov:Entity", label: Entity, bucket: entity, parents: ["owl:Thing"]}
  - {id: "prov:Activity", label: Activity, bucket: entity, parents: ["owl:Thing"]}
  - {id: "prov:Agent", label: Agent, bucket: entity, parents: ["owl:Thing"]}
  - {id: "prov:Person", label: Person, bucket: entity, parents: ["prov:Agent"]}
  - {id: "prov:SoftwareAgent", label: Software agent, bucket: entity, parents: ["prov:Agent"]}
  - {id: "prov:Plan", label: Plan, bucket: entity, parents: ["prov:Entity"]}
  - {id: "sosa:Observation", label: Observation, bucket: entity, parents: ["prov:Activity"]}
  - {id: "sosa:Sensor", label: Sensor, bucket: entity, parents: ["owl:Thing"]}
  - {id: "sosa:Sample", label: Sample, bucket: entity, parents: ["owl:Thing"]}
  - {id: "sosa:FeatureOfInterest", label: Feature of interest, bucket: entity, parents: ["owl:Thing"]}
  - {id: "oa:Annotation", label: Annotation, bucket: entity, parents: ["prov:Entity"]}
  - {id: "schema:Dataset", label: Dataset, bucket: file, parents: ["prov:Entity"]}
  - {id: "schema:ScholarlyArticle", label: Scholarly article, bucket: file, parents: ["prov:Entity"]}
  - {id: "schema:SoftwareSourceCode", label: Software source code, bucket: module, parents: ["prov:Entity"]}
  - {id: "schema:VideoObject", label: Video object, bucket: file, parents: ["prov:Entity"]}
  - {id: "schema:ImageObject", label: Image object, bucket: file, parents: ["prov:Entity"]}
  - {id: "mls:Run", label: Run, bucket: entity, parents: ["prov:Activity"]}
  - {id: "mls:Model", label: Model, bucket: entity, parents: ["prov:Entity"]}
  - {id: "skos:Concept", label: Concept, bucket: concept, parents: ["owl:Thing"]}
relations:
  - {id: "skos:related", label: related}
  - {id: "skos:broader", label: broader, transitive: true}
  - {id: "owl:sameAs", label: same as, transitive: true}
  - {id: "obo:BFO_0000050", label: part of, transitive: true}
  - {id: "dcterms:hasPart", label: has part}
  - {id: "dcterms:references", label: references}
  - {id: "prov:wasGeneratedBy", label: was generated by}
  - {id: "prov:wasDerivedFrom", label: was derived from}
  - {id: "prov:used", label: used}
  - {id: "prov:wasAttributedTo", label: was attributed to}
  - {id: "oa:hasTarget", label: has target}
  - {id: "oa:hasBody", label: has body}
  - {id: "sosa:madeBySensor", label: made by sensor}
  - {id: "sosa:hasFeatureOfInterest", label: has feature of interest}
attributes:
  - {id: "dcterms:title", label: title, datatype: string}
  - {id: "dcterms:created", label: created, datatype: datetime}
  - {id: "dcterms:identifier", label: identifier, datatype: string}
