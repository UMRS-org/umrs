# Recommended web sites for knowledge ingest (URL and git repo ingest).
#
# A front's site.yaml uses this list with the entry "@recommended":
#
#   extra:
#     knowledge_ingest:
#       allowed_domains: ["@recommended", "lab.example.org"]
#
# Entry forms: "example.org" (that host only), "*.example.org" (every
# subdomain, not the apex itself, so both are listed where the apex is used),
# "host:8443" (that host on port 8443; ports 80 and 443 need no entry).
#
# Every fetch still passes the network guards, whatever the list says: the
# host must resolve only to public (global unicast) addresses, the connection
# goes to the address that was checked, every redirect hop is checked again
# against the list, the body is capped in size and time, and the content is
# scanned for credentials and personal data before it is stored.
#
# A public address is not always an outside one: RIKEN's own network
# (134.160.0.0/16, intranet hosts included) is global unicast. So this list
# names RIKEN's public web sites one by one, never "*.riken.jp", and each
# front's site.yaml denies the site's own range with
# extra.knowledge_ingest.denied_networks (review 2026-10-25).
#
# DOI links redirect to the publisher's site and every hop is re-checked, so
# the publishers below must be listed for doi.org links to work. A few DOI
# chains still fail by design: IEEE and Springer books redirect https DOIs to
# plain http (an https fetch never goes down to http), and RSC goes through
# more than 5 redirects. For those, ingest the publisher's https article URL.
#
# GitHub, GitLab, Hugging Face, Zenodo and figshare carry user-uploaded
# content. The content scan and the size caps apply to it like to any other
# page. Operators who want a stricter list replace "@recommended" with
# explicit entries. Generic file hosts and paste sites (pastebin, Dropbox,
# Google Drive and the like) are deliberately not listed.
#
# Packaged with umrs (src/pyproject.toml [tool.setuptools.package-data]);
# read by umrs.knowledge.ingest_allowlist. Changes reach a front at its next
# converge deploy.

