server {
    listen 4000;
    server_name localhost;

    location / {
        proxy_pass http://litellm:4000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # (Optional) Disable proxy buffering for better streaming response from models
        proxy_buffering off;
        ### (Optional) Increase max request size for large attachments and long audio messages
        client_max_body_size 1M;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }

    # BentoML Vision Service (SAM3 + HMAE)
    # Routed through NGINX so all traffic enters via a single SSH-tunneled port.
    location /vision/ {
        proxy_pass http://bentoml-vision:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Vision payloads (images) can be large
        client_max_body_size 50M;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }
}
