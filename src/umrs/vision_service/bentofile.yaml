service: "umrs.vision_service.service:VisionModelService"
labels:
  owner: umrs
  project: vision-models
include:
  - "umrs/**/*.py"
  - "umrs/**/*.yaml"
python:
  packages:
    - torch>=2.0.0
    - torchvision
    - transformers>=4.50.0
    - numpy
    - opencv-python
    - Pillow
    - pyyaml
    - matplotlib
    - boto3
    - bentoml
docker:
  python_version: "3.11"
  system_packages:
    - libgl1-mesa-glx
    - libglib2.0-0
