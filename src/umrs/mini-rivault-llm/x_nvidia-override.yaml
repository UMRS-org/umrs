services:
  vllm:
    shm_size: ${VLLM_NCCL_MEM_LIMIT:?error}
    devices:
      # Direct device mapping — Podman 4.9.3 on RCCS cannot resolve CDI
      # devices via podman-compose (nvidia.com/gpu=all is unresolvable).
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - /dev/nvidia-caps/nvidia-cap1
      - /dev/nvidia-caps/nvidia-cap2
    volumes:
      # Mount NVIDIA driver libraries so vLLM can detect the GPU.
      # Without these, vLLM fails with "Failed to infer device type".
      # NOTE (2026-08-12): only the two user-mode driver libs are mounted.
      # The previous whole-dir mount of /usr/lib/aarch64-linux-gnu SHADOWED the
      # image's own toolchain libs (binutils 2.38-era libopcodes/libbfd), so
      # every `as` (assembler) invocation inside the container died:
      #   libopcodes-2.38-system.so: cannot open shared object file
      # (host GB10 ships 2.42 only). Individual file binds never shadow.
      - /usr/lib/aarch64-linux-gnu/libcuda.so.1:/usr/lib/aarch64-linux-gnu/libcuda.so.1:ro
      - /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:/usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  bentoml-vision:
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - /dev/nvidia-caps/nvidia-cap1
      - /dev/nvidia-caps/nvidia-cap2
    volumes:
      - /usr/lib/aarch64-linux-gnu/libcuda.so.1:/usr/lib/aarch64-linux-gnu/libcuda.so.1:ro
      - /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:/usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
