# =============================================================================
# Demo Always-On LLM Stack
# =============================================================================
# Reuses the Rivault service pattern (vLLM + LiteLLM + NGINX) but runs as
# a persistent service (not launched via Slurm). Adds OpenWebUI for chat
# and the UMRS RAG service for document Q&A.
#
# Usage (from demos/slurm-dev/):
#   # Create the private network first
#   podman network create --internal --disable-dns \
#       --subnet 192.168.5.0/24 demo-llm-net || true
#
#   # Launch
#   podman-compose --env-file rivault/demo-llm.env \
#       -f rivault/demo-llm.yaml \
#       -f rivault/x_nvidia-override.yaml \
#       up -d
#
#   # Stop
#   podman-compose --env-file rivault/demo-llm.env \
#       -f rivault/demo-llm.yaml \
#       -f rivault/x_nvidia-override.yaml \
#       down
#
# Ports exposed on the host:
#   13000 - OpenWebUI chat interface
#   14000 - NGINX → LiteLLM OpenAI-compatible API
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # NGINX reverse proxy (LiteLLM gateway)
  # ---------------------------------------------------------------------------
  nginx:
    image: docker.io/nginx:${NGINX_DOCKER_TAG:-stable-alpine-slim}
    networks:
      demo-llm-net: {}
    extra_hosts:
      - litellm:${PRIV_IP1TO3:-192.168.5}.${LITELLM_IP4:-20}
    ports:
      - ${NGINX_LITELLM_DOCKER_PORT:-14000}:4000
    volumes:
      - type: bind
        source: ./nginx_fs/umrs.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      - litellm
    environment:
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice, chown, dac_override, setgid, setuid, net_bind_service ]

  # ---------------------------------------------------------------------------
  # LiteLLM proxy (OpenAI-compatible API)
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm-non_root:${LITELLM_DOCKER_TAG:-main-stable}
    command: --port 4000 --config /config.yaml
    networks:
      demo-llm-net:
        ipv4_address: ${PRIV_IP1TO3:-192.168.5}.${LITELLM_IP4:-20}
    extra_hosts:
      - ll-postgres:${PRIV_IP1TO3:-192.168.5}.${LL_POSTGRES_IP4:-21}
      - vllm:${PRIV_IP1TO3:-192.168.5}.${VLLM_IP4:-22}
      - mcpo:${PRIV_IP1TO3:-192.168.5}.${MCPO_IP4:-23}
    user: "0:0"
    volumes:
      - type: bind
        source: ./litellm_fs/config.yaml
        target: /config.yaml
        read_only: true
    depends_on:
      - ll-postgres
      - vllm
      - mcpo
    environment:
      DISABLE_ADMIN_UI: "True"
      LITELLM_MODE: "PRODUCTION"
      LITELLM_LOG: "INFO"
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      NUM_WORKERS: ${LITELLM_CPU_LIMIT:-4}
      DATABASE_URL: postgresql://${LITELLM_POSTGRES_USER:-postgres}:${LITELLM_POSTGRES_PASSWORD:-litellm}@ll-postgres:5432/${LITELLM_POSTGRES_DB:-litellm}
      MCPO_API_KEY: ${MCPO_API_KEY}
      VLLM_API_KEY: ${VLLM_API_KEY}
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]

  # ---------------------------------------------------------------------------
  # LiteLLM internal postgres (ephemeral)
  # ---------------------------------------------------------------------------
  ll-postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    networks:
      demo-llm-net:
        ipv4_address: ${PRIV_IP1TO3:-192.168.5}.${LL_POSTGRES_IP4:-21}
    tmpfs:
      - /var/run/postgresql
    environment:
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice, setuid, setgid, chown ]

  # ---------------------------------------------------------------------------
  # vLLM inference engine
  # ---------------------------------------------------------------------------
  vllm:
    image: docker.io/vllm/vllm-openai:${VLLM_DOCKER_TAG:-v0.20.0}
    networks:
      demo-llm-net:
        ipv4_address: ${PRIV_IP1TO3:-192.168.5}.${VLLM_IP4:-22}
    volumes:
      - type: bind
        source: ${VLLM_PATH_TO_HUGGINGFACE}/
        target: /root/.cache/huggingface
        read_only: true
      - type: bind
        source: ${VLLM_PATH_TO_HUGGINGFACE}/modules/
        target: /root/.cache/huggingface/modules/
        read_only: false
    command:
      - ${VLLM_MODEL}
      - --served-model-name
      - umrs
      - --api-key
      - ${VLLM_API_KEY:?VLLM_API_KEY must be set}
      - -tp
      - ${VLLM_TP:-1}
      - -pp
      - ${VLLM_PP:-1}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEM_UTIL:-0.90}
      - --enforce-eager
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${VLLM_TOOL_CALL_PARSER:-hermes}
    environment:
      TRANSFORMERS_OFFLINE: 1
      HF_HUB_OFFLINE: 1
      VLLM_NO_USAGE_STATS: 1
      VLLM_API_KEY: ${VLLM_API_KEY}
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-8}
      VLLM_MM_INPUT_CACHE_GIB: 2
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TZ: ${GENAI_TZ:-Asia/Tokyo}
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]

  # ---------------------------------------------------------------------------
  # MCPO gateway (aggregates MCP tool servers)
  # ---------------------------------------------------------------------------
  mcpo:
    image: ghcr.io/open-webui/mcpo:${MCPO_DOCKER_TAG:-main}
    command: ["--port", "8000", "--api-key", "${MCPO_API_KEY:?MCPO_API_KEY must be set}", "--hot-reload", "--config", "/tmp/config.json"]
    networks:
      demo-llm-net:
        ipv4_address: ${PRIV_IP1TO3:-192.168.5}.${MCPO_IP4:-23}
    extra_hosts:
      - mcp-time:${PRIV_IP1TO3:-192.168.5}.${MCP_TIME_IP4:-24}
    volumes:
      - type: bind
        source: ./mcpo_fs/config.json
        target: /tmp/config.json
        read_only: true
    depends_on:
      - mcp-time
    environment:
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]

  # ---------------------------------------------------------------------------
  # MCP time server (tool example)
  # ---------------------------------------------------------------------------
  mcp-time:
    image: docker.io/theo01/mcp-time:${MCP_TIME_DOCKER_TAG:-latest}
    command: --transport stream --address "http://0.0.0.0:8080/mcp"
    networks:
      demo-llm-net:
        ipv4_address: ${PRIV_IP1TO3:-192.168.5}.${MCP_TIME_IP4:-24}
    environment:
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]

  # ---------------------------------------------------------------------------
  # RAG service
  # ---------------------------------------------------------------------------
  # The UMRS RAG service runs on ai-login (inside the Slurm stack) rather than
  # here, because it needs direct access to the UMRS pgvector database.
  # Enable it with UMRS_RAG_ENABLE=1 in docker-compose.yaml.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # OpenWebUI (chat interface)
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_DOCKER_TAG:-main}
    networks:
      demo-llm-net: {}
    extra_hosts:
      - litellm:${PRIV_IP1TO3:-192.168.5}.${LITELLM_IP4:-20}
    ports:
      - ${OPENWEBUI_PORT:-13000}:8080
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_AUTH: "False"
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - litellm
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]

volumes:
  open-webui-data:

networks:
  demo-llm-net:
    name: "demo-llm-net"
    external: true
