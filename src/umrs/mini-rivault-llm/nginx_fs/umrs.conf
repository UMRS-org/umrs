server {
    listen 4000;
    server_name localhost;

    # The mini-RiVault container root is read-only (Singularity/Apptainer).
    # Request bodies larger than client_body_buffer_size are spooled to a
    # temp file; if that path is not writable nginx fails the request with a
    # raw 500. Keep typical LLM chat bodies (large system prompts, tool
    # schemas, agent context) fully in memory, and point the spill path at
    # the writable tmpfs so oversized bodies still work.
    client_body_buffer_size 16m;
    client_body_temp_path /tmp/nginx_client_body;

    location / {
        proxy_pass http://litellm:4000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # (Optional) Disable proxy buffering for better streaming response from models
        proxy_buffering off;
        ### Allow large chat payloads (agent context, tool schemas, code files).
        ### Must comfortably exceed client_body_buffer_size so big contexts are
        ### accepted; 1M was too small for IDE/agent clients and forced spooling.
        client_max_body_size 64M;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }

    # BentoML Vision Service (SAM3 + HMAE)
    # Routed through NGINX so all traffic enters via a single SSH-tunneled port.
    location /vision/ {
        proxy_pass http://bentoml-vision:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Vision payloads (images) can be large
        client_max_body_size 50M;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }
}

# Direct BentoML Vision proxy (no path prefix)
# BentoML's SyncHTTPClient uses absolute paths (/readyz, /schema.json,
# /infer/submit) which bypass NGINX path-based location blocks.
# This server block provides a root-level proxy so the BentoML client
# can connect directly without path prefix issues.
server {
    listen 3001;
    server_name localhost;

    location / {
        proxy_pass http://bentoml-vision:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 50M;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }
}
