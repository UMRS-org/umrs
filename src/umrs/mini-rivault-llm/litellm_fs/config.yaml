litellm_settings:
  request_timeout: 3600    # raise Timeout error if call takes longer than 600 seconds. Default value is 6000seconds if not set
  set_verbose: False      # Switch off Debug Logging, ensure your logs do not have any debugging on
  json_logs: true         # Get debug logs in json format
  cache: False #True
  #cache_params:
  #  type: redis
  #  host: os.environ/REDIS_HOST
  #  port: os.environ/REDIS_PORT
  #  password: os.environ/REDIS_PASSWORD
  # Logging/Callback settings
  #success_callback: ["langfuse"]  # list of success callbacks
  #failure_callback: ["sentry"]  # list of failure callbacks
  #callbacks: ["otel"]  # list of callbacks - runs on success and failure
  #service_callbacks: ["datadog", "prometheus"]  # logs redis, postgres failures on datadog, prometheus
  turn_off_message_logging: False # prevent the messages and responses from being logged to on your callbacks, but request metadata will still be logged. Useful for privacy/compliance when handling sensitive data.
  redact_user_api_key_info: False #XXX: needed to identify users for now #True  # Redact information about the user api key (hashed token, user_id, team id, etc.), from logs. Currently supported for Langfuse, OpenTelemetry, Logfire, ArizeAI logging.
  langfuse_default_tags: ["cache_hit", "cache_key", "proxy_base_url", "user_api_key_alias", "user_api_key_user_id", "user_api_key_user_email", "user_api_key_team_alias", "semantic-similarity", "proxy_base_url"] # default tags for Langfuse Logging
  # Networking settings
  force_ipv4: True # If true, litellm will force ipv4 for all LLM requests. Some users have seen httpx ConnectionError when using ipv6 + Anthropic API

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY      # enter your own master key, ensure it starts with 'sk-'
  store_model_in_db: False  # Mini-RiVault serves a static config; only re-enable with an explicit DB bootstrap path.
  #alerting: ["slack"]      # Setup slack alerting - get alerts on LLM exceptions, Budget Alerts, Slow LLM Responses
  proxy_batch_write_at: 60 # Batch write spend updates every 60s
  database_connection_pool_limit: 10 # limit the number of database connections to = MAX Number of DB Connections/Number of instances of litellm proxy (Around 10-20 is good number)

  # OPTIONAL Best Practices
  disable_spend_logs: True
  disable_error_logs: True # turn off writing LLM Exceptions to DB
  allow_requests_on_db_unavailable: True # Only USE when running LiteLLM on your VPC. Allow requests to still be processed even if the DB is unavailable. We recommend doing this if you're running LiteLLM on VPC that cannot be accessed from the public internet.

