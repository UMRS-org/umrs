# more here https://docs.litellm.ai/docs/proxy/config_settings
model_list:
  - model_name: VLLM_SERVED_MODEL_NAME_PLACEHOLDER
    litellm_params:
      model: openai/VLLM_SERVED_MODEL_NAME_PLACEHOLDER
      api_key: os.environ/VLLM_API_KEY  # Must match VLLM_API_KEY in serve-model.yaml
      api_base: http://vllm:8000/v1
      keep_alive: 60m

