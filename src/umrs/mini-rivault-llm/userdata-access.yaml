name: exit

services:
  nginx:
    profiles: [ harness ]
    image: docker.io/nginx:${NGINX_DOCKER_TAG:-stable-alpine-slim}
    networks:
      genai-public-net: {}
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${NGINX_OUT_IP4:-252}
    expose:
      - ${UMRS_S3_BUCKET_PORT:-9000}
    dns:
      - ${PRIV_IP1TO3:-10.0.0}.${COREDNS_IP4:-253}
    extra_hosts:
      - coredns:${PRIV_IP1TO3:-10.0.0}.${COREDNS_IP4:-253}
    volumes:
      - type: bind
        source: ./nginx_fs/out-conf.d/
        target: /etc/nginx/conf.d/
        read_only: true
      - type: bind
        source: ./nginx_fs/out-nginx.conf.${UUID:?}
        target: /etc/nginx/nginx.conf
        read_only: true
    depends_on:
      - coredns
    environment:
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    restart: unless-stopped
    pull_policy: missing
    cap_drop: [ ALL ]
    cap_add: [ sys_nice, chown, dac_override, setgid, setuid ]  #net_bind_service
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"
    deploy:
      mode: replicated
      replicas: ${NGINX_REPLICAS:-1}
      endpoint_mode: vip
##      resources:
##        limits:
##          cpus: ${NGINX_CPU_LIMIT:-1}
##          memory: ${NGINX_MEM_LIMIT:-1}G
##        reservations:
##          cpus: 0.1
##          memory: 128M

  coredns:
    profiles: [ harness ]
    image: docker.io/coredns/coredns:${COREDNS_DOCKER_TAG:-latest}
    networks:
      genai-public-net: {}
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${COREDNS_IP4:-253}
    expose:
      - 53/udp #DNS service
    volumes:
      - type: bind
        source: ./coredns_fs/coredns.conf.${UUID:?}
        target: /etc/coredns/corefile
        read_only: true
    user: "0:0"
    command: -conf /etc/coredns/corefile
    environment:
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    restart: unless-stopped
    pull_policy: missing
    cap_drop: [ ALL ]
    cap_add: [ sys_nice, net_bind_service ]
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"
    deploy:
      mode: replicated
      replicas: ${COREDNS_REPLICAS:-1}
      endpoint_mode: vip
##      resources:
##        limits:
##          cpus: ${COREDNS_CPU_LIMIT:-1}
##          memory: ${COREDNS_MEM_LIMIT:-1}G
##        reservations:
##          cpus: 0.1
##          memory: 128M

