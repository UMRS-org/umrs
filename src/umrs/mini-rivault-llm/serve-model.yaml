x-rivault-egress-env: &rivault-egress-env
  # Proxy is only set when the 'egress' profile is active (egress-guard running).
  # Defaults to empty so that containers without egress-guard do not try to
  # route traffic through a non-existent proxy. When HTTPS_PROXY points at a
  # non-running service aiohttp creates a default SSL context which is then
  # applied to internal HTTP connections (LiteLLM → vLLM), causing spurious
  # ssl:<SSLContext> ConnectionRefused errors.
  HTTP_PROXY: "${RIVAULT_HTTP_PROXY:-}"
  HTTPS_PROXY: "${RIVAULT_HTTPS_PROXY:-}"
  NO_PROXY: "${RIVAULT_NO_PROXY:-localhost,127.0.0.1,::1,litellm,vllm,ll-postgres,coredns,nginx,egress-guard}"
  http_proxy: "${RIVAULT_HTTP_PROXY:-}"
  https_proxy: "${RIVAULT_HTTPS_PROXY:-}"
  no_proxy: "${RIVAULT_NO_PROXY:-localhost,127.0.0.1,::1,litellm,vllm,ll-postgres,coredns,nginx,egress-guard}"

services:
  nginx:
    profiles: [ harness ]
    image: docker.io/nginx:${NGINX_DOCKER_TAG:-stable-alpine-slim}
    networks:
      genai-private-net: {}
    extra_hosts:
      - litellm:${PRIV_IP1TO3:-10.0.0}.${LITELLM_IP4:-20}
      # vllm MUST be in /etc/hosts: the `location = /metrics` block does
      # `proxy_pass http://vllm:8000/metrics`, and nginx resolves upstream
      # names ONCE at startup. Without this entry nginx loses the DNS race
      # against podman's aardvark-dns and dies with `[emerg] host not found
      # in upstream "vllm"`, leaving the published LiteLLM port (4000) down
      # so the UMRS readiness poller can never reach the endpoint.
      - vllm:${PRIV_IP1TO3:-10.0.0}.${VLLM_IP4:-22}
      - bentoml-vision:${PRIV_IP1TO3:-10.0.0}.${BENTOML_VISION_IP4:-35}
    ports:
      - ${NGINX_LITELLM_DOCKER_PORT:?}:4000
      - ${BENTOML_VISION_DOCKER_PORT:-3001}:3001
    volumes:
      - type: bind
        source: ./nginx_fs/umrs.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      #- type: bind #TODO
      #  source: ./nginx_fs/ssl/
      #  target: /etc/nginx/ssl
      #  read_only: true
    depends_on:
      litellm:
        condition: service_started
    environment:
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice, chown, dac_override, setgid, setuid, net_bind_service ]
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"  # crun needs keep-id for Lustre; runc needs "host"
    deploy:
      mode: replicated
      replicas: ${NGINX_REPLICAS:-1}
      endpoint_mode: vip
      #resources:
      #  limits:
      #    cpus: ${NGINX_CPU_LIMIT:-1}
      #    memory: ${NGINX_MEM_LIMIT:-1}G
      #  reservations:
      #    cpus: "0.1"
      #    memory: "128M"

  litellm:
    profiles: [ harness ]
    image: ghcr.io/berriai/litellm-non_root:${LITELLM_DOCKER_TAG:-main-stable}
    command: --port 4000 --config /config.yaml
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${LITELLM_IP4:-20}
    extra_hosts:
      - ll-postgres:${PRIV_IP1TO3:-10.0.0}.${LL_POSTGRES_IP4:-21}
      - vllm:${PRIV_IP1TO3:-10.0.0}.${VLLM_IP4:-22}
      #- mcpo:${PRIV_IP1TO3:-10.0.0}.${MCPO_IP4:-23}  # disabled — mcpo not in use
    user: "0:0"   # Note: container runs in nobody mode, mountpoint belongs to root -> mismatch
    volumes:
      - type: bind
        source: ./litellm_fs/config.yaml.${UUID:?}
        target: /config.yaml
        read_only: true
    #depends_on:
      # ll-postgres is in the 'litellm-db' profile; enabling depends_on here
      # would break deployments that don't activate litellm-db.  LiteLLM
      # handles reconnection via backoff, and ll-postgres starts fast on tmpfs.
      #ll-postgres:
      #  condition: service_started
      #- vllm   # only available when 'vllm' profile is active
      #- mcpo   # commented out — mcpo/mcp-* disabled for now
    environment:
      <<: *rivault-egress-env
      DISABLE_ADMIN_UI: "True"
      LITELLM_MODE: "PRODUCTION"
      LITELLM_LOG: "INFO"
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?} # used for postgres db encryption
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?} # admin key is required to access admin functions, like generating user API keys, ensure it starts with 'sk-'
      MAX_REQUESTS_BEFORE_RESTART: ${LITELLM_MAX_REQUESTS_BEFORE_RESTART:-10000}
      #LANGFUSE_HOST: http://langfuse-web:3000
      #LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?}
      #LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?}
      # R-FastStart: 1 worker = 1 Python process; enough for async mini-rivault.
      # 8 workers fork 8 full Python imports (~60-90 s); 1 worker cuts that to ~20-30 s.
      # Set LITELLM_CPU_LIMIT to a higher value only if you need parallelism.
      NUM_WORKERS: ${LITELLM_CPU_LIMIT:-1}
      DATABASE_URL: ${LITELLM_DATABASE_URL:-} # Set via LITELLM_DATABASE_URL env var; enable 'litellm-db' profile for the ll-postgres container.
      DISABLE_SCHEMA_UPDATE: "${LITELLM_DISABLE_SCHEMA_UPDATE:-false}"  # Set true only when running without litellm-db profile
      # R-FastStart: Disable LiteLLM telemetry — it tries to reach litellm.ai on
      # startup; with egress blocked the connection times out, adding 10-30 s.
      LITELLM_TELEMETRY: "False"
      # Disable spend logs only when DATABASE_URL is empty.
      DISABLE_SPEND_LOGS: "${LITELLM_DISABLE_SPEND_LOGS:-False}"
      #MCPO_API_KEY: ${MCPO_API_KEY:?}  # disabled — mcpo not in use
      VLLM_API_KEY: ${VLLM_API_KEY:?}
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      CUSTOM_TIKTOKEN_CACHE_DIR: "/usr/lib/python3.13/site-packages/litellm/litellm_core_utils/tokenizers"  # Note: temp workaround for issue #19852
    # Healthchecks removed (2026-08-12): podman on slurm-launched GB10 jobs has
    # no per-job systemd unit channel, so any healthchecked container fails to
    # start (runc: can't get final child's PID from pipe: EOF). Readiness stays
    # with the UMRS readiness poller + wrapper curl probes (pre-existing path).
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"
    deploy:
      mode: replicated
      replicas: ${LITELLM_REPLICAS:-1}
      endpoint_mode: vip
##      resources:
##        limits:
##          cpus: ${LITELLM_CPU_LIMIT:-8}
##          memory: ${LITELLM_MEM_LIMIT:-8}G
##        reservations:
##          cpus: "0.1"
##          memory: "128M"

  ll-postgres:
    profiles: [ litellm-db ]  # Opt-in: add 'litellm-db' profile + set LITELLM_DATABASE_URL to enable.
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${LL_POSTGRES_IP4:-21}
    # Minimal proven-good spec (2026-08-12): this runtime cannot start the old
    # "user 0:0 + cap_drop/userns_mode/tmpfs" shape — runc create dies with
    # 'can't get final child's PID from pipe' (the userns_mode key is not
    # honoured by podman-compose, so the container ends up in a private userns
    # where the tmpfs/user combo cannot exec). BUT the pure tmpfs spec below is
    # the manually verified working invocation.
    # NOTE: bare /tmp is NOT sufficient as the socket dir: the postgres
    # entrypoint drops privileges to uid 999 (postgres), which cannot write to
    # this rootless container's /tmp ("Operation not permitted"). A tmpfs mount
    # lands with world-writable perms and works (verified live).
    tmpfs:
      - /var/run/postgresql
    command: ["postgres", "-c", "unix_socket_directories=/var/run/postgresql"]
    environment:
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      PGTZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    # Healthchecks removed (2026-08-12): healthchecked containers cannot be
    # created at all on this runtime (runc PID-pipe EOF). Readiness via the
    # UMRS readiness poller + wrapper probes instead.
    deploy:
      mode: replicated
      replicas: ${POSTGRES_REPLICAS:-1}
      endpoint_mode: vip
##      resources:
##        limits:
##          cpus: ${POSTGRES_CPU_LIMIT:-8}
##          memory: ${POSTGRES_MEM_LIMIT:-8}G
##        reservations:
##          cpus: "0.1"
##          memory: "128M"

  vllm:
    profiles: [ vllm ]
    # VLLM_DOCKER_IMAGE lets a partition profile override the full image
    # (repo + tag), e.g. ROCm nodes set docker.io/vllm/vllm-openai-rocm:latest.
    # When unset, fall back to the CUDA image parameterised by VLLM_DOCKER_TAG.
    # NOTE: VLLM_DOCKER_IMAGE must be computed in the wrapper env file
    # (serve-model.slurm) because podman-compose dotenv parser cannot handle
    # nested default substitution like ${X:-${Y:-z}}.
    image: ${VLLM_DOCKER_IMAGE:-docker.io/vllm/vllm-openai:v0.20.0}
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${VLLM_IP4:-22}
    extra_hosts:
      - ${UMRS_S3_BUCKET_HOST:?}:${PRIV_IP1TO3:-10.0.0}.${NGINX_OUT_IP4:-252}
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - /dev/nvidia-caps/nvidia-cap1
      - /dev/nvidia-caps/nvidia-cap2
    volumes:
      - type: bind
        source: ${VLLM_PATH_TO_HUGGINGFACE:?}/
        target: /root/.cache/huggingface
        read_only: true
      - type: bind
        source: ${VLLM_PATH_TO_HUGGINGFACE:?}/modules/
        target: /root/.cache/huggingface/modules/
        read_only: false
      - type: bind
        source: ${VLLM_HOST_MODEL_PATH:?}
        target: ${VLLM_CONTAINER_MODEL_PATH:?}
        read_only: true
      # Tokenizer directory (required when model weights are a GGUF file
      # or when the tokenizer lives in a separate directory from the weights).
      - type: bind
        source: ${VLLM_TOKENIZER_HOST_PATH:-/dev/null}
        target: ${VLLM_TOKENIZER_CONTAINER_PATH:-/tokenizer}
        read_only: true
      # Mount NVIDIA driver libraries so vLLM can detect the GPU.
      # Mount ONLY the nvidia libs, not the whole /usr/lib/aarch64-linux-gnu,
      # to avoid clobbering the container's own system libraries.
      - type: bind
        source: /usr/lib/aarch64-linux-gnu/libcuda.so.1
        target: /usr/lib/aarch64-linux-gnu/libcuda.so.1
        read_only: true
      - type: bind
        source: /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1
        target: /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1
        read_only: true
      # Optional operator-declared patch mount (M6): space-free
      # `src:target:ro` tuple produced by the serve-model.slurm patch loop
      # after sha256 verification. Default is an inert /dev/null stub.
      - type: bind
        source: ${VLLM_PATCH_SRC_VOLS:-/dev/null}
        target: ${VLLM_PATCH_TGT_VOLS:-/dev/null}
        read_only: true
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - |
        set -eu
        # On GB10 DGX-Spark (RCCS_SKIP_CDI=1) the nvidia CDI hook is skipped so
        # ldconfig is stale/missing inside the container.  The bind-mounted
        # libcuda.so.1 + LD_LIBRARY_PATH (see environment block) makes the
        # dynamic linker and Triton find the GPU without needing an ldconfig
        # run inside the container.
        # NOTE: entrypoint is /bin/sh (dash/busybox) — do NOT use `pipefail`.
        if [ "$${TRANSFORMERS_OFFLINE:-0}" != "1" ]; then
          echo "FAIL: TRANSFORMERS_OFFLINE=$${TRANSFORMERS_OFFLINE:-not set} (expected 1)"; exit 1
        fi
        if [ "$${HF_HUB_OFFLINE:-0}" != "1" ]; then
          echo "FAIL: HF_HUB_OFFLINE=$${HF_HUB_OFFLINE:-not set} (expected 1)"; exit 1
        fi
        for _proxy in "$${http_proxy:-}" "$${HTTP_PROXY:-}" "$${https_proxy:-}" "$${HTTPS_PROXY:-}"; do
          if [ -n "$$_proxy" ]; then
            echo "FAIL: proxy env set — proxy forbidden in offline mode"; exit 1
          fi
        done
        echo "OK: offline invariants satisfied"
        pip install -q ray 2>/dev/null || true
        exec vllm serve "$$VLLM_MODEL_REF" $$VLLM_EXTRA_ARGS $${VLLM_SPECULATIVE_CONFIG:+--speculative-config "$$VLLM_SPECULATIVE_CONFIG"} --served-model-name "$$VLLM_SERVED_MODEL_NAME" --api-key "$$VLLM_API_KEY" -tp "$$VLLM_TP" -pp "$$VLLM_PP" $${VLLM_DISTRIBUTED_EXECUTOR_BACKEND:+--distributed-executor-backend $$VLLM_DISTRIBUTED_EXECUTOR_BACKEND} --max-model-len "$${VLLM_MAX_MODEL_LEN:-4096}" --gpu-memory-utilization "$${VLLM_GPU_MEM_UTIL:-0.95}" $${VLLM_LANGUAGE_MODEL_ONLY:+--language-model-only} $${VLLM_KV_CACHE_MEMORY_BYTES:+--kv-cache-memory-bytes "$$VLLM_KV_CACHE_MEMORY_BYTES"} $${VLLM_MAX_NUM_SEQS:+--max-num-seqs "$$VLLM_MAX_NUM_SEQS"} $${VLLM_MAX_NUM_BATCHED_TOKENS:+--max-num-batched-tokens "$$VLLM_MAX_NUM_BATCHED_TOKENS"} $${VLLM_ENFORCE_EAGER:+--enforce-eager} --enable-auto-tool-choice --tool-call-parser "$${VLLM_TOOL_CALL_PARSER:-hermes}" $${VLLM_REASONING_PARSER:+--reasoning-parser "$$VLLM_REASONING_PARSER"}
    environment:
      <<: *rivault-egress-env
      ##TORCH_USE_RTLD_GLOBAL: 1
      ##VLLM_USE_TRTLLM_ATTENTION: 1
      ##VLLM_USE_TRTLLM_DECODE_ATTENTION: 1
      ##VLLM_USE_TRTLLM_CONTEXT_ATTENTION: 1
      #VLLM_USE_FLASHINFER_MXFP4_MOE: 1
      ##VLLM_ATTENTION_BACKEND: "TRITON_ATTN_VLLM_V1"
      TIKTOKEN_RS_CACHE_DIR: ${VLLM_MODEL_TIKTOKEN:-""}
      # On GB10 DGX-Spark (RCCS_SKIP_CDI=1) the nvidia CDI hook is skipped so
      # the container ld.so.cache is stale and Triton cannot find libcuda.
      # Bind-mount individual libs above; add LD_LIBRARY_PATH so the dynamic
      # linker (and Triton's fallback os.path.search) can locate them even
      # without an ldconfig run inside the container.
      LD_LIBRARY_PATH: ${VLLM_LD_LIBRARY_PATH:-/usr/lib/aarch64-linux-gnu}
      # Also point Triton at the bind-mounted lib dir.
      TRITON_LIBCUDA_PATH: ${VLLM_TRITON_LIBCUDA_PATH:-/usr/lib/aarch64-linux-gnu}
      TRANSFORMERS_OFFLINE: 1
      HF_HUB_OFFLINE: 1
      VLLM_NO_USAGE_STATS: 1
      VLLM_API_KEY: ${VLLM_API_KEY:?}
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-8}
      VLLM_MODEL_REF: ${VLLM_MODEL_REF:?}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
      VLLM_SERVED_MODEL_NAME: ${VLLM_SERVED_MODEL_NAME:?}
      VLLM_TP: ${VLLM_TP:-1}
      VLLM_PP: ${VLLM_PP:-1}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-4096}
      VLLM_GPU_MEM_UTIL: ${VLLM_GPU_MEM_UTIL:-0.95}
      # Typed engine lanes (empty = flag off; recipe/spec materializes them)
      VLLM_LANGUAGE_MODEL_ONLY: ${VLLM_LANGUAGE_MODEL_ONLY:-}
      VLLM_KV_CACHE_MEMORY_BYTES: ${VLLM_KV_CACHE_MEMORY_BYTES:-}
      VLLM_MAX_NUM_SEQS: ${VLLM_MAX_NUM_SEQS:-}
      VLLM_MAX_NUM_BATCHED_TOKENS: ${VLLM_MAX_NUM_BATCHED_TOKENS:-}
      VLLM_TOOL_CALL_PARSER: ${VLLM_TOOL_CALL_PARSER:-hermes}
      # Must be declared here or the roster value never reaches the container:
      # the command uses ${VLLM_REASONING_PARSER:+--reasoning-parser ...}, which
      # is expanded by the *container* shell. Undeclared => flag silently
      # dropped => reasoning stays inline in `content` instead of being split
      # into `reasoning_content`, so clients render raw chain-of-thought.
      # Empty default keeps the flag off for non-reasoning models.
      VLLM_REASONING_PARSER: ${VLLM_REASONING_PARSER:-}
      # Opt-in eager mode. Empty by default so models run WITH CUDA graphs
      # (much higher decode throughput). Models that need eager (e.g.
      # DeepSeek-V4 NaN guard, GLM-5.2) set VLLM_ENFORCE_EAGER=1 in their
      # pool env_vars, which turns the --enforce-eager flag back on.
      VLLM_ENFORCE_EAGER: ${VLLM_ENFORCE_EAGER:-}
      # Multi-node distributed executor ('ray' for multi-node PP)
      VLLM_DISTRIBUTED_EXECUTOR_BACKEND: ${VLLM_DISTRIBUTED_EXECUTOR_BACKEND:-}
      # Ray cluster address (head_ip:port; set by multi-node bootstrap)
      RAY_ADDRESS: ${RAY_ADDRESS:-}
      #VLLM_LOGGING_LEVEL: DEBUG
      #LLM_TRACE_FUNCTION: 1
      #NCCL_DEBUG: INFO
      # Note: VLLM_MM_INPUT_CACHE_GIB removed — unknown to vLLM <0.20 and
      # causes "Unknown vLLM environment variable" warnings. Re-add when
      # the base image is upgraded to >=0.20.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TZ: ${GENAI_TZ:-Asia/Tokyo}
    # Healthchecks removed (2026-08-12): rootless podman on this runtime
    # cannot start any healthchecked container (runc PID-pipe EOF at create).
    # vLLM readiness = wrapper curl probe + UMRS readiness poller instead.
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"
    deploy:
      mode: replicated
      replicas: ${VLLM_REPLICAS:-1}
      endpoint_mode: vip
##      resources:
##        limits:
##          cpus: ${VLLM_CPU_LIMIT:-4}
##          memory: ${VLLM_MEM_LIMIT:-4}G
##        reservations:
##          cpus: "0.1"
##          memory: "128M"

