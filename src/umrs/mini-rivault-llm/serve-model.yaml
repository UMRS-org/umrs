## ── end mcpo / mcp-* ─────────────────────────────────────────────────

  # Vision MCP server wrapping SAM3 for image segmentation
  # bug.memo B4 (Phase 2h, 2026-04-25): retargeted from the published
  # ghcr.io/riken-rccs/r4-mcp image to the locally-built
  # r4-mcp image (mcp-servers/Dockerfile). Override via MCP_VISION_IMAGE
  # if you need a different build.
  mcp-vision:
    profiles: [ vision ]
    image: ${MCP_VISION_IMAGE:-localhost/r4-mcp:${MCP_VISION_DOCKER_TAG:-latest}}
    command: python -m r4_mcp.servers.vision
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${MCP_VISION_IP4:-25}
    extra_hosts:
      - ${UMRS_S3_BUCKET_HOST:?}:${PRIV_IP1TO3:-10.0.0}.${NGINX_OUT_IP4:-252}
    volumes:
      - type: bind
        source: ${VISION_MODEL_PATH:-/models/sam3}
        target: /models/sam3
        read_only: true
      - type: tmpfs
        target: /tmp/vision_outputs
    environment:
      <<: *rivault-egress-env
      UMRS_SAM3_MODEL_PATH: /models/sam3
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      # GPU access - set to specific device or leave for auto
      # Note: CUDA_VISIBLE_DEVICES not set to allow GPU access
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"
    deploy:
      mode: replicated
      replicas: ${MCP_VISION_REPLICAS:-1}
      endpoint_mode: vip
##      resources:
##        limits:
##          cpus: ${MCP_VISION_CPU_LIMIT:-4}
##          memory: ${MCP_VISION_MEM_LIMIT:-16}G
##        reservations:
##          cpus: "0.1"
##          memory: "128M"

  # EgressGuard: Controlled egress proxy for MCP servers
  # Only enabled for project/user tier instances that need external access
  egress-guard:
    profiles: [ egress ]
    image: ghcr.io/riken-rccs/egress-guard:${EGRESS_GUARD_DOCKER_TAG:-latest}
    command: --port ${EGRESS_PROXY_PORT:-8888}
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${EGRESS_GUARD_IP4:-30}
    volumes:
      - type: bind
        source: ${EGRESS_AUDIT_LOG_PATH:-/var/log/egress-guard}
        target: /var/log/egress-guard
        read_only: false
    environment:
      EGRESS_GUARD_ENABLED: ${EGRESS_GUARD_ENABLED:-true}
      EGRESS_PROXY_PORT: ${EGRESS_PROXY_PORT:-8888}
      EGRESS_DOMAIN_ALLOWLIST: ${EGRESS_DOMAIN_ALLOWLIST:-}
      EGRESS_BLOCK_PATTERNS: ${EGRESS_BLOCK_PATTERNS:-password|secret|api_key}
      EGRESS_MAX_RESPONSE_MB: ${EGRESS_MAX_RESPONSE_MB:-100}
      EGRESS_RATE_LIMIT_RPM: ${EGRESS_RATE_LIMIT_RPM:-60}
      EGRESS_LOG_BODIES: ${EGRESS_LOG_BODIES:-false}
      INSTANCE_ID: ${RIVAULT_INSTANCE_ID:-unknown}
      OWNER_ID: ${RIVAULT_OWNER_ID:-unknown}
      TIER: ${RIVAULT_TIER:-user}
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice, net_bind_service ]
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip

  # Custom MCP server runner (for user-mounted MCP servers)
  # Mount point: /mcp-servers/<name>/ with config.json
  # bug.memo B4 (Phase 2h, 2026-04-25): retargeted to local r4-mcp
  # image. The custom-mcp runner currently ships as a stub in r4_mcp;
  # override MCP_CUSTOM_IMAGE if you need the published implementation.
  mcp-custom:
    profiles: [ custom-mcp ]
    image: ${MCP_CUSTOM_IMAGE:-localhost/r4-mcp:${MCP_CUSTOM_DOCKER_TAG:-latest}}
    command: python -m r4_mcp.runners.custom_mcp --config-dir /mcp-servers --transport sse --port ${MCP_CUSTOM_PORT:-8080}
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${MCP_CUSTOM_IP4:-31}
    extra_hosts:
      - egress-guard:${PRIV_IP1TO3:-10.0.0}.${EGRESS_GUARD_IP4:-30}
    volumes:
      # User-mounted MCP servers (read-only)
      - type: bind
        source: ${MCP_SERVERS_PATH:-/tmp/mcp-servers}
        target: /mcp-servers
        read_only: true
      # Scratch space for temporary files
      - type: tmpfs
        target: /scratch
    environment:
      <<: *rivault-egress-env
      # Route all external traffic through EgressGuard
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    depends_on:
      - egress-guard
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip

  # RAG service (inside mini-rivault for security compliance)
  # Mount point: /project/ for data, /rag-index/ for pre-built index
  rag:
    profiles: [ rag ]
    image: ${RAG_IMAGE:-localhost/umrs-rag:${RAG_DOCKER_TAG:-latest}}
    command: python -m umrs.api.rag_service --port 8100
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${RAG_IP4:-32}
    extra_hosts:
      - vllm:${PRIV_IP1TO3:-10.0.0}.${VLLM_IP4:-22}
      - ${UMRS_S3_BUCKET_HOST:?}:${PRIV_IP1TO3:-10.0.0}.${NGINX_OUT_IP4:-252}
    volumes:
      # Tokenizer directory (if separate from model, e.g. GGUF models)
      - type: bind
        source: ${VLLM_TOKENIZER_HOST_PATH:-/dev/null}
        target: ${VLLM_TOKENIZER_CONTAINER_PATH:-/tokenizer}
        read_only: true
      # Project data directory (read-only)
      - type: bind
        source: ${PROJECT_DATA_PATH:-/tmp/project-data}
        target: /project
        read_only: true
      # Pre-built RAG index (read-only)
      - type: bind
        source: ${RAG_INDEX_PATH:-/tmp/rag-index}
        target: /rag-index
        read_only: true
      # Scratch for temporary processing
      - type: tmpfs
        target: /scratch
    environment:
      <<: *rivault-egress-env
      RAG_INDEX_PATH: /rag-index
      PROJECT_DATA_PATH: /project
      VLLM_BASE_URL: http://vllm:8000
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    depends_on:
      - vllm
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip

  # NOTE: The Assistant Service (ADR-012) has been moved to the frontend
  # server. It is no longer co-located inside mini-RiVault on the compute
  # node. See deploy/ansible/roles/front_end/templates/frontend-assistant-service.yaml.j2
  # for the frontend deployment manifest.

  # BentoML Vision Service (generic adapter-based inference)
  # Provides async task queue API: POST /infer/submit, GET /infer/status, GET /infer/get
  bentoml-vision:
    profiles: [ vision-bentoml ]
    image: ${BENTOML_VISION_IMAGE:-ghcr.io/riken-rccs/umrs-vision:latest}
    command: bentoml serve umrs.vision_service.service:VisionModelService --port 3000
    restart: on-failure
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${BENTOML_VISION_IP4:-35}
    extra_hosts:
      - ${UMRS_S3_BUCKET_HOST:?}:${PRIV_IP1TO3:-10.0.0}.${NGINX_OUT_IP4:-252}
      - minio-host:host-gateway
    depends_on:
      - nginx
    # Healthchecks removed (2026-08-12): runc cannot create healthchecked
    # containers on this runtime (PID-pipe EOF). Readiness via UMRS poller.
    volumes:
      # SAM3 model weights
      - type: bind
        source: ${SAM3_MODEL_PATH:-/models/sam3}
        target: /models/sam3
        read_only: true
      # HMAE model checkpoint and config
      - type: bind
        source: ${HMAE_MODEL_PATH:-/models/hmae}
        target: /models/hmae
        read_only: true
      # User model weights (optional — set USER_MODEL_PATH on the host)
      - type: bind
        source: ${USER_MODEL_PATH:-/tmp}
        target: /models/user
        read_only: true
      # Scratch space for temporary outputs
      - type: tmpfs
        target: /tmp/vision_outputs
      # Built-in adapters (SAM3, HMAE) — shipped with the source tree
      - type: bind
        source: ${DEFAULT_ADAPTERS_DIR:-../vision_service/default_adapters}
        target: /adapters/system
        read_only: true
      # User-provided adapters (drop .py + optional requirements.txt here)
      - type: bind
        source: ${USER_ADAPTERS_DIR:-./user_adapters}
        target: /adapters/user
        read_only: true
      # Debug: mount live service.py from source tree for hot-patching
      - type: bind
        source: ${VISION_SERVICE_SOURCE:-../vision_service/service.py}
        target: /app/umrs/vision_service/service.py
        read_only: true
      # Hot-patch output_specs.py so new artifact declarations take effect
      # without rebuilding the container image.
      - type: bind
        source: ${VISION_OUTPUT_SPECS_SOURCE:-../vision_service/output_specs.py}
        target: /app/umrs/vision_service/output_specs.py
        read_only: true
      # Hot-patch inference modules from source tree
      - type: bind
        source: ${INFERENCE_SAM3_SOURCE:-../inference/sam3_segmentation.py}
        target: /app/umrs/inference/sam3_segmentation.py
        read_only: true
    environment:
      <<: *rivault-egress-env
      SAM3_MODEL_PATH: /models/sam3
      HMAE_CONFIG_PATH: /models/hmae/infer_hmae_vit_b.yaml
      HMAE_CHECKPOINT: /models/hmae/latest_checkpoint.pth
      USER_MODEL_PATH: /models/user
      VISION_REQUIRE_PRESIGNED_URLS: ${VISION_REQUIRE_PRESIGNED_URLS:-true}
      MAX_VISION_MODELS: ${MAX_VISION_MODELS:-3}
      VISION_ADAPTERS_DIR: /adapters/system:/adapters/user
      VISION_ADAPTERS: ${VISION_ADAPTERS:-}
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TZ: ${GENAI_TZ:-Asia/Tokyo}
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
    userns_mode: "${RIVAULT_USERNS_MODE:-keep-id:uid=0,gid=0}"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip

