services:
  nginx:
    profile: [ harness ]
    image: docker.io/nginx:${NGINX_DOCKER_TAG:-stable-alpine-slim}
    networks:
      genai-private-net: {}
    extra_hosts:
      - litellm:${PRIV_IP1TO3:-10.0.0}.${LITELLM_IP4:-20}
    ports:
      - ${NGINX_LITELLM_DOCKER_PORT:?}:4000
    volumes:
      - type: bind
        source: ./nginx_fs/umrs.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: { selinux: "Z" }
      #- type: bind #TODO
      #  source: ./nginx_fs/ssl/
      #  target: /etc/nginx/ssl
      #  read_only: true
    depends_on:
      - litellm
    environment:
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice, chown, dac_override, setgid, setuid, net_bind_service ]
    deploy:
      mode: replicated
      replicas: ${NGINX_REPLICAS:-1}
      endpoint_mode: vip
      #resources:
      #  limits:
      #    cpus: ${NGINX_CPU_LIMIT:-1}
      #    memory: ${NGINX_MEM_LIMIT:-1}G
      #  reservations:
      #    cpus: "0.1"
      #    memory: "128M"

  litellm:
    profile: [ harness ]
    image: ghcr.io/berriai/litellm-non_root:${LITELLM_DOCKER_TAG:-main-stable}
    command: --port 4000 --config /config.yaml
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${LITELLM_IP4:-20}
    extra_hosts:
      - ll-postgres:${PRIV_IP1TO3:-10.0.0}.${LL_POSTGRES_IP4:-21}
      - vllm:${PRIV_IP1TO3:-10.0.0}.${VLLM_IP4:-22}
      - mcpo:${PRIV_IP1TO3:-10.0.0}.${MCPO_IP4:-23}
    user: "0:0"   # Note: container runs in nobody mode, mountpoint belongs to root -> mismatch
    volumes:
      - type: bind
        source: ./litellm_fs/config.yaml.${UUID:?}
        target: /config.yaml
        read_only: true
        bind: { selinux: "Z" }
    depends_on:
      - ll-postgres
      - vllm
      - mcpo
    environment:
      DISABLE_ADMIN_UI: "True"
      LITELLM_MODE: "PRODUCTION"
      LITELLM_LOG: "INFO"
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?} # used for postgres db encryption
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?} # admin key is required to access admin functions, like generating user API keys, ensure it starts with 'sk-'
      MAX_REQUESTS_BEFORE_RESTART: ${LITELLM_MAX_REQUESTS_BEFORE_RESTART:-10000}
      #LANGFUSE_HOST: http://langfuse-web:3000
      #LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?}
      #LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?}
      NUM_WORKERS: ${LITELLM_CPU_LIMIT:-8}
      DATABASE_URL: postgresql://${LITELLM_POSTGRES_USER:-postgres}:${LITELLM_POSTGRES_PASSWORD:-litellm}@ll-postgres:5432/${LITELLM_POSTGRES_DB:-litellm} #XXX: see details https://docs.litellm.ai/docs/proxy/deploy#deploy-with-database to get Virtual Keys working
      MCPO_API_KEY: sk-15330865-62087191
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      CUSTOM_TIKTOKEN_CACHE_DIR: "/usr/lib/python3.13/site-packages/litellm/litellm_core_utils/tokenizers"  # Note: temp workaround for issue #19852
    #healthcheck:
    #  test: [ "CMD-SHELL",
    #          "wget --no-verbose --tries=1 http://localhost:4000/health/liveliness || exit 1" ]
    #  interval: 30s
    #  timeout: 10s
    #  retries: 3
    #  start_period: 40s
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
    deploy:
      mode: replicated
      replicas: ${LITELLM_REPLICAS:-1}
      endpoint_mode: vip
##      resources:
##        limits:
##          cpus: ${LITELLM_CPU_LIMIT:-8}
##          memory: ${LITELLM_MEM_LIMIT:-8}G
##        reservations:
##          cpus: "0.1"
##          memory: "128M"

  ll-postgres:
    profile: [ harness ]
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${LL_POSTGRES_IP4:-21}
    #volumes:
    #  - postgres_data:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql   # Note: we don't need persistency for our case
    environment:
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      PGTZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    #healthcheck:
    #  test: [ "CMD-SHELL",
    #          "pg_isready -U postgres" ]
    #  interval: 3s
    #  timeout: 3s
    #  retries: 10
    cap_drop: [ ALL ]
    cap_add: [ sys_nice, setuid, setgid, chown ]
    deploy:
      mode: replicated
      replicas: ${POSTGRES_REPLICAS:-1}
      endpoint_mode: vip
##      resources:
##        limits:
##          cpus: ${POSTGRES_CPU_LIMIT:-8}
##          memory: ${POSTGRES_MEM_LIMIT:-8}G
##        reservations:
##          cpus: "0.1"
##          memory: "128M"

  vllm:
    profile: [ vllm ]
    image: docker.io/vllm/vllm-openai:${VLLM_DOCKER_TAG:-nightly}
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${VLLM_IP4:-22}
    extra_hosts:
      - ${UMRS_S3_BUCKET_HOST:?}:${PRIV_IP1TO3:-10.0.0}.${NGINX_OUT_IP4:-252}
    volumes:
      - type: bind
        source: ${VLLM_PATH_TO_HUGGINGFACE:?}/
        target: /root/.cache/huggingface
        read_only: true
      - type: bind
        source: ${VLLM_PATH_TO_HUGGINGFACE:?}/modules/
        target: /root/.cache/huggingface/modules/
        read_only: false
    command: ${VLLM_MODEL:?} --served-model-name ${VLLM_MODEL:?} --api-key sk-02284644-03150002 -tp ${VLLM_TP:?} -pp ${VLLM_PP:?} --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.95} --enforce-eager
    environment:
      ##TORCH_USE_RTLD_GLOBAL: 1
      ##VLLM_USE_TRTLLM_ATTENTION: 1
      ##VLLM_USE_TRTLLM_DECODE_ATTENTION: 1
      ##VLLM_USE_TRTLLM_CONTEXT_ATTENTION: 1
      #VLLM_USE_FLASHINFER_MXFP4_MOE: 1
      ##VLLM_ATTENTION_BACKEND: "TRITON_ATTN_VLLM_V1"
      TIKTOKEN_RS_CACHE_DIR: ${VLLM_MODEL_TIKTOKEN:-""}
      TRANSFORMERS_OFFLINE: 1
      HF_HUB_OFFLINE: 1
      VLLM_NO_USAGE_STATS: 1
      VLLM_API_KEY: sk-02284644-03150002
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-8}
      #VLLM_LOGGING_LEVEL: DEBUG
      #LLM_TRACE_FUNCTION: 1
      #NCCL_DEBUG: INFO
      ##TODO needed/move to gpu version ????
      VLLM_MM_INPUT_CACHE_GIB: 2
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TZ: ${GENAI_TZ:-Asia/Tokyo}
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
    deploy:
      mode: replicated
      replicas: ${VLLM_REPLICAS:-1}
      endpoint_mode: vip
##      resources:
##        limits:
##          cpus: ${VLLM_CPU_LIMIT:-4}
##          memory: ${VLLM_MEM_LIMIT:-4}G
##        reservations:
##          cpus: "0.1"
##          memory: "128M"

  mcpo:
    profile: [ harness ]
    image: ghcr.io/open-webui/mcpo:${MCPO_DOCKER_TAG:-main}
    command: --port 8000 --api-key sk-15330865-62087191 --hot-reload --config /tmp/config.json
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${MCPO_IP4:-23}
    extra_hosts:
      - mcp-time:${PRIV_IP1TO3:-10.0.0}.${MCP_TIME_IP4:-24}
    volumes:
      - type: bind
        source: ./mcpo_fs/config.json
        target: /tmp/config.json
        read_only: true
    depends_on:
      - mcp-time
    environment:
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
##    deploy:
##      resources:
##        limits:
##          cpus: ${MCPO_CPU_LIMIT:-1}
##          memory: ${MCPO_MEM_LIMIT:-1}G
##        reservations:
##          cpus: "0.1"
##          memory: "128M"

  mcp-time:
    profile: [ harness ]
    image: docker.io/theo01/mcp-time:${MCP_TIME_DOCKER_TAG:-latest}
    command: --transport stream --address "http://0.0.0.0:8080/mcp"
    networks:
      genai-private-net:
        ipv4_address: ${PRIV_IP1TO3:-10.0.0}.${MCP_TIME_IP4:-24}
    environment:
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    cap_drop: [ ALL ]
    cap_add: [ sys_nice ]
##    deploy:
##      resources:
##        limits:
##          cpus: ${MCP_TIME_CPU_LIMIT:-1}
##          memory: ${MCP_TIME_MEM_LIMIT:-1}G
##        reservations:
##          cpus: "0.1"
##          memory: "128M"

##volumes:
##  postgres_data:
##    name: litellm_postgres_data

networks:
  genai-private-net:
    name: "genai-private-net"
    external: true
