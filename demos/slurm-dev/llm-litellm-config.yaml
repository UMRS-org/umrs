# LiteLLM configuration for the always-on LLM service.
# This proxies requests to the local vLLM instance (llm-vllm container).

model_list:
  - model_name: qwen-chat
    litellm_params:
      model: hosted_vllm/qwen-chat
      api_key: sk-llm-always-on
      api_base: http://llm-vllm:8000/v1
      keep_alive: 60m

litellm_settings:
  request_timeout: 600
  set_verbose: False
  json_logs: true
  cache: False
  force_ipv4: True
  turn_off_message_logging: False

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: True
  disable_spend_logs: True
  disable_error_logs: True
  allow_requests_on_db_unavailable: True
