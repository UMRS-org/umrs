# =============================================================================
# Slurm Development Environment for E2E Demo
# =============================================================================
#
# Creates a real Slurm cluster for local development/testing.
# Rivault (vLLM + LiteLLM + supporting services) runs INSIDE compute-01
# via podman-in-podman, launched by a Slurm job.
#
# An always-on LLM service (vLLM + LiteLLM + OpenWebUI) is available as
# a separate compose project in rivault/demo-llm.yaml.
#
# Architecture:
#   ┌─────────────────────┐    ┌─────────────────────────────────┐
#   │  ai-login            │    │  compute-01 (privileged)        │
#   │  slurmctld           │───▶│  slurmd                         │
#   │  UMRS server (:5555) │    │  ┌───────────────────────────┐  │
#   │  RAG service (:8081) │    │  │ podman (Rivault stack)    │  │
#   └──────────────────────┘    │  │ NGINX→LiteLLM→vLLM        │  │
#           │                   │  └───────────────────────────┘  │
#           └───────┬───────────┘
#                   ▼
#   ┌───────────┐  ┌────────────┐  ┌──────────────┐
#   │  munge    │  │  postgres  │  │  minio       │
#   └───────────┘  └────────────┘  └──────────────┘
#
#   Separate compose project (rivault/demo-llm.yaml):
#   ┌──────────────────────────────┐
#   │  Always-on LLM               │
#   │  vLLM → LiteLLM → OpenWebUI │
#   │  Port 13000 (WebUI)         │
#   │  Port 14000 (LiteLLM API)   │
#   └──────────────────────────────┘
#
# Usage:
#   # Start Slurm cluster (core services)
#   podman-compose -f demos/slurm-dev/docker-compose.yaml up -d
#
#   # Check status
#   podman exec ai-login sinfo
#
#   # Setup demo data
#   podman exec ai-login bash /opt/scripts/setup_demo_data.sh
#
#   # Start always-on LLM (separate project, after freeing GPU)
#   cd demos/slurm-dev/rivault
#   podman network create --internal --disable-dns --subnet 192.168.5.0/24 demo-llm-net
#   podman-compose --env-file demo-llm.env -f demo-llm.yaml -f x_nvidia-override.yaml up -d
#
#   # Stop
#   podman-compose -f demos/slurm-dev/docker-compose.yaml down
#
# =============================================================================

name: slurm-dev

services:
  # =============================================================================
  # Slurm Controller (slurmctld) + UMRS Server
  # =============================================================================
  ai-login:
    build:
      context: .
      dockerfile: Dockerfile.ai-login
    container_name: ai-login
    hostname: ai-login
    networks:
      slurm-net:
        aliases:
          - ai-login
          - slurm-controller
    ports:
      - "6817:6817"    # Slurm control daemon
      - "5555:5555"    # UMRS ZeroMQ control plane
      - "8081:8081"    # UMRS RAG service (if UMRS_RAG_ENABLE=1)
    volumes:
      - munge-key:/etc/munge:ro
      - slurm-spool:/var/spool/slurmctld
      - job-info:/var/run/rivault
      - ./slurm.conf:/etc/slurm/slurm.conf:ro
      # Mount local repository UMRS source for controller to run the server
      - ../../src:/opt/umrs:ro
      # UMRS server configuration (referenced by entrypoint-ai-login.sh)
      - ./conf_umrs.json:/root/conf_umrs.json:rw
      # UMRS user configuration files
      - ./user_files/user_rivault.json:/root/.config/umrs/users/user_rivault.json:ro
      - ./s3cfg:/root/.s3cfg:ro
      - ./s3cfg_rivault_user:/root/.s3cfg_rivault_user:ro
      # Rivault Slurm script (referenced by rivault.py at ~/.config/umrs/rivault_data/)
      - ./mini-rivault-job.sh:/root/.config/umrs/rivault_data/serve-model.slurm:ro
      # Demo test data and scripts
      - ./test_data:/opt/test_data:ro
      - ../../data/img:/opt/test_data/images:ro
      - ./scripts:/opt/scripts:ro
      - ${MODEL_PATH:-./rivault/models}:/shared/models:rw
    env_file:
      - .env
    environment:
      - SLURM_CONF=/etc/slurm/slurm.conf
      # Rivault configuration for UMRS
      - RIVAULT_REMOTE_PORT=${RIVAULT_REMOTE_PORT:-11434}
      - NGINX_LITELLM_DOCKER_PORT=${NGINX_LITELLM_DOCKER_PORT:-11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-demo-dev}
      # UMRS database configuration
      - DB_HOST=${DB_HOST:-postgres}
      - DB_SUPERUSER=${POSTGRES_USER:-umrs}
      - DB_SUPERUSER_PASSWORD=${POSTGRES_PASSWORD:-umrs_dev}
      - DB_USER_PASSWORD=${DB_USER_PASSWORD:-umrs_dev}
      - UMRS_SERVER_HOST=${UMRS_SERVER_HOST:-umrs-server}
      # Ensure HF and SentenceTransformers caches go into the shared models
      # directory so that the worker can reuse downloaded weights.
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/shared/models/sentence_transformers}
      - HF_HOME=${HF_HOME:-/shared/models/hf}
      # RAG service (started if UMRS_RAG_ENABLE=1)
      - UMRS_RAG_ENABLE=${UMRS_RAG_ENABLE:-0}
      - UMRS_RAG_PORT=${UMRS_RAG_PORT:-8081}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://localhost:14000/v1}
    depends_on:
      munge:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      #umrs-embed-worker:
      #  condition: service_started

    healthcheck:
      #test: ["CMD", "sinfo", "-N"]
      # need to check both slurmctld and UMRS server health; if either is unhealthy, the cluster won't function correctly
      # UMRS serve health check through ZeroMQ control plane; if it responds, the server is healthy
      test: ["CMD-SHELL", "sinfo -N && python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',5555)); s.close()\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  # =============================================================================
  # Slurm Compute Node (slurmd)
  # =============================================================================
  compute-01:
    build:
      context: .
      dockerfile: Dockerfile.compute
    container_name: compute-01
    hostname: compute-01
    privileged: true          # Required for podman-in-podman
    networks:
      slurm-net:
        aliases:
          - compute-01
    ports:
      - "2222:22"      # SSH for debugging
      #- "11434:11434"  # NGINX→LiteLLM (Rivault stack)
      #- "8000:8000"    # vLLM direct access
    volumes:
      - munge-key:/etc/munge:ro
      - slurm-spool-d:/var/spool/slurmd
      - job-info:/var/run/rivault
      - ./slurm.conf:/etc/slurm/slurm.conf:ro
      # Mount model path from host (adjust as needed)
      - ${MODEL_PATH:-/tmp/models}:/models:ro
      # Mount Rivault compose files for podman-in-podman
      - ./rivault:/opt/rivault:rw
      # GRES config for GPUs
      - ./gres.conf:/etc/slurm/gres.conf:ro
    env_file:
      - .env
    environment:
      - SLURM_CONF=/etc/slurm/slurm.conf
      - SLURMD_OPTIONS=${SLURMD_OPTIONS:--D --conf-server ai-login}
      # Rivault defaults (used by serve-model.slurm inside the Slurm job)
      - VLLM_PATH_TO_HUGGINGFACE=${VLLM_PATH_TO_HUGGINGFACE:-/models}
      - NGINX_LITELLM_DOCKER_PORT=${NGINX_LITELLM_DOCKER_PORT:-11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-demo-dev}
      # UMRS configuration (for direct access from compute node, e.g. for testing/debugging; in production, the worker handles communication with the server)
      #- UMRS_S3_BUCKET_HOST=${UMRS_S3_BUCKET_HOST:-minio}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
    # Expose GPU device nodes from host into the compute container.
    # Adjust device paths to match your host (e.g., /dev/nvidia0).
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    depends_on:
      munge:
        condition: service_healthy
      ai-login:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sinfo", "-N"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =============================================================================
  # Munge Authentication Service
  # Shared between controller and compute nodes
  # =============================================================================
  munge:
    build:
      context: .
      dockerfile: Dockerfile.munge
    container_name: munge
    hostname: munge
    networks:
      slurm-net:
        aliases:
          - munge
    volumes:
      - munge-key:/etc/munge
      - munge-run:/run/munge
    healthcheck:
      test: ["CMD", "munge", "-n"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # =============================================================================
  # PostgreSQL with pgvector (for UMRS)
  # =============================================================================
  postgres:
    image: ankane/pgvector:latest
    container_name: demo-postgres
    networks:
      slurm-net:
        aliases:
          - postgres
    ports:
      - "15432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umrs_dev}
      POSTGRES_DB: ${POSTGRES_DB:-umrs_demo}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umrs"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================================================
  # MinIO (S3-compatible storage for UMRS)
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: demo-minio
    networks:
      slurm-net:
        aliases:
          - minio
          - s3
    ports:
      - "19000:9000"
      - "19001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================================================
  # UMRS client environment (lightweight container for interacting with UMRS)
  # =============================================================================
  umrs-client:
    build:
      context: .
      dockerfile: Dockerfile.umrs-client
    container_name: umrs-client
    networks:
      slurm-net:
        aliases:
          - umrs-client
    env_file:
      - .env
    environment:
      - UMRS_SERVER_HOST=ai-login
      - UMRS_ENDPOINT=${UMRS_ENDPOINT:-http://ai-login:8000}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ../../src:/opt/umrs:ro
      - ./test_data:/opt/test_data:ro
      - ../../data/img:/opt/test_data/images:ro
      - ./scripts:/opt/scripts:ro
      # UMRS configuration files
      - ./conf_umrs.json:/root/conf_umrs.json:ro
      - ./user_files/user_rivault.json:/root/.config/umrs/users/user_rivault.json:ro
      - ./s3cfg:/root/.s3cfg:ro
      - ./s3cfg_rivault_user:/root/.s3cfg_rivault_user:ro
    command: ["tail", "-f", "/dev/null"]

    depends_on:
      ai-login:
        condition: service_healthy
      #postgres:
      #  condition: service_healthy
      #minio:
      #  condition: service_healthy

  # =============================================================================
  # Always-On LLM Service
  # =============================================================================
  # Use the Rivault demo compose files which include NVIDIA device overrides:
  #   cd demos/slurm-dev/rivault
  #   podman-compose --env-file demo-llm.env \
  #     -f demo-llm.yaml -f x_nvidia-override.yaml up -d
  # =============================================================================

networks:
  slurm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  munge-key:
  munge-run:
  slurm-spool:
  slurm-spool-d:
  job-info:
  pg-data:
  minio-data:
