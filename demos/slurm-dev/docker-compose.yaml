# =============================================================================
# Slurm Development Environment for E2E Demo
# =============================================================================
#
# Creates a Slurm cluster for local development/testing.
# The control plane (slurmctld, UMRS, postgres, minio) runs in containers.
# The compute node (slurmd) runs directly on the HOST for native GPU access.
# Rivault (vLLM + LiteLLM + supporting services) is launched by a Slurm job
# using the host's native podman — no podman-in-podman needed.
#
# Architecture:
#   Host (bare metal, GPU, native podman)
#   ├── slurmd (native process, started by scripts/start-host-slurmd.sh)
#   ├── munged (native process, shares key with container munge)
#   │
#   └── podman-compose (this file, control plane)
#        ├── ai-login (slurmctld + UMRS server)
#        ├── munge (key generator)
#        ├── postgres, minio
#        └── umrs-client
#
#   When Slurm job runs on host:
#   └── podman compose (Rivault stack, native GPU via CDI)
#        ├── vllm, litellm, nginx, postgres
#        └── ...
#
# Usage:
#   # 1. Start control plane
#   podman-compose -f docker-compose.yaml up -d
#
#   # 2. Start host slurmd (in another terminal)
#   sudo bash scripts/start-host-slurmd.sh
#
#   # 3. Check cluster
#   podman exec ai-login sinfo -N
#
#   # 4. Run E2E demo
#   bash scripts/run_e2e_demo.sh
#
# =============================================================================

name: slurm-dev

services:
  # =============================================================================
  # Slurm Controller (slurmctld) + UMRS Server
  # =============================================================================
  ai-login:
    build:
      context: ../..
      dockerfile: demos/slurm-dev/Dockerfile.ai-login
    container_name: ai-login
    hostname: ai-login
    networks:
      slurm-net:
        aliases:
          - ai-login
          - slurm-controller
    ports:
      - "6817:6817"    # Slurm control daemon
      - "5555:5555"    # UMRS ZeroMQ control plane
      - "8081:8081"    # UMRS RAG service (if UMRS_RAG_ENABLE=1)
    extra_hosts:
      # slurmctld must resolve compute-01 → host (slurmd runs on host)
      - "compute-01:host-gateway"
      # Map the host's FQDN so SSH tunnels from ai-login can reach host services
      - "${COMPUTE_HOST_FQDN:-compute-01}:host-gateway"
    volumes:
      - ./munge-key:/etc/munge:ro
      - slurm-spool:/var/spool/slurmctld
      - ./job-info:/var/run/rivault
      - ./slurm.conf:/etc/slurm/slurm.conf:ro
      # Mount local repository UMRS source for controller to run the server
      - ../../src:/opt/umrs:ro
      # UMRS server configuration (referenced by entrypoint-ai-login.sh)
      - ./conf_umrs.json:/root/conf_umrs.json:rw
      # Shared UMRS config directory (host directory for sharing with host slurmd)
      - ./umrs-config:/root/.config/umrs
      # Overlay bind mounts for specific config files within the shared volume
      - ./user_files/user_rivault.json:/root/.config/umrs/users/user_rivault.json:ro
      - ./s3cfg:/root/.s3cfg:ro
      - ./s3cfg_rivault_user:/root/.s3cfg_rivault_user:ro
      # Demo test data and scripts
      - ./test_data:/opt/test_data:ro
      - ../../data/img:/opt/rag_data/images:ro
      - ./scripts:/opt/scripts:ro
      - ${MODEL_PATH:-../../src/umrs/mini-rivault-llm/models}:/shared/models:rw
    env_file:
      - .env
    environment:
      - SLURM_CONF=/etc/slurm/slurm.conf
      # Rivault configuration for UMRS
      # Use the demo-specific wrapper which sets host paths (HMAE_MODEL_PATH, etc.)
      - RIVAULT_SLURM_SCRIPT=/root/.config/umrs/rivault_data/serve-model.slurm
      - RIVAULT_REMOTE_PORT=${RIVAULT_REMOTE_PORT:-11434}
      - NGINX_LITELLM_DOCKER_PORT=${NGINX_LITELLM_DOCKER_PORT:-11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-demo-dev}
      # UMRS database configuration
      - DB_HOST=${DB_HOST:-postgres}
      - DB_SUPERUSER=${POSTGRES_USER:-umrs}
      - DB_SUPERUSER_PASSWORD=${POSTGRES_PASSWORD:-umrs_dev}
      - DB_USER_PASSWORD=${DB_USER_PASSWORD:-umrs_dev}
      - UMRS_SERVER_HOST=${UMRS_SERVER_HOST:-umrs-server}
      # Ensure HF and SentenceTransformers caches go into the shared models
      # directory so that the worker can reuse downloaded weights.
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/shared/models/sentence_transformers}
      - HF_HOME=${HF_HOME:-/shared/models/hf}
      # Model staging (server-side download writes here)
      - UMRS_MODEL_STAGING_ROOT=${UMRS_MODEL_STAGING_ROOT:-/shared/models}
      # RAG service (started if UMRS_RAG_ENABLE=1)
      - UMRS_RAG_ENABLE=${UMRS_RAG_ENABLE:-0}
      - UMRS_RAG_PORT=${UMRS_RAG_PORT:-8081}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://localhost:14000/v1}
    depends_on:
      munge:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "sinfo -N && python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',5555)); s.close()\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  # =============================================================================
  # Munge Authentication Service
  # Shared between controller (container) and compute node (host)
  # =============================================================================
  munge:
    build:
      context: .
      dockerfile: Dockerfile.munge
    container_name: munge
    hostname: munge
    networks:
      slurm-net:
        aliases:
          - munge
    volumes:
      - ./munge-key:/etc/munge
      - munge-run:/run/munge
    healthcheck:
      test: ["CMD", "munge", "-n"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # =============================================================================
  # PostgreSQL with pgvector (for UMRS)
  # =============================================================================
  postgres:
    image: ankane/pgvector:latest
    container_name: demo-postgres
    networks:
      slurm-net:
        aliases:
          - postgres
    ports:
      - "15432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umrs_dev}
      POSTGRES_DB: ${POSTGRES_DB:-umrs_demo}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umrs"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================================================
  # MinIO (S3-compatible storage for UMRS)
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: demo-minio
    networks:
      slurm-net:
        aliases:
          - minio
          - s3
    ports:
      - "19000:9000"
      - "19001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================================================
  # UMRS client environment (lightweight container for interacting with UMRS)
  # =============================================================================
  umrs-client:
    build:
      context: ../..
      dockerfile: demos/slurm-dev/Dockerfile.umrs-client
    container_name: umrs-client
    networks:
      slurm-net:
        aliases:
          - umrs-client
    env_file:
      - .env
    environment:
      - UMRS_SERVER_HOST=ai-login
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ../../src:/opt/umrs:ro
      - ./test_data:/opt/test_data:ro
      - ../../data/img:/opt/rag_data/images:ro
      - ./scripts:/opt/scripts:ro
      # UMRS configuration files
      - ./conf_umrs.json:/root/conf_umrs.json:ro
      - ./user_files/user_rivault.json:/root/.config/umrs/users/user_rivault.json:ro
      - ./s3cfg:/root/.s3cfg:ro
      - ./s3cfg_rivault_user:/root/.s3cfg_rivault_user:ro
    command: ["tail", "-f", "/dev/null"]

    depends_on:
      ai-login:
        condition: service_healthy

networks:
  slurm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  munge-run:
  slurm-spool:
  pg-data:
  minio-data:
