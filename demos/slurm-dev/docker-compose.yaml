# =============================================================================
# Slurm Development Environment for E2E Demo
# =============================================================================
#
# Creates a real Slurm cluster for local development/testing.
# Rivault (vLLM + LiteLLM + supporting services) runs INSIDE compute-01
# via podman-in-podman, launched by a Slurm job.
#
# An always-on LLM service (vLLM + LiteLLM + OpenWebUI) is available via
# the "llm" profile for RAG chat and interactive use.
#
# Architecture:
#   ┌─────────────────┐    ┌─────────────────────────────────┐
#   │  ai-login       │    │  compute-01 (privileged)        │
#   │  slurmctld      │───▶│  slurmd                         │
#   │  UMRS server    │    │  ┌───────────────────────────┐  │
#   │  Port 6817      │    │  │ podman (Rivault stack)    │  │
#   │                 │    │  │ NGINX→LiteLLM→vLLM        │  │
#   └─────────────────┘    │  └───────────────────────────┘  │
#           │              └─────────────────────────────────┘
#           └───────┬───────────────┘
#                   ▼
#           ┌───────────────┐   ┌──────────────────────────────┐
#           │  munge        │   │  Always-on LLM (profile:llm) │
#           └───────────────┘   │  vLLM → LiteLLM → OpenWebUI  │
#                               │  Port 13000 (WebUI)          │
#                               │  Port 14000 (LiteLLM API)    │
#                               └──────────────────────────────┘
#
# Usage:
#   # Start Slurm cluster (core services)
#   podman-compose -f demos/slurm-dev/docker-compose.yaml up -d
#
#   # Check status
#   podman exec ai-login sinfo
#
#   # Setup demo data
#   podman exec ai-login bash /opt/scripts/setup_demo_data.sh
#
#   # Start always-on LLM (after Slurm embedding job finishes)
#   podman-compose -f demos/slurm-dev/docker-compose.yaml --profile llm up -d
#
#   # Stop
#   podman-compose -f demos/slurm-dev/docker-compose.yaml down
#
# =============================================================================

name: slurm-dev

services:
  # =============================================================================
  # Slurm Controller (slurmctld) + UMRS Server
  # =============================================================================
  ai-login:
    build:
      # Use repo root as build context so Dockerfile can COPY ./src
      context: ../..
      dockerfile: demos/slurm-dev/Dockerfile.ai-login
    container_name: ai-login
    hostname: ai-login
    networks:
      slurm-net:
        aliases:
          - ai-login
          - slurm-controller
    ports:
      - "6817:6817"    # Slurm control daemon
      #- "8000:8000"    # UMRS HTTP API
      - "5555:5555"    # UMRS ZeroMQ control plane
    volumes:
      - munge-key:/etc/munge:ro
      - slurm-spool:/var/spool/slurmctld
      - job-info:/var/run/rivault
      - ./slurm.conf:/etc/slurm/slurm.conf:ro
      # Mount local repository UMRS source for controller to run the server
      - ../../src:/opt/umrs:ro
      # UMRS server configuration (referenced by entrypoint-ai-login.sh)
      - ./conf_umrs.json:/root/conf_umrs.json:ro
      # UMRS user configuration files
      - ./user_files/user_rivault.json:/root/.config/umrs/users/user_rivault.json:ro
      - ./s3cfg:/root/.s3cfg:ro
      # Rivault Slurm script (referenced by rivault.py at ~/.config/umrs/rivault_data/)
      - ./mini-rivault-job.sh:/root/.config/umrs/rivault_data/serve-model.slurm:ro
      # Demo test data and scripts
      - ./test_data:/opt/test_data:ro
      - ../../data/img:/opt/test_data/images:ro
      - ./scripts:/opt/scripts:ro
    env_file:
      - .env
    environment:
      - SLURM_CONF=/etc/slurm/slurm.conf
      # Rivault configuration for UMRS
      - RIVAULT_REMOTE_PORT=${RIVAULT_REMOTE_PORT:-11434}
      - NGINX_LITELLM_DOCKER_PORT=${NGINX_LITELLM_DOCKER_PORT:-11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-demo-dev}
      # UMRS configuration
      - DB_HOST=${DB_HOST:-postgres}
      - DB_SUPERUSER_PASSWORD=${DB_SUPERUSER_PASSWORD:-}
      - DB_USER_PASSWORD=${DB_USER_PASSWORD:-umrs_dev}
      - UMRS_SERVER_HOST=${UMRS_SERVER_HOST:-umrs-server}
      # Ensure HF and SentenceTransformers caches go into the shared models
      # directory so that the worker can reuse downloaded weights.
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/shared/models/sentence_transformers}
      - HF_HOME=${HF_HOME:-/shared/models/hf}
    depends_on:
      munge:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      #umrs-embed-worker:
      #  condition: service_started

    healthcheck:
      #test: ["CMD", "sinfo", "-N"]
      # need to check both slurmctld and UMRS server health; if either is unhealthy, the cluster won't function correctly
      # UMRS serve health check through ZeroMQ control plane; if it responds, the server is healthy
      test: ["CMD-SHELL", "sinfo -N && echo 'ping' | nc -w 5 localhost 5555"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =============================================================================
  # Slurm Compute Node (slurmd)
  # =============================================================================
  compute-01:
    build:
      context: .
      dockerfile: Dockerfile.compute
    container_name: compute-01
    hostname: compute-01
    privileged: true          # Required for podman-in-podman
    networks:
      slurm-net:
        aliases:
          - compute-01
    ports:
      - "2222:22"      # SSH for debugging
      #- "11434:11434"  # NGINX→LiteLLM (Rivault stack)
      #- "8000:8000"    # vLLM direct access
    volumes:
      - munge-key:/etc/munge:ro
      - slurm-spool-d:/var/spool/slurmd
      - job-info:/var/run/rivault
      - ./slurm.conf:/etc/slurm/slurm.conf:ro
      #- ./mini-rivault-job.sh:/etc/slurm/mini-rivault-job.sh:ro
      # Mount model path from host (adjust as needed)
      - ${MODEL_PATH:-/tmp/models}:/models:ro
      # Mount Rivault compose files for podman-in-podman
      - ./rivault:/opt/rivault:rw
      # GRES config for GPUs
      - ./gres.conf:/etc/slurm/gres.conf:ro
    env_file:
      - .env
    environment:
      - SLURM_CONF=/etc/slurm/slurm.conf
      - SLURMD_OPTIONS=${SLURMD_OPTIONS:--D --conf-server ai-login}
      # Rivault defaults (used by serve-model.slurm inside the Slurm job)
      - VLLM_PATH_TO_HUGGINGFACE=${VLLM_PATH_TO_HUGGINGFACE:-/models}
      - NGINX_LITELLM_DOCKER_PORT=${NGINX_LITELLM_DOCKER_PORT:-11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-demo-dev}
      # UMRS configuration (for direct access from compute node, e.g. for testing/debugging; in production, the worker handles communication with the server)
      #- UMRS_S3_BUCKET_HOST=${UMRS_S3_BUCKET_HOST:-minio}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
    # Expose GPU device nodes from host into the compute container.
    # Adjust device paths to match your host (e.g., /dev/nvidia0).
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    depends_on:
      munge:
        condition: service_healthy
      ai-login:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sinfo", "-N"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =============================================================================
  # Munge Authentication Service
  # Shared between controller and compute nodes
  # =============================================================================
  munge:
    build:
      context: .
      dockerfile: Dockerfile.munge
    container_name: munge
    hostname: munge
    networks:
      slurm-net:
        aliases:
          - munge
    volumes:
      - munge-key:/etc/munge
      - munge-run:/run/munge
    healthcheck:
      test: ["CMD", "munge", "-n"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # =============================================================================
  # PostgreSQL with pgvector (for UMRS)
  # =============================================================================
  postgres:
    image: ankane/pgvector:latest
    container_name: demo-postgres
    networks:
      slurm-net:
        aliases:
          - postgres
    ports:
      - "15432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umrs_dev}
      POSTGRES_DB: ${POSTGRES_DB:-umrs_demo}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umrs"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================================================
  # MinIO (S3-compatible storage for UMRS)
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: demo-minio
    networks:
      slurm-net:
        aliases:
          - minio
          - s3
    ports:
      - "19000:9000"
      - "19001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================================================
  # UMRS client environment (lightweight container for interacting with UMRS)
  # =============================================================================
  umrs-client:
    build:
      # Use repo root as build context so Dockerfile can COPY ./src
      context: ../..
      dockerfile: demos/slurm-dev/Dockerfile.umrs-client
    container_name: umrs-client
    networks:
      slurm-net:
        aliases:
          - umrs-client
    env_file:
      - .env
    environment:
      - UMRS_ENDPOINT=${UMRS_ENDPOINT:-http://ai-login:8000}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ../../src:/opt/umrs:ro
      - ./test_data:/opt/test_data:ro
      - ../../data/img:/opt/test_data/images:ro
      - ./scripts:/opt/scripts:ro
      - ./conf_umrs.json:/opt/umrs/conf_umrs.json:ro
      - ./s3cfg:/root/.s3cfg:ro
    command: ["tail", "-f", "/dev/null"]

    depends_on:
      ai-login:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # =============================================================================
  # Always-On LLM Service (vLLM + LiteLLM + OpenWebUI)
  # =============================================================================
  # Activated with: podman-compose --profile llm up -d
  # Provides a persistent chat/completion endpoint SEPARATE from the
  # Slurm-launched Rivault embedding model. Since the GB10 GPU does not
  # support MIG, run this AFTER stopping the Slurm embedding job.
  # =============================================================================

  llm-vllm:
    profiles: ["llm"]
    image: docker.io/vllm/vllm-openai:${VLLM_DOCKER_TAG:-latest}
    container_name: llm-vllm
    hostname: llm-vllm
    networks:
      slurm-net:
        aliases:
          - llm-vllm
    volumes:
      - ${LLM_MODEL_PATH:-./rivault/models}:/root/.cache/huggingface:ro
    environment:
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_API_KEY: sk-llm-always-on
    command: >-
      ${LLM_VLLM_MODEL:---model /root/.cache/huggingface}
      --served-model-name qwen-chat
      --api-key sk-llm-always-on
      --gpu-memory-utilization ${LLM_GPU_MEM_UTIL:-0.85}
      --enforce-eager
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  llm-litellm:
    profiles: ["llm"]
    image: ghcr.io/berriai/litellm-non_root:${LITELLM_DOCKER_TAG:-main-stable}
    container_name: llm-litellm
    hostname: llm-litellm
    networks:
      slurm-net:
        aliases:
          - llm-litellm
    ports:
      - "14000:4000"    # LiteLLM OpenAI-compatible API
    volumes:
      - ./llm-litellm-config.yaml:/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LLM_LITELLM_MASTER_KEY:-sk-llm-demo}
      LITELLM_SALT_KEY: ${LLM_LITELLM_SALT_KEY:-llm-salt-key-demo}
      DATABASE_URL: postgresql://postgres:litellm@llm-postgres:5432/litellm
    command: --port 4000 --config /config.yaml
    depends_on:
      llm-vllm:
        condition: service_healthy
      llm-postgres:
        condition: service_started

  llm-postgres:
    profiles: ["llm"]
    image: docker.io/postgres:17
    container_name: llm-postgres
    hostname: llm-postgres
    networks:
      slurm-net:
        aliases:
          - llm-postgres
    tmpfs:
      - /var/run/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm

  open-webui:
    profiles: ["llm"]
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    hostname: open-webui
    networks:
      slurm-net:
        aliases:
          - open-webui
    ports:
      - "13000:8080"    # OpenWebUI chat interface
    environment:
      OPENAI_API_BASE_URL: http://llm-litellm:4000/v1
      OPENAI_API_KEY: ${LLM_LITELLM_MASTER_KEY:-sk-llm-demo}
      WEBUI_AUTH: "False"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - llm-litellm

networks:
  slurm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  munge-key:
  munge-run:
  slurm-spool:
  slurm-spool-d:
  job-info:
  pg-data:
  minio-data:
  open-webui-data:
