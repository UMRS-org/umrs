# =============================================================================
# Slurm Configuration for Development Environment
# =============================================================================
# This configuration sets up a minimal Slurm cluster with:
# - 1 controller (slurmctld)
# - 1 compute node (compute-01)
# - 1 partition (dev) for testing
#
# For production, use a more comprehensive configuration.
# =============================================================================

# Cluster identification
ClusterName=slurm-dev
SlurmctldHost=ai-login

# Slurm user and group (typically slurm:slurm)
SlurmUser=slurm
SlurmdUser=root

# Ports
SlurmctldPort=6817
SlurmdPort=6818

# Authentication
AuthType=auth/munge
CryptoType=crypto/munge

# Logging
SlurmctldDebug=info
SlurmdDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# State directories
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid

# Process tracking
ProctrackType=proctrack/linuxproc

# Scheduling
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# Job completion
JobCompType=jobcomp/none
AccountingStorageType=accounting_storage/none

# Task plugin
TaskPlugin=task/affinity

# Timeouts
SlurmctldTimeout=120
SlurmdTimeout=120
InactiveLimit=0
MinJobAge=300
KillWait=30
WaitTime=0

# Return to service
ReturnToService=2

# MPI support
MpiDefault=none

# =============================================================================
# Compute Nodes
# =============================================================================
# Define compute nodes and their resources
# Adjust CPUs, Memory, and GPUs based on your host system
#
# For Docker without GPU passthrough:
#   NodeName=compute-01 CPUs=4 RealMemory=8192 State=UNKNOWN
#
# For Docker with GPU passthrough (--gpus all):
#   NodeName=compute-01 CPUs=4 RealMemory=8192 Gres=gpu:1 State=UNKNOWN
# =============================================================================

# Node definition (adjust to match your host resources)
NodeName=compute-01 CPUs=4 RealMemory=8192 Gres=gpu:1 State=UNKNOWN

# =============================================================================
# Partitions
# =============================================================================
# Define partitions for job scheduling

# Development partition (default)
PartitionName=dev Nodes=compute-01 Default=YES MaxTime=INFINITE State=UP

# GPU partition (aliases to same node, for demo compatibility)
PartitionName=gpu Nodes=compute-01 MaxTime=INFINITE State=UP

# =============================================================================
# GRES (Generic Resources) - Uncomment for GPU support
# =============================================================================
GresTypes=gpu
