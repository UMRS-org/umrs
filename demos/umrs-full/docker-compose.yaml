# UMRS Full Stack Development Environment
#
# This compose file provides all UMRS components:
# - UMRS Server: ZeroMQ control plane + REST API
# - Embedding Worker: Computes embeddings using models
# - PostgreSQL: Database with pgvector for similarity search
# - MinIO: S3-compatible object storage
# - Slurm Controller (simulated): For job scheduling demo
#
# Usage:
#     cd demos/umrs-full
#     docker compose up -d
#     python ../e2e_umrs_full.py --live
#
#     # Check logs
#     docker compose logs -f umrs-server
#
#     # Clean up
#     docker compose down -v

services:
  # =========================================================================
  # Object Storage (MinIO)
  # =========================================================================
  minio:
    image: minio/minio:latest
    container_name: umrs-demo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"   # S3 API (mapped to 19000 to avoid conflicts)
      - "19001:9001"   # Web console (mapped to 19001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - umrs-net

  # Initialize MinIO buckets
  minio-init:
    image: minio/mc:latest
    container_name: umrs-demo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c '
        sleep 2
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/demo-bucket
        mc mb --ignore-existing local/models
        mc mb --ignore-existing local/results
        mc anonymous set download local/results
        echo "MinIO buckets initialized"
      '
    networks:
      - umrs-net

  # =========================================================================
  # Database (PostgreSQL + pgvector)
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: umrs-demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: umrs_demo
    ports:
      - "15432:5432"   # Mapped to 15432 to avoid conflicts
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - umrs-net

  # =========================================================================
  # UMRS Server
  # =========================================================================
  umrs-server:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    container_name: umrs-demo-server
    command: python -m server_umrs
    environment:
      # ZeroMQ settings
      UMRS_CONTROL_PORT: "5555"
      UMRS_DATA_PORT: "5556"
      
      # S3 settings
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: demo-bucket
      
      # Database settings
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: umrs_demo
      
      # Model settings
      SENTENCE_TRANSFORMERS_HOME: /shared/models
      HF_HOME: /shared/models
      
      # Embedding worker settings
      EMBEDDING_WORKER_HOST: umrs-embed-worker
      EMBEDDING_WORKER_PORT: "6000"
      
      # Demo settings
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
    ports:
      - "18001:8000"   # HTTP API (mapped to 18001)
      - "15555:5555"   # ZeroMQ control channel
      - "15556:5556"   # ZeroMQ data channel
    volumes:
      - model_cache:/shared/models
      - ../../src:/app/src:ro
      - ./conf_umrs.json:/root/conf_umrs.json:ro
      - ./user_files:/root/user_files:ro
      - ./s3cfg:/root/.s3cfg:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - umrs-net
    healthcheck:
      test: ["CMD", "python", "-c", "import zmq; c=zmq.Context(); s=c.socket(zmq.REQ); s.connect('tcp://localhost:5555'); s.send_string('ping'); print(s.recv_string()); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =========================================================================
  # Embedding Worker
  # =========================================================================
  umrs-embed-worker:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    container_name: umrs-demo-embed-worker
    command: python -m embedding_worker
    environment:
      # Worker settings
      EMBEDDING_WORKER_BIND: tcp://0.0.0.0:6000
      
      # Model settings
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      SENTENCE_TRANSFORMERS_HOME: /shared/models
      HF_HOME: /shared/models
      TRANSFORMERS_OFFLINE: "0"  # Allow download for demo
      
      # RiVault settings (optional)
      RIVAULT_ENDPOINT: ""  # Empty = use local model
      
      # Database settings (for direct storage)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: umrs_demo
      
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
    ports:
      - "16000:6000"   # Embedding worker port (mapped to 16000)
    volumes:
      - model_cache:/shared/models
      - ../../src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - umrs-net

  # =========================================================================
  # UMRS CLI Client (for interactive testing)
  # =========================================================================
  umrs-client:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    container_name: umrs-demo-client
    entrypoint: ["tail", "-f", "/dev/null"]  # Keep container running
    environment:
      UMRS_SERVER_HOST: umrs-server
      UMRS_CONTROL_PORT: "5555"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PYTHONPATH: /app/src
    volumes:
      - ../../src:/app/src:ro
      - ./demo_data:/demo_data  # Mount demo data
    depends_on:
      - umrs-server
    networks:
      - umrs-net

  # =========================================================================
  # Mini-RiVault (Optional - for full LLM integration)
  # =========================================================================
  # Uncomment for full LLM integration testing
  # 
  # litellm:
  #   image: ghcr.io/berriai/litellm:main-stable
  #   container_name: umrs-demo-litellm
  #   command: --config /config/litellm_config.yaml
  #   environment:
  #     LITELLM_MASTER_KEY: sk-ll-demo
  #   ports:
  #     - "11434:4000"
  #   volumes:
  #     - ./litellm_config.yaml:/config/litellm_config.yaml:ro
  #   networks:
  #     - umrs-net

networks:
  umrs-net:
    driver: bridge

volumes:
  minio_data:
  pg_data:
  model_cache:
