# Docker Compose (legacy) for UMRS project
# - Runs MinIO and Postgres as separate containers
# - Runs UMRS server and client in the same container (no HTTP API usage in tests)

services:
  umrs-legacy:
    build:
      context: ..
      dockerfile: docker_legacy/Dockerfile.legacy
    container_name: umrs-legacy
    depends_on:
      - minio
      - postgres
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_SUPERUSER_PASSWORD=postgres
      - DB_USER_PASSWORD=ejeannot
      # Server and client run in the same container; default control-plane host is 127.0.0.1
      - UMRS_SERVER_HOST=127.0.0.1
    #volumes:
      # Reuse existing test data and user files
      #- ../docker/data:/app/data:ro
      #- ../docker/user_files:/app/user_files:ro
      # Provide s3cfg to the container (read-only)
      #- ../docker/s3cfg:/root/.s3cfg:ro
      #- ../docker/s3cfg_user1:/root/.s3cfg_user1:ro
      #- ../docker/s3cfg_user2:/root/.s3cfg_user2:ro
    # No need to expose HTTP port since we don't use the HTTP API in this setup
    # ports:
    #   - "5555:5555" # Optional: expose ZeroMQ control plane if you want to inspect externally
    restart: no
    command: ["/bin/bash", "-c", "chmod +x ./test_umrs_legacy.sh && ./test_umrs_legacy.sh"]

  minio:
    image: minio/minio:latest
    container_name: minio-legacy
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_legacy_data:/data
      - ../docker/s3cfg:/config/.s3cfg:ro
    restart: unless-stopped

  postgres:
    image: ankane/pgvector:latest
    container_name: postgres-legacy
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=images_and_texts_ejeannot
    volumes:
      - pg_legacy_data:/var/lib/postgresql/data
      - ../docker/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    restart: unless-stopped

volumes:
  minio_legacy_data:
  pg_legacy_data:
