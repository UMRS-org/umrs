# Temp pool: laguna-s-2.1-fp8 only (bdrt) — TP8 on single node (115 GB model)
# The model is 115 GB (24 × 4.8 GB safetensors). TP2/2 nodes = 57 GB/GPU which
# exceeds GB10's ~20 GB. Must use TP8 on a single node: 115/8 = 14.4 GB/GPU.
# DFlash speculative decode disabled (adds ~5 GB overhead, too tight for 20 GB GPU).
pool: bdrt-laguna
defaults:
  source: bdrt
  tier: system
  ttl_sec: 0
  timeout: 172800

endpoints:
  - name: laguna-s-2.1-fp8
    model: laguna-s-2.1-fp8
    tier: system
    node_count: 1
    partition: edge
    max_model_len: 4096
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--poolside--Laguna-S-2.1-FP8/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "poolside/Laguna-S-2.1-FP8"
      VLLM_TOKENIZER: "poolside/Laguna-S-2.1-FP8"
      VLLM_GPU_MEM_UTIL: "0.95"
      VLLM_MAX_NUM_SEQS: "2"
      # TP8: 8 GPUs on single node. 115 GB / 8 = 14.4 GB/GPU fits in 20 GB GB10.
      VLLM_TP: "8"
      VLLM_TENSOR_PARALLEL_SIZE: "8"
      # Disable Ray's memory monitor — FP8 checkpoint load crosses 95% threshold.
      RAY_memory_monitor_refresh_ms: "0"
      # cgroup memory cap (GB10 has 121 GiB unified CPU+GPU memory).
      RIVAULT_MN_MEMORY_CAP: "110g"
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      # DFlash speculative decode DISABLED: 115 GB model at TP8 leaves ~2.4 GB/GPU
      # for KV cache at 0.95 util. DFlash draft would need ~5 GB more. Re-enable
      # when GPU memory budget allows (e.g., on A100-80GB nodes).
      # VLLM_SPECULATIVE_CONFIG: '{"method":"dflash","model":"/root/.cache/huggingface/hub/models--sapidlabs--Sparkulator-Laguna-S-2.1/snapshots","num_speculative_tokens":6}'
      # NOTE: recipe's `--kv-cache-dtype fp8` removed: vLLM 0.25.1 (:latest)
      # dropped CompressedTensorsConfig.get_cache_scale → AttributeError.
      VLLM_EXTRA_ARGS: >-
        --enforce-eager
        --kv-cache-memory-bytes 2684354560
        --max-num-batched-tokens 4096
      RCCS_SKIP_CDI: "1"
