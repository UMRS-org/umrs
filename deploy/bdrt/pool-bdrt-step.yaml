  # ── DeepSeek-V4-Flash (2 nodes → spark-double) ───────────────────────
  #  Transcribed 1:1 from the Spark Arena verified recipe (recipe_version 2,
  #  min_nodes 2), which measured 37.80 tok/s text generation on 2× DGX Spark:
  #    https://spark-arena.com/benchmark/443dcd0a-8a88-492b-917c-485d6261334e
  #
  #  Fit on 2× GB10 (119.69 GiB unified per node; TP2 splits the weights):
  #    checkpoint  148.7 GiB / 2   = 74.4 GiB per rank
  #    budget      119.69 × 0.825  = 98.7 GiB per rank
  #    headroom                    ≈ 24.3 GiB per rank (KV + activations + MTP)
  #  Comfortable because V4 uses MLA — the KV cache is a compressed latent,
  #  which is also why the recipe ships the sparse-MLA Triton knobs below.
  #
  #  Supersedes the stale single-node `deepseek-v4-flash` entry in
  #  pool-bdrt-3models.yaml (partition `spark`, enforce-eager, deepseek_r1
  #  parser). That entry's weights are no longer staged.
  # NOTE: dgx-spark-1 (spark-atom-1) has a broken rootless podman fuse-overlayfs
  # store — every container create fails with
  #   mknod .../merged/run/.containerenv: no data available   (ENODATA)
  # It survives `podman system reset -f` (node-level fault, not stale-image).
  # FIX: CONTAINERS_STORAGE_CONF below points both nodes at the native kernel
  # overlay config (storage-native.conf), which works on dgx-spark-1 (verified
  # busybox smoke test 2026-07-28) AND on dgx-spark-0 (native overlay mounts
  # existing fuse-created images fine). Same pattern as pool-glm52-temp.yaml.
  # This keeps deepseek on `spark-double` so it runs concurrently with laguna
  # on `edge-double` (the only two 2-node partitions on this 4-node cluster).
  - name: deepseek-v4-flash
    model: deepseek-v4-flash
    tier: system
    node_count: 2
    partition: spark-double
    max_model_len: 256000
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--deepseek-ai--DeepSeek-V4-Flash/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "deepseek-ai/DeepSeek-V4-Flash"
      # Native kernel overlay (NOT fuse-overlayfs) — required on dgx-spark-1
      # whose fuse store is corrupt (ENODATA on mknod). Works on both atom
      # nodes. Propagates sbatch→srun→podman client env (no script change).
      CONTAINERS_STORAGE_CONF: "/home/mnagaso/.config/containers/storage-native.conf"
      # NOTE: VLLM_TOKENIZER intentionally UNSET. This repo was staged via
      # `hf download` (standard HF cache layout: snapshots/<hash>/ with
      # symlinks to ../../blobs/). The separate tokenizer mount path in
      # serve-model.slurm (line ~1460: -v snapshots/<hash>:/tokenizer:ro)
      # does NOT include the blobs/ sibling, so the tokenizer.json symlink
      # breaks inside the container -> "Couldn't instantiate the backend
      # tokenizer". With VLLM_TOKENIZER unset, vLLM loads the tokenizer from
      # --model (the full model dir IS mounted with blobs/ by the symlink
      # handling at serve-model.slurm ~L220). --tokenizer-mode deepseek_v4
      # (in VLLM_EXTRA_ARGS) is unaffected — it controls tokenizer *mode*,
      # not the *path*.
      # Explicit env channel — the multi-node serve line reads
      # ${VLLM_MAX_MODEL_LEN:-4096}, so omitting this silently serves 4096.
      # Recipe value is 256000, deliberately below the 262144 native max.
      VLLM_MAX_MODEL_LEN: "256000"
      VLLM_GPU_MEM_UTIL: "0.825"
      # recipe: tensor_parallel 2, pipeline_parallel 1. Set both spellings —
      # serve-model.slurm passes -tp "$VLLM_TP", then derives PP = GPUs/TP = 1.
      VLLM_TP: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      # Pin NCCL to the routable 200G Spark-to-Spark fabric. Without this NCCL
      # enumerates an IPv6-link-local-only iface and ncclCommInitRank dies with
      # "Network is unreachable" (laguna job-3033). Load-bearing on the atom
      # pair in particular: those nodes also carry k8s flannel/cni0/docker0.
      NCCL_SOCKET_IFNAME: "enp1s0f1np1"
      # GB10 unified CPU+GPU pool: Ray's monitor counts both, so the 74 GiB
      # /rank weight load crosses the default 95% threshold and Ray SIGTERMs
      # the worker mid-load.
      RAY_memory_monitor_refresh_ms: "0"
      RIVAULT_MN_MEMORY_CAP: "110g"
      # Caps ninja parallelism during kernel JIT; unset, ninja uses nproc (20)
      # at ~3-4 GiB/process and the burst takes the node down.
      MAX_JOBS: "4"
      # Native kernel overlay (NOT fuse-overlayfs) — required on dgx-spark-1
      # whose fuse store is corrupt (ENODATA on mknod). Works on both atom
      # nodes. Propagates sbatch→srun→podman client env (no script change).
      # Same pattern as pool-glm52-temp.yaml.
      CONTAINERS_STORAGE_CONF: "/home/mnagaso/.config/containers/storage-native.conf"
      # OFFICIAL upstream image (2026-07-29, validated live as endpoint 3086).
      # The scitrera ds4:20260609 image is CUDA 13.2 and therefore fails
      # `cudaErrorUnsupportedPtxVersion` during Marlin weight repack on this
      # fleet's CUDA 13.0 (580.x) driver. v0.26.0 is built for CUDA 13.0.2
      # (matches the driver exactly), supports sm_121
      # (TORCH_CUDA_ARCH_LIST=8.0..12.0), and at this exact tag ships the
      # DeepSeek-V4 stack natively: vllm/models/deepseek_v4 (+dspark MTP
      # draft), tokenizer_mode "deepseek_v4", tool-call + reasoning parsers,
      # sparse-MLA indexer (fp8_ds_mla) — all confirmed loading OK without
      # the scitrera container. Fixed tag, never :latest (drifted 0.25→0.26
      # underneath us and broke laguna-s, 2026-07-27).
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.26.0"
      # recipe parsers — deepseek_v4, NOT the older deepseek_r1.
      VLLM_TOOL_CALL_PARSER: "deepseek_v4"
      VLLM_REASONING_PARSER: "deepseek_v4"
      VLLM_TRUST_REMOTE_CODE: "1"
      # Own env var rather than inline in VLLM_EXTRA_ARGS: sbatch --export is
      # comma-delimited with no escaping, so comma-bearing values are base64
      # hopped by _build_wrapper_job_exports and decoded in the wrapper
      # preamble. Same treatment as hy3-nvfp4 / laguna-s.
      VLLM_SPECULATIVE_CONFIG: '{"method":"mtp","num_speculative_tokens":2}'
      # TILELANG_* and VLLM_TRITON_MLA_SPARSE_* envs are scitrera-image-
      # specific and do not exist in upstream v0.26.0 — sparse-MLA is handled
      # natively via its attention/config there, so none are set.
      # Remaining recipe flags that have no dedicated env channel on the
      # multi-node serve line (--max-num-seqs is single-node only, L1305).
      #
      # --load-format instanttensor is scitrera-specific and unknown to
      # upstream; dropped (upstream defaults handle safetensors/shards).
      # Cudagraphs stay ON per the recipe (FULL_AND_PIECEWISE, capture 8) —
      # validated: with v0.26.0 the official stack does NOT emit NaN/garbage
      # and does NOT deadlock on cross-node TP2 here (endpoint 3086 chat/
      # arithmetic verified 2026-07-29). FALLBACK if that ever regresses:
      # delete --compilation-config below and add VLLM_ENFORCE_EAGER: "1".
      VLLM_EXTRA_ARGS: >-
        --max-num-seqs 10
        --max-num-batched-tokens 6144
        --tokenizer-mode deepseek_v4
        --kv-cache-dtype fp8
        --enable-prefix-caching
        --max-cudagraph-capture-size 8
        --compilation-config {"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}
      # Single staged copy is enough: bdrt $HOME is shared NFS.
      RCCS_SKIP_CDI: "1"

