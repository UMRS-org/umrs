# Pool roster: bdrt (NVIDIA GB10 DGX-Spark, aarch64) — Qwen3.6-35B-A3B-NVFP4 · Step-3.7-Flash-148B · Hy3-295B
# Usage:
#   r4 source use bdrt && r4 pool up umrs/deploy/bdrt/pool-bdrt-step.yaml
#
# Target: nimbus-0 login node → Slurm partitions `spark` (1 node) / `spark-double` (2 nodes).
#         GB10 Grace-Blackwell, 128 GiB unified memory per node.
#
# Model deployment order:
#   1. Stage weights via UMRS (or copy to /home/mnagaso/umrs_models)
#   2. Register models in bdrt catalog:
#      umrs --profile bdrt model register <name> <path> --type llm --scope system
#   3. r4 pool up pool-bdrt-step.yaml

pool: bdrt-step
defaults:
  source: bdrt
  tier: system
  ttl_sec: 0
  timeout: 172800         # 2 days (provision HTTP timeout)
  RIVAULT_JOB_TIMEOUT: "0"   # infinite monitor loop — BDRT has no Slurm timelimit

endpoints:
  # ── Qwen3.6-35B-A3B-NVFP4 (single node → spark) ──────────────────────
  #  35B MoE (3B active), NVFP4 (Blackwell-native 4-bit float). Fits 1× GB10.
  - name: qwen3.6-35b-a3b
    model: Qwen3.6-35B-A3B-NVFP4
    tier: system
    node_count: 1
    partition: spark
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--nvidia--Qwen3.6-35B-A3B-NVFP4/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "nvidia/Qwen3.6-35B-A3B-NVFP4"
      VLLM_TOKENIZER: "nvidia/Qwen3.6-35B-A3B-NVFP4"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_MAX_NUM_SEQS: "4"
      VLLM_TOOL_CALL_PARSER: "qwen3_xml"
      VLLM_REASONING_PARSER: "qwen3"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_ENFORCE_EAGER: "1"
      # NVFP4 mixed-precision MoE on GB10 Blackwell: pin the quant-aware Marlin
      # fused-MoE backend AND override to vLLM 0.23.0 (arm64 `:latest`). The
      # partition-default cu130-nightly-aarch64 image is a FROZEN 0.19.2 nightly
      # with NO ModelOpt NVFP4 MoE quant method, so the experts fall back to the
      # "Unquantized MoE backend" (marlin isn't even offered) → vLLM aborts
      # weight-load with KeyError: 'layers.0.mlp.experts.w2_input_scale'.
      # Same fix as deploy/rccs/pool-rccs-3models.yaml (verified end-to-end).
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      RCCS_SKIP_CDI: "1"
      VLLM_EXTRA_ARGS: >-
        --kv-cache-dtype fp8
        --attention-backend flashinfer
        --max-num-batched-tokens 8192
        --enable-prefix-caching


  # ── Step-3.7-Flash-148B (2 nodes → edge-double) ─────────────────────
  #  148B MoE, NVFP4 quantized (base: stepfun-ai/Step-3.7-Flash-NVFP4).
  #  ~50-60 GB active GPU mem per node → requires 2× GB10, TP=2.
  #  Architecture: step3p7 (requires VLLM_TRUST_REMOTE_CODE).
  - name: step-3.7-flash-148b
    model: step-3.7-flash-148b
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--0xSero--Step-3.7-Flash-148B/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "stepfun-ai/Step-3.7-Flash-NVFP4"
      VLLM_TOKENIZER: "stepfun-ai/Step-3.7-Flash-NVFP4"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      # Prefill throughput: vLLM defaults max_num_batched_tokens to 2048 for
      # the OpenAI server, chunking a 100k-token prefill into ~50 tiny steps
      # (each paying the cross-node PP bubble). 8192 quarters the step count
      # and time-to-first-token without affecting decode memory.
      VLLM_EXTRA_ARGS: "--max-num-batched-tokens 8192"
      # NVFP4 MoE on GB10 Blackwell — same fix as the Qwen entry above:
      # Marlin quant-aware MoE backend + vLLM 0.23.0 (arm64 `:latest`).
      # The frozen 0.19.2 nightly lacks the ModelOpt NVFP4 MoE method, so the
      # experts fall back to the Unquantized MoE backend → KeyError w2_input_scale.
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      VLLM_TRUST_REMOTE_CODE: "1"
      RCCS_SKIP_CDI: "1"

  # ── Hy3-295B-A21B (2 nodes → edge-double) ────────────────────────────
  #  295B MoE (A21B = 21B active params, 192 experts, 8 per token).
  #  Quantized with compressed-tensors (5.3-bit).
  #  Requires 2× GB10 for TP=2 (~60-70 GB active mem per node).
  #  Architecture: hy_v3 (HYV3ForCausalLM).
  #  NOTE: Using triton backend for testing Ray networking on BDRT.
  - name: hy3-295b-test-triton
    model: hy3-295b
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--rdtand--Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "rdtand/Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm"
      VLLM_TOKENIZER: "rdtand/Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      VLLM_MOE_BACKEND: "triton"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_EXTRA_ARGS: "--max-num-batched-tokens 8192"
      VLLM_LOGGING_LEVEL: "INFO"
      RCCS_SKIP_CDI: "1"

  # ── Hy3-295B-A21B (2 nodes → edge-double) ────────────────────────────
  #  295B MoE (A21B = 21B active params, 192 experts, 8 per token).
  #  Quantized with compressed-tensors (5.3-bit).
  #  Requires 2× GB10 for TP=2 (~60-70 GB active mem per node).
  #  Architecture: hy_v3 (HYV3ForCausalLM).
  - name: hy3-295b
    model: hy3-295b
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--rdtand--Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "rdtand/Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm"
      VLLM_TOKENIZER: "rdtand/Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_EXTRA_ARGS: "--max-num-batched-tokens 8192"
      VLLM_LOGGING_LEVEL: "INFO"
      RCCS_SKIP_CDI: "1"

  # ── Laguna-S 2.1 FP8 (2 nodes → edge-double) ─────────────────────────
  #  118B MoE (~8B active), FP8 checkpoint (~112.7 GiB).
  #  poolside/Laguna-S-2.1-FP8 with sapidlabs/Sparkulator-Laguna-S-2.1 W4A16
  #  DFlash draft — spec-decoding k=6 → 60.9 tok/s (2.3× no-draft baseline).
  #  Requires 2× GB10: TP2 is a FIT decision (112.7 GiB won't fit one node's
  #  121 GiB with KV pool room). Cross-node TP2 CUDA-graph replay deadlocks on
  #  GB10 — --enforce-eager is mandatory.
  #  Architecture: LagunaForCausalLM (natively registered, no trust-remote-code).
  #  Hybrid attention: 12 full-attention + 36 sliding-window-512 layers → KV
  #  pool cheap; pinned to 5 GiB/rank (273K tokens = 1.04× at 262K ctx).
  - name: laguna-s-2.1-fp8
    model: laguna-s-2.1-fp8
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--poolside--Laguna-S-2.1-FP8/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "poolside/Laguna-S-2.1-FP8"
      VLLM_TOKENIZER: "poolside/Laguna-S-2.1-FP8"
      VLLM_GPU_MEM_UTIL: "0.85"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      # FP8 checkpoint has native kv_cache_scheme (8-bit), vLLM resolves to
      # fp8_e4m3 automatically — no flag needed.
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      # Spec-decoding with W4A16 DFlash draft at k=6 (measured peak: 60.9 tok/s).
      # Draft model: sapidlabs/Sparkulator-Laguna-S-2.1 (W4A16 quant of poolside's
      # FP8 DFlash draft — target-precision-specific, must pair with FP8 target).
      VLLM_EXTRA_ARGS: >-
        --enforce-eager
        --kv-cache-dtype fp8
        --kv-cache-memory-bytes 5368709120
        --max-num-batched-tokens 8192
        --speculative-config {"method":"dflash","model":"/home/mnagaso/umrs_models/hub/models--sapidlabs--Sparkulator-Laguna-S-2.1/snapshots","num_speculative_tokens":6}
      # VLLM_HOST_MODEL_PATH must be mirrored on BOTH nodes for TP2 — each rank
      # reads all shards (~56.6 GiB/rank). The draft is also on both nodes.
      RCCS_SKIP_CDI: "1"

  # ── Hy3 NVFP4 (2 nodes → edge-double) ────────────────────────────────
  #  295B MoE (21B active), NVFP4 weight-only on routed-expert FFNs.
  #  LibertAIDAI/Hy3-NVFP4 checkpoint (~169 GB, 99 shards).
  #  TP2 is a FIT decision: 169 GB won't fit one node's 121 GiB.
  #  --moe-backend marlin is the ONLY NVFP4-MoE backend on sm_121 (GB10).
  #  MTP speculative decode (k=1) from checkpoint's own draft layer:
  #  61.3% acceptance, 1.61 tok/step, +43% over base (19.5 vs 13.6 tok/s).
  #  KV pool pinned to fp8 176,784 tokens (1.08× at 160K ctx).
  #  Architecture: HYV3ForCausalLM (natively registered).
  #  NOTE: Requires CUDA 13 vLLM build — docker.io/vllm/vllm-openai:hy3-arm64-cu130.
  - name: hy3-nvfp4
    model: hy3-nvfp4
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 163840
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--LibertAIDAI--Hy3-NVFP4/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "LibertAIDAI/Hy3-NVFP4"
      VLLM_TOKENIZER: "LibertAIDAI/Hy3-NVFP4"
      VLLM_GPU_MEM_UTIL: "0.85"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      # NVFP4 MoE on GB10: marlin is the ONLY backend that runs on sm_121.
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:hy3-arm64-cu130"
      # MTP spec decode from checkpoint's native draft layer (k=1).
      VLLM_EXTRA_ARGS: >-
        --enforce-eager
        --kv-cache-dtype fp8
        --max-num-batched-tokens 8192
        --speculative-config {"method":"mtp","num_speculative_tokens":1}
      # Cross-node TP2: each rank reads all 99 shards (~84.5 GB/rank).
      RCCS_SKIP_CDI: "1"

  # ── GLM-5.2 (2 nodes → edge-double) ──────────────────────────────────
  #  753B MoE (FP8 + NVFP4 2-bit experts).
  #  zai-org/GLM-5.2-FP8 checkpoint + pruned TP2 planes (2-bit experts).
  #  Requires vLLM-Moet (spark-gb10 branch) with 2-bit expert kernels.
  #  Base: ~15 tok/s single-stream. Fast build (NVFP4 big-3 + dspark W4A16):
  #  ~22 tok/s at 96K ctx, 2-bit speculator (dspark) at K=2.
  #  TP2 is FIT: 753B requires ~376 GB per rank — won't fit one node.
  #  Architecture: ChatGLMForCausalLM (requires trust-remote-code).
  #  NOTE: Requires vLLM-Moet setup (not stock vLLM). Uses prepacked planes.
  - name: glm-5.2
    model: glm-5.2
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 98304
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--zai-org--GLM-5.2-FP8/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "zai-org/GLM-5.2-FP8"
      VLLM_TOKENIZER: "zai-org/GLM-5.2-FP8"
      VLLM_GPU_MEM_UTIL: "0.85"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      # GLM-5.2 requires vLLM-Moet spark-gb10 branch with 2-bit expert kernels.
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:hy3-arm64-cu130"
      # MTP speculative decode at K=1 (base config).
      VLLM_EXTRA_ARGS: >-
        --enforce-eager
        --kv-cache-dtype fp8
        --kv-cache-memory-bytes 10737418240
        --max-num-batched-tokens 8192
        --speculative-config {"method":"mtp","num_speculative_tokens":1}
      # VLLM_MOE_W2_PREPACKED_DIR — paths to pruned TP2 planes (2-bit).
      VLLM_MOE_W2_PREPACKED_DIR: "/home/mnagaso/umrs_models/hub/models--zai-org--GLM-5.2-FP8/snapshots/moe_w2_planes_tp2_p208"
      RCCS_SKIP_CDI: "1"
