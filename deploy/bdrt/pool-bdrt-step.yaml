  #  changes capacity, not correctness, under MLA compression.
  - name: deepseek-v4-flash-0731
    model: deepseek-v4-flash-0731
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 1048576
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "deepseek-ai/DeepSeek-V4-Flash-0731"
      # VLLM_TOKENIZER intentionally UNSET — same HF-cache symlink layout
      # reasoning as the preview entry; tokenizer loads from --model dir.
      VLLM_MAX_MODEL_LEN: "1048576"
      VLLM_GPU_MEM_UTIL: "0.825"
      VLLM_TP: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      NCCL_SOCKET_IFNAME: "enp1s0f1np1"
      RAY_memory_monitor_refresh_ms: "0"
      RIVAULT_MN_MEMORY_CAP: "110g"
      MAX_JOBS: "4"
      # Native kernel overlay for the broken fuse store on dgx-spark-1.
      CONTAINERS_STORAGE_CONF: "/home/mnagaso/.config/containers/storage-native.conf"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.26.0"
      VLLM_TOOL_CALL_PARSER: "deepseek_v4"
      VLLM_REASONING_PARSER: "deepseek_v4"
      VLLM_TRUST_REMOTE_CODE: "1"
      # EngineDeadError wedges (jobs 3616/3617, 2026-08-19): 'RPC call to
      # sample_tokens timed out' repeatedly under vscode load. Verdict:
      # prefill-cap + async-scheduling (3617) did NOT stop it; VLLM_RPC_TIMEOUT
