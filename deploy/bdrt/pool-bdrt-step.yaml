  #  Fabric on the atom nodes matches the edge nodes: `enp1s0f1np1` carries
  #  10.200.0.1/30 (atom-0) <-> 10.200.0.2/30 (atom-1). The native
  #  glm52-vllm-moet path already pins NCCL/GLOO to VLLM_FABRIC_IFACE
  #  (default `enp1s0f1np1`), which is REQUIRED here: the atom nodes also run
  #  k8s (flannel.1/cni0/docker0) and expose many IPv6-link-local-only veth*
  #  interfaces that NCCL would otherwise auto-select and fail on — the same
  #  failure class as the laguna job-3033 outage (see 2026-07-28 memory).
  - name: glm-5.2
