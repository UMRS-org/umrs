      VLLM_EXTRA_ARGS: >-
        --max-num-seqs 12
        --max-num-batched-tokens 6144
        --long-prefill-token-threshold 1024
        --async-scheduling
        --tokenizer-mode deepseek_v4
        --kv-cache-dtype fp8
        --enable-prefix-caching
        --kernel-config {"enable_flashinfer_autotune":false}
      # GB10 cap-120 sparse-MLA warmup raise: the re-spun v0.26.0 image adds
      # deepseek_v4_sparse_mla_attention_warmup whose mixed prefill is hard-capped
      # at 16 tokens but the SM120 prefill kernel ICHECK requires >64 → every
      # DeepSeek-V4 sparse-MLA bring-up dies at warmup (jobs 3428/3432, EngineCore
      # "num_tokens > 64 (5 vs. 64)"). Patched file raises the constant to 80 so
      # the mixed prefill ships 79 tokens. Source = pristine file from this image
      # with the constant bumped (pristine copy: patches/flashinfer_sparse_mla_warmup.py.orig-16).
      VLLM_PATCHES: "/home/mnagaso/patches/flashinfer_sparse_mla_warmup.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/warmup/flashinfer_sparse_mla_warmup.py:d51946fa1d0d3e2bdc2f9ef56d1f7557b883db409a3c10b182cb72755bcfd99a"
      # Single staged copy is enough: bdrt $HOME is shared NFS.
      RCCS_SKIP_CDI: "1"

  # ── GLM-5.3-Flash NVFP4 (2 nodes → edge-double) ────────────────────
  #  Successor slot for deepseek-v4-flash-0731 (replace-in-place, same
  #  2× GB10 / TP=2 edge-double topology). Recipe:
  #  github.com/MiaAI-Lab/GLM-5.3-Flash-NVFP4-Dual-DGX-Spark (2026-09):
  #  Ray TP=2 (wrapper-native multi-node path), marlin MoE + eager
  #  (GB10-known-good), MTP-4 spec, fp8_e4m3 KV, 262k ctx, multimodal.
  #
  #  Weights: LibertAIDAI/GLM-5.3-Flash-NVFP4 @ caca4e6a (~181 GiB, 120
  #  shards). Glm5NextProcessor.from_pretrained() opens
  #  processor_config.json CWD-relative → the wrapper must pass the
  #  resolved SNAPSHOT DIR (VLLM_HOST_MODEL_PATH convention as
  #  Qwen3.8/0731), never a bare repo id.
  #
  #  Image: ghcr.io/miaai-lab/glm53-flash-spark:mm-ray-v1 (arm64; kernel
  #  glm53-flash-sm121:v8 = SM90 sparse-MLA + FA2 NoPE path + Ray 2.58 +
  #  MM env; anon-pullable on GHCR). NOT the EXL3 overlay image —
  #  different quant class.
  #  chat_template.jinja inside the snapshot was refreshed from HF main
  #  (emit_image/emit_video) — the cached snapshot ships an older one.
  #
  #  GPU_MEM_UTIL 0.84 is load-bearing: 0.90 fails the GB10 free-mem
  #  check, 0.86 UMA-OOMed the recipe kit during API MM warmup.
  - name: glm-5.3-flash
    model: glm-5.3-flash
    aliases:
      - glm-5.3-flash-nvfp4
      - GLM-5.3-Flash-NVFP4
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--LibertAIDAI--GLM-5.3-Flash-NVFP4/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "LibertAIDAI/GLM-5.3-Flash-NVFP4"
      VLLM_MAX_MODEL_LEN: "262144"
      VLLM_GPU_MEM_UTIL: "0.84"
      VLLM_MAX_NUM_SEQS: "8"
      VLLM_TP: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      NCCL_SOCKET_IFNAME: "enp1s0f1np1"
      NCCL_IB_GID_INDEX: "3"
      RAY_memory_monitor_refresh_ms: "0"
      RIVAULT_MN_MEMORY_CAP: "110g"
      MAX_JOBS: "4"
      # Native kernel overlay (fuse-overlayfs breakage class on spark nodes).
      CONTAINERS_STORAGE_CONF: "/home/mnagaso/.config/containers/storage-native.conf"
      VLLM_DOCKER_IMAGE: "ghcr.io/miaai-lab/glm53-flash-spark:mm-ray-v1"
      # 2026-09-08 nimbus-0: multi-node Ray-head podman run aborts with
      #   Error: invalid option specified: "uid"
      # at the wrapper's keep-id:uid=0,gid=0 userns pass-through (sbatch-only;
      # the identical invocation passes interactively and on the rccs GB10
      # venue). Host mode avoids the batch parse path entirely; this recipe
      # has no CDI usage that requires keep-id (RCCS_SKIP_CDI=1 already).
      RIVAULT_USERNS_MODE: "host"
      VLLM_TOOL_CALL_PARSER: "glm47"
      VLLM_REASONING_PARSER: "glm45"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_MOE_BACKEND: "marlin"
      VLLM_ENFORCE_EAGER: "1"
      # SM121 kernel/arch pins from the recipe (re-assert image envs).
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # MTP-4 per recipe (checkpoint's own MTP head; no external drafter).
      VLLM_SPECULATIVE_CONFIG: '{"method":"mtp","num_speculative_tokens":4}'
      VLLM_EXTRA_ARGS: >-
        --kv-cache-dtype fp8_e4m3
        --block-size 2304
        --enable-auto-tool-choice
        --limit-mm-per-prompt {"image":4,"video":1}
        --skip-mm-profiling
      # NO --chat-template here: host paths are not visible inside the
      # vLLM container (HF cache maps to /root/.cache/huggingface; job
      # 4315 died "appears path-like, but doesn't exist"). vLLM auto-loads
      # <model_dir>/chat_template.jinja, and the staged snapshot already
      # carries the refreshed emit_image/emit_video template from HF main.
      # Single staged copy is enough: bdrt $HOME is shared NFS.
      RCCS_SKIP_CDI: "1"

