# Pool roster: bdrt (NVIDIA GB10 DGX-Spark, aarch64) — Qwen3.6-35B-A3B-NVFP4 · Step-3.7-Flash-148B · Hy3-295B
# Usage:
#   r4 source use bdrt && r4 pool up umrs/deploy/bdrt/pool-bdrt-step.yaml
#
# Target: nimbus-0 login node → Slurm partitions `spark` (1 node) / `spark-double` (2 nodes).
#         GB10 Grace-Blackwell, 128 GiB unified memory per node.
#
# Model deployment order:
#   1. Stage weights via UMRS (or copy to /home/mnagaso/umrs_models)
#   2. Register models in bdrt catalog:
#      umrs --profile bdrt model register <name> <path> --type llm --scope system
#   3. r4 pool up pool-bdrt-step.yaml

pool: bdrt-step
defaults:
  source: bdrt
  tier: system
  ttl_sec: 0
  timeout: 172800         # 2 days (provision HTTP timeout)
  RIVAULT_JOB_TIMEOUT: "0"   # infinite monitor loop — BDRT has no Slurm timelimit

endpoints:
  # ── Qwen3.6-35B-A3B-NVFP4 (single node → spark, pinned dgx-spark-1) ───
  #  35B MoE (3B active), NVFP4 (Blackwell-native 4-bit float). Fits 1× GB10.
  #
  # node-pin: pies grepped on cluster convention (dgx-spark-1 = node whose 4
  # GPUs stay dedicated to single-NVFP4 stacks). `nodelist` forwards to the
  # provision API / launcher as #SBATCH --nodelist=... .
  #
  # node-health note (2026-08-19): dgx-spark-1 (spark-atom-1) currently has
  # rootless-podman drift — its /run/user/<uid> runtime dir is never created
  # and `podman ps` fails with "default OCI runtime runc not found" REGARDLESS
  # of XDG_RUNTIME_DIR. The compose bring-up still works, only the launcher's
  # monitor loop misreads the stack as dead (rc=125 x3 => teardown). Requires
  # the monitor-tolerance overrides below; revert them when the node is
  # rebooted (needs admin; flagged 2026-07-28, still pending).
  - name: qwen3.6-35b-a3b
    model: Qwen3.6-35B-A3B-NVFP4
    aliases:
      - qwen3.6-35b-a3b        # catalog slug used by registry rows/users
    tier: system
    node_count: 1
    partition: spark
    nodelist: dgx-spark-1    # -> #SBATCH --nodelist=dgx-spark-1 (API-supported)
    max_model_len: 262144
    env_vars:
      # atom-1 monitor-drift overrides: never tear the stack down on podman
      # client rc=125, and never respawn the engine on the same false signal.
      XDG_RUNTIME_DIR: "/tmp/xdg-umrs-q36"
      RIVAULT_ENGINE_ZERO_STREAK_TOLERANCE: "1000000"
      RIVAULT_ENGINE_RESPAWN_MAX: "0"
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--nvidia--Qwen3.6-35B-A3B-NVFP4/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "nvidia/Qwen3.6-35B-A3B-NVFP4"
      VLLM_TOKENIZER: "nvidia/Qwen3.6-35B-A3B-NVFP4"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_MAX_NUM_SEQS: "4"
      VLLM_TOOL_CALL_PARSER: "qwen3_xml"
      VLLM_REASONING_PARSER: "qwen3"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_ENFORCE_EAGER: "1"
      # Explicit context-length env_var channel — the pool top-level
      # max_model_len flows through the UMRS API → submit_env, but the
      # env var path is the proven reliable route (same one used in the
      # multi-node diag roster). Guarantees the vLLM container serves at
      # the requested context instead of silently defaulting to 4096.
      VLLM_MAX_MODEL_LEN: "262144"
      # NVFP4 mixed-precision MoE on GB10 Blackwell: pin the quant-aware Marlin
      # fused-MoE backend AND override to vLLM 0.23.0 (arm64 `:latest`). The
      # partition-default cu130-nightly-aarch64 image is a FROZEN 0.19.2 nightly
      # with NO ModelOpt NVFP4 MoE quant method, so the experts fall back to the
      # "Unquantized MoE backend" (marlin isn't even offered) → vLLM aborts
      # weight-load with KeyError: 'layers.0.mlp.experts.w2_input_scale'.
      # Same fix as deploy/rccs/pool-rccs-3models.yaml (verified end-to-end).
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      RCCS_SKIP_CDI: "1"
      # fuse-overlayfs on dgx-spark-1 is corrupt (ENODATA at bind-mount time —
      # recurrence of the 2026-07-28 class, confirmed 2026-08-18 by busybox
      # smoke). Native kernel overlay works on every node; shield this entry so
      # a landing on the broken node still comes up (same workaround already on
      # the deepseek-0731 and qwen3.8 roster entries).
      CONTAINERS_STORAGE_CONF: "/home/mnagaso/.config/containers/storage-native.conf"
      VLLM_EXTRA_ARGS: >-
        --kv-cache-dtype fp8
        --attention-backend flashinfer
        --max-num-batched-tokens 8192
        --enable-prefix-caching


  # ── Qwen3.8-27B-NVFP4 (single node → spark) ─────────────────────────
  #  27B DENSE (SwiGLU, no experts) NVFP4 in compressed-tensors format
  #  (dynamic 4-bit weights/activations; 8-bit groups for sensitive modules),
  #  multimodal (vision tower). Source recipe:
  #  github.com/MiaAI-Lab/Qwen3.8-27B-DGX-Spark-RTX-6000 (vLLM ≥0.25.0 required;
  #  nightly-aarch64 currently ships v0.27.x).
  #  GB10/SM121 path notes: the checkpoint carries a calibrated FP8
  #  kv_cache_scheme — vLLM "auto" applies it (2× KV memory savings); FP8 KV on
  #  sm_121 forces --attention-backend triton_attn (FA2 cannot serve FP8 KV).
  #  YaRN 1M ctx via --hf-overrides rope_parameters (factor 4.0 over native
  #  262,144). unsloth ships MTP drafter weights (model_mtp.safetensors);
  #  spec decode k=2 per recipe — kept ON, with the deepseek-cap-120 crash family
  #  explicitly out of scope here (no DSV4 sparse-MLA backend involved; if the
  #  first bring-up dies at any drafter stage, drop this spec block wholesale).
  - name: qwen3.8-27b-nvfp4
    model: Qwen3.8-27B-NVFP4
    aliases:
      - qwen38-27b-nvfp4
      - unsloth/Qwen3.8-27B-NVFP4
    tier: system
    node_count: 1
    partition: spark
    max_model_len: 1000000
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--unsloth--Qwen3.8-27B-NVFP4/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "unsloth/Qwen3.8-27B-NVFP4"
      VLLM_TOKENIZER: "unsloth/Qwen3.8-27B-NVFP4"
      VLLM_GPU_MEM_UTIL: "0.84"
      VLLM_MAX_NUM_SEQS: "4"
      VLLM_TOOL_CALL_PARSER: "qwen3_coder"
      VLLM_REASONING_PARSER: "qwen3"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_FLOAT32_MATMUL_PRECISION: "high"
      CUTE_DSL_ARCH: "sm_121a"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_MAX_MODEL_LEN: "1000000"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:nightly-aarch64"
      VLLM_SPECULATIVE_CONFIG: '{"method":"mtp","num_speculative_tokens":2}'
      RCCS_SKIP_CDI: "1"
      VLLM_EXTRA_ARGS: >-
        --quantization compressed-tensors
        --attention-backend triton_attn
        --hf-overrides {"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}
        --max-num-batched-tokens 8192
        --enable-chunked-prefill
        --enable-prefix-caching
        --skip-mm-profiling
        --tool-call-parser qwen3_coder
        --enable-auto-tool-choice
        --media-io-kwargs {"video":{"num_frames":-1}}
      CONTAINERS_STORAGE_CONF: "/home/mnagaso/.config/containers/storage-native.conf"


  # ── Bespoke-Nimble-9B decision model — second venue (ADR-076) ───────
  #  Replica of the rccs entry (deploy/rccs/pool-rccs.yaml) so a decision
  #  model survives RCCS reservations (nakao-1009 holds every rccs GB10 node
  #  2026-10-09 13:00 → 10-16 13:00 JST; docs/development/
  #  dgx-spark-fleet-plan-2026-10-08.md). bdrt has no Slurm time limit, so
  #  keep_alive only respawns a dead endpoint here (no walltime relay).
  #  Registry reads are venue-filtered: this endpoint serves bdrt callers.
  #  Owner legs: copy the merged BF16 checkpoint (READY.json checked) to
  #  /home/mnagaso/umrs_models/Bespoke-Nimble-9B, then
  #    umrs --profile bdrt model register Bespoke-Nimble-9B \
  #      /home/mnagaso/umrs_models/Bespoke-Nimble-9B --type llm --scope system
  #  Until then each relay cycle logs a failed provision and changes nothing.
  #  0.30 x 121.6 GiB = 36 GiB; check `squeue -p spark` before converging —
  #  if both spark nodes carry 0.78+ endpoints, this replica queues.
  - name: bespoke-nimble-9b
    model: Bespoke-Nimble-9B
    tier: system
    node_count: 1
    gpu_count: 1
    partition: spark
    max_model_len: 8192
    ttl_sec: 0
    access: [system]
    keep_alive:
      project_id: default
      user: mnagaso
      handover_grace_sec: 300
    env_vars:
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.30.0"
      VLLM_GPU_MEM_UTIL: "0.30"
      VLLM_MAX_MODEL_LEN: "8192"
      VLLM_MAX_NUM_SEQS: "32"
      VLLM_LANGUAGE_MODEL_ONLY: "1"
      RIVAULT_PROFILES: "harness vllm litellm-db"
      RCCS_SKIP_CDI: "1"
      # Native kernel overlay: shields a landing on dgx-spark-1 (corrupt
      # fuse-overlayfs, see the qwen3.6 entry above).
      CONTAINERS_STORAGE_CONF: "/home/mnagaso/.config/containers/storage-native.conf"


  # ── Step-3.7-Flash-148B (2 nodes → edge-double) ─────────────────────
  #  148B MoE, NVFP4 quantized (base: stepfun-ai/Step-3.7-Flash-NVFP4).
  #  ~50-60 GB active GPU mem per node → requires 2× GB10, TP=2.
  #  Architecture: step3p7 (requires VLLM_TRUST_REMOTE_CODE).
  - name: step-3.7-flash-148b
    model: step-3.7-flash-148b
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--0xSero--Step-3.7-Flash-148B/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "stepfun-ai/Step-3.7-Flash-NVFP4"
      VLLM_TOKENIZER: "stepfun-ai/Step-3.7-Flash-NVFP4"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      # Prefill throughput: vLLM defaults max_num_batched_tokens to 2048 for
      # the OpenAI server, chunking a 100k-token prefill into ~50 tiny steps
      # (each paying the cross-node PP bubble). 8192 quarters the step count
      # and time-to-first-token without affecting decode memory.
      VLLM_EXTRA_ARGS: "--max-num-batched-tokens 8192"
      # NVFP4 MoE on GB10 Blackwell — same fix as the Qwen entry above:
      # Marlin quant-aware MoE backend + vLLM 0.23.0 (arm64 `:latest`).
      # The frozen 0.19.2 nightly lacks the ModelOpt NVFP4 MoE method, so the
      # experts fall back to the Unquantized MoE backend → KeyError w2_input_scale.
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      VLLM_TRUST_REMOTE_CODE: "1"
      RCCS_SKIP_CDI: "1"

  # ── Hy3-295B-A21B (2 nodes → edge-double) ────────────────────────────
  #  295B MoE (A21B = 21B active params, 192 experts, 8 per token).
  #  Quantized with compressed-tensors (5.3-bit).
  #  Requires 2× GB10 for TP=2 (~60-70 GB active mem per node).
  #  Architecture: hy_v3 (HYV3ForCausalLM).
  #  NOTE: Using triton backend for testing Ray networking on BDRT.
  - name: hy3-295b-test-triton
    model: hy3-295b
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--rdtand--Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "rdtand/Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm"
      VLLM_TOKENIZER: "rdtand/Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      VLLM_MOE_BACKEND: "triton"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_EXTRA_ARGS: "--max-num-batched-tokens 8192"
      VLLM_LOGGING_LEVEL: "INFO"
      RCCS_SKIP_CDI: "1"

  # ── Hy3-295B-A21B (2 nodes → edge-double) ────────────────────────────
  #  295B MoE (A21B = 21B active params, 192 experts, 8 per token).
  #  Quantized with compressed-tensors (5.3-bit).
  #  Requires 2× GB10 for TP=2 (~60-70 GB active mem per node).
  #  Architecture: hy_v3 (HYV3ForCausalLM).
  - name: hy3-295b
    model: hy3-295b
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--rdtand--Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "rdtand/Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm"
      VLLM_TOKENIZER: "rdtand/Hy3-295B-A21B-PrismaQuant-5.3bit-2xSpark-vllm"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_EXTRA_ARGS: "--max-num-batched-tokens 8192"
      VLLM_LOGGING_LEVEL: "INFO"
      RCCS_SKIP_CDI: "1"

  # ── Laguna-S 2.1 FP8 (2 nodes → edge-double) ─────────────────────────
  #  118B MoE (~8B active), FP8 checkpoint (~112.7 GiB).
  #  poolside/Laguna-S-2.1-FP8 with sapidlabs/Sparkulator-Laguna-S-2.1 W4A16
  #  DFlash draft — spec-decoding k=6 → 60.9 tok/s (2.3× no-draft baseline).
  #  Requires 2× GB10: TP2 is a FIT decision (112.7 GiB won't fit one node's
  #  121 GiB with KV pool room). Cross-node TP2 CUDA-graph replay deadlocks on
  #  GB10 — --enforce-eager is mandatory.
  #  Architecture: LagunaForCausalLM (natively registered, no trust-remote-code).
  #  Hybrid attention: 12 full-attention + 36 sliding-window-512 layers → KV
  #  pool cheap; pinned to 5 GiB/rank (273K tokens = 1.04× at 262K ctx).
  - name: laguna-s-2.1-fp8
    model: laguna-s-2.1-fp8
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 262144
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--poolside--Laguna-S-2.1-FP8/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "poolside/Laguna-S-2.1-FP8"
      VLLM_TOKENIZER: "poolside/Laguna-S-2.1-FP8"
      VLLM_GPU_MEM_UTIL: "0.85"
      VLLM_MAX_NUM_SEQS: "2"
      # Cross-node TP2 / PP1 per the dual-spark recipe (--tensor-parallel-size 2,
      # NO pipeline parallelism). serve-model.slurm reads VLLM_TP natively; set it
      # explicitly so the multi-node wrapper forms a single TP=2 group across the
      # two nodes instead of deriving PP=2 (the DFlash draft is not SupportsPP).
      VLLM_TP: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      # Pin NCCL to the direct Spark-to-Spark QSFP fabric (10.200.0.4/30:
      # spark-edge-0=.5, spark-edge-1=.6). REQUIRED for cross-node TP2.
      # ROOT CAUSE (job 3033, 2026-07-28): with NCCL_SOCKET_IFNAME unset, NCCL
      # auto-enumerates every interface on the edge nodes and picks
      # `enP2p1s0f1np1`, which carries ONLY an IPv6 link-local address
      # (fe80::.../64) and no IPv4 and no route. ncclCommInitRank then dies with
      #   socketStartConnect: connect to fe80::b9e0:40b:9006:4402%enP2p1s0f1np1
      #   failed : Network is unreachable
      #   -> RuntimeError: NCCL error: unhandled system error
      # which fails EngineCore init and exits the head vLLM container. Pinning
      # the single routable fabric iface also excludes wifi (wlP9s9), docker0
      # and the 1G mgmt NIC (enP7s7) from the candidate set, so the TP2
      # all-reduce rides the 200G direct link. serve-model.slurm forwards
      # NCCL_SOCKET_IFNAME into the shared _mn_vllm_args, so this reaches BOTH
      # the head and the worker container. Same iface the native GLM path
      # already pins via VLLM_FABRIC_IFACE (serve-model.slurm:1095).
      NCCL_SOCKET_IFNAME: "enp1s0f1np1"
      # Disable Ray's memory monitor (recipe requirement). On GB10 unified
      # memory, Ray counts CPU+GPU usage system-wide; loading the ~56.6 GiB/rank
      # FP8 checkpoint crosses the default 95% threshold and Ray SIGTERMs the
      # worker node (~45s after join), killing the vLLM TP1 RayWorkerProc actor
      # ("node terminated expectedly: received SIGTERM"). That fails EngineCore
      # init, the head vLLM exits, the head GCS dies, and the worker raylet then
      # crash-loops ("Failed to connect to GCS ... TimedOut"). The recipe sets
      # RAY_memory_monitor_refresh_ms=0 on both raylets AND the serve process;
      # serve-model.slurm forwards this roster var into the shared _mn_vllm_args
      # so it reaches both the head (ray head + vLLM) and worker ray containers.
      RAY_memory_monitor_refresh_ms: "0"
      # cgroup memory cap for the head + worker ray containers. GB10 has 121 GiB
      # UNIFIED CPU+GPU memory; the FP8 weight-load page-cache spike otherwise
      # thrashes the node (or trips the monitor) into the SIGTERM death above.
      # This forces page-cache reclaim under the cap, mirroring the recipe's
      # systemd `-p MemoryMax=110G -p MemorySwapMax=0`.
      RIVAULT_MN_MEMORY_CAP: "110g"
      # FP8 checkpoint has native kv_cache_scheme (8-bit), vLLM resolves to
      # fp8_e4m3 automatically — no flag needed.
      VLLM_MOE_BACKEND: "marlin"
      # PINNED, not :latest — :latest silently moved v0.25.1 -> v0.26.0 (built
      # 2026-07-27) and broke this recipe: DFlash's _create_draft_vllm_config()
      # now flows through a changed AttentionConfig/replace() path, surfacing as
      # "ValueError: Field 'backend_per_kind' not found in AttentionConfig" at
      # EngineCore startup. hy3-arm64-cu130 is a fixed tag already validated on
      # this hardware (checked job 2963: also lacks get_cache_scale, i.e. same
      # vLLM vintage as the working 0.25.1 recipe) and does not float underneath us.
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:hy3-arm64-cu130"
      # Laguna emits poolside-format tool calls (<tool_call>name<arg_key>k</arg_key>
      # <arg_value>v</arg_value></tool_call>) and </think> reasoning markers. The
      # default hermes parser cannot parse them → tool calls leak as plain text and
      # agent clients (Copilot) stall after the first sentence. vLLM 0.25.1 ships
      # dedicated poolside_v1 tool + reasoning parsers (validated job 2996:
      # finish_reason=tool_calls with structured arguments).
      VLLM_TOOL_CALL_PARSER: "poolside_v1"
      VLLM_REASONING_PARSER: "poolside_v1"
      # Patched vllm/model_executor/models/laguna_dflash.py (hasattr guard around
      # quant_config.get_cache_scale — CompressedTensorsConfig W4A16 draft lacks
      # that FP8-only API in vLLM 0.25.1). Bind-mounted over the in-image module
      # on head AND workers by serve-model.slurm. Lives on shared /home NFS.
      VLLM_PATCH_LAGUNA_DFLASH: "/home/mnagaso/patches/laguna_dflash.py"
      # Spec-decoding with W4A16 DFlash draft at k=6 (measured peak: 60.9 tok/s).
      # Draft model: sapidlabs/Sparkulator-Laguna-S-2.1 (W4A16 quant of poolside's
      # FP8 DFlash draft — target-precision-specific, must pair with FP8 target).
      # The draft `model` must be the CONTAINER-visible path: the HF cache root
      # (VLLM_PATH_TO_HUGGINGFACE=/home/mnagaso/umrs_models) is bind-mounted to
      # /root/.cache/huggingface inside the vLLM container, so the host path
      # /home/mnagaso/umrs_models/hub/... maps to /root/.cache/huggingface/hub/...
      # A host absolute path would not exist in-container → vLLM falls back to
      # HF-Hub repo-id resolution and fails under HF_HUB_OFFLINE=1.
      VLLM_SPECULATIVE_CONFIG: '{"method":"dflash","model":"/root/.cache/huggingface/hub/models--sapidlabs--Sparkulator-Laguna-S-2.1/snapshots","num_speculative_tokens":6}'
      VLLM_EXTRA_ARGS: >-
        --enforce-eager
        --kv-cache-dtype fp8
        --kv-cache-memory-bytes 5368709120
        --max-num-batched-tokens 8192
      # VLLM_HOST_MODEL_PATH must be mirrored on BOTH nodes for TP2 — each rank
      # reads all shards (~56.6 GiB/rank). The draft is also on both nodes.
      RCCS_SKIP_CDI: "1"

  # ── Laguna-M.1 NVFP4 (2 nodes → spark-double) ────────────────────────
  #  226B MoE (~22B active), 70 layers, 256 experts top-16, NVFP4.
  #  poolside/Laguna-M.1-NVFP4 checkpoint (139.32 GB, 28 shards, 40 files).
  #  TP2 is a FIT decision: 64.98 GiB weights/rank won't leave usable KV on
  #  one GB10 (119.69 GiB unified CPU+GPU).
  #  Per howtospark "Laguna-M.1 NVFP4 dual-Spark TP2" recipe (verified
  #  2026-07-28 on this exact hardware).
  #  Architecture LagunaForCausalLM is NATIVELY registered in vLLM 0.26.0 —
  #  no --trust-remote-code, and NO source patches of any kind. That is why
  #  this model runs on the stock container path (unlike GLM-5.2, which
  #  needed a bare venv and was abandoned).
  #  First start ~25 min: ~8 min/rank shard load + ~15 min NVFP4 MoE kernel JIT.
  - name: laguna-m1-nvfp4
    model: laguna-m1-nvfp4
    tier: system
    node_count: 2
    partition: spark-double
    max_model_len: 196608
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--poolside--Laguna-M.1-NVFP4/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "poolside/Laguna-M.1-NVFP4"
      VLLM_TOKENIZER: "poolside/Laguna-M.1-NVFP4"
      # Explicit env channel — the multi-node serve line reads
      # ${VLLM_MAX_MODEL_LEN:-4096}, so omitting this silently serves 4096.
      VLLM_MAX_MODEL_LEN: "196608"
      VLLM_GPU_MEM_UTIL: "0.85"
      # Cross-node TP2 / PP1. serve-model.slurm passes -tp "$VLLM_TP"; set both
      # so the wrapper forms ONE TP=2 group across the pair instead of PP=2.
      VLLM_TP: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      # REQUIRED — NOT a tuning knob. Cross-node TP2 cudagraph replay deadlocks
      # on GB10: the first real generation hangs and the engine dies on an RPC
      # timeout. This is a FLEET property of dual-Spark TP2, not a Laguna one.
      # Confirmed the hard way by GLM-5.2 job 3056 (2026-07-28), which reached
      # "Application startup complete" and then hung 533s on an 8-token
      # completion with cudagraphs captured (FULL_AND_PIECEWISE).
      VLLM_ENFORCE_EAGER: "1"
      # Pin NCCL to the routable 200G Spark-to-Spark fabric. Without this NCCL
      # enumerates an IPv6-link-local-only iface and ncclCommInitRank dies with
      # "Network is unreachable" (same fix as laguna-s-2.1-fp8, job 3033).
      NCCL_SOCKET_IFNAME: "enp1s0f1np1"
      # GB10 unified CPU+GPU pool: Ray's monitor counts both, so the 64.98 GiB
      # /rank weight load crosses the default 95% threshold and Ray SIGTERMs the
      # worker mid-load. Recipe disables the monitor on both raylets.
      RAY_memory_monitor_refresh_ms: "0"
      RIVAULT_MN_MEMORY_CAP: "110g"
      # Caps ninja parallelism for the ~15 min NVFP4 MoE kernel JIT. Load-bearing:
      # unset, ninja uses nproc (20) at ~3-4 GiB/process and the burst takes the
      # node down. serve-model.slurm forwards this into BOTH raylet containers
      # (Ray actors inherit the raylet env, not the driver's).
      MAX_JOBS: "4"
      # Pinned to the exact version the recipe was verified against (vLLM
      # 0.26.0 / torch 2.11.0+cu130, CUDA 13.0.2). LagunaForCausalLM is natively
      # registered there, so no --trust-remote-code and no source patches.
      #
      # Do NOT use `:latest` here — it is mutable and already broke
      # laguna-s-2.1-fp8 when it moved 0.25.1 -> 0.26.0 on 2026-07-27.
      # `v0.26.0` is a multi-arch manifest list, so podman selects the image for
      # the node's architecture; nothing here assumes aarch64:
      #   arm64 -> sha256:e51157695347d2cee1b13f1ac05369df6216af5d2991b6ad5a2e700861cba4b1
      #   amd64 -> sha256:770fe65b2c73ee74a5c42165cf3433de4048cc2cd9c57a937ca4e35aba5aa87b
      # The arm64 digest is already among the local image's RepoDigests on the
      # bdrt nodes (it is the same content `:latest` resolved to), so this pin
      # costs no additional layer pull.
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.26.0"
      # Laguna family emits poolside-format tool calls and </think> reasoning
      # markers; the default hermes parser leaks them as plain text.
      VLLM_TOOL_CALL_PARSER: "poolside_v1"
      VLLM_REASONING_PARSER: "poolside_v1"
      # Deliberately NOT setting VLLM_MOE_BACKEND. Our Hy3 entry pins marlin as
      # "the only NVFP4-MoE backend on sm_121", but that predates 0.26.0 — this
      # recipe expects vLLM to auto-select FLASHINFER_CUTLASS. Expect the log
      # line: Using 'FLASHINFER_CUTLASS' NvFp4 MoE backend.
      #
      # KV comes up FP8 automatically from the checkpoint's kv_cache_scheme, so
      # no --kv-cache-dtype. 16 GiB pool => ~239,664 tokens at 140 KiB/token.
      # --max-num-seqs is NOT on the multi-node serve line (single-node only,
      # L1305), so it must be passed here.
      VLLM_EXTRA_ARGS: >-
        --kv-cache-memory-bytes 17179869184
        --max-num-seqs 2
        --max-num-batched-tokens 4096
      # Single staged copy is enough: bdrt $HOME is shared NFS
      # (storage00-0:/HPBD_HOMES), unlike the recipe's node-local assumption.
      RCCS_SKIP_CDI: "1"

  # ── Hy3 NVFP4 (2 nodes → edge-double) ────────────────────────────────
  #  295B MoE (21B active), NVFP4 weight-only on routed-expert FFNs.
  #  LibertAIDAI/Hy3-NVFP4 checkpoint (~169 GB, 99 shards).
  #  TP2 is a FIT decision: 169 GB won't fit one node's 121 GiB.
  #  --moe-backend marlin is the ONLY NVFP4-MoE backend on sm_121 (GB10).
  #  MTP speculative decode (k=1) from checkpoint's own draft layer:
  #  61.3% acceptance, 1.61 tok/step, +43% over base (19.5 vs 13.6 tok/s).
  #  KV pool pinned to fp8 176,784 tokens (1.08× at 160K ctx).
  #  Architecture: HYV3ForCausalLM (natively registered).
  #  NOTE: Requires CUDA 13 vLLM build — docker.io/vllm/vllm-openai:hy3-arm64-cu130.
  - name: hy3-nvfp4
    model: hy3-nvfp4
    tier: system
    node_count: 2
    partition: edge-double
    max_model_len: 163840
    env_vars:
      VLLM_HOST_MODEL_PATH: "/home/mnagaso/umrs_models/hub/models--LibertAIDAI--Hy3-NVFP4/snapshots"
      VLLM_PATH_TO_HUGGINGFACE: "/home/mnagaso/umrs_models"
      VLLM_MODEL: "LibertAIDAI/Hy3-NVFP4"
      VLLM_TOKENIZER: "LibertAIDAI/Hy3-NVFP4"
      VLLM_GPU_MEM_UTIL: "0.85"
      VLLM_MAX_NUM_SEQS: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      # NVFP4 MoE on GB10: marlin is the ONLY backend that runs on sm_121.
      VLLM_MOE_BACKEND: "marlin"
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:hy3-arm64-cu130"
      # MTP spec decode from checkpoint's native draft layer (k=1).
      # Kept in its own var (not VLLM_EXTRA_ARGS) because the JSON contains a
      # comma, which sbatch --export would otherwise truncate.
      VLLM_SPECULATIVE_CONFIG: '{"method":"mtp","num_speculative_tokens":1}'
      VLLM_EXTRA_ARGS: >-
        --enforce-eager
        --kv-cache-dtype fp8
        --max-num-batched-tokens 8192
      # Cross-node TP2: each rank reads all 99 shards (~84.5 GB/rank).
      RCCS_SKIP_CDI: "1"

  # ── GLM-5.2 (2 nodes → spark-double) ─────────────────────────────────
  #  753B MoE (FP8 + NVFP4 2-bit experts).
