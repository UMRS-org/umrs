      # (only whitelisted vars reach MN containers) — do not re-add here.
      # Remaining suspect matching the documented GB10 fleet hazard (GLM-5.2
      # job 3056): cross-node TP2 cudagraph replay deadlock → EAGER below.
      VLLM_ENFORCE_EAGER: "1"
