# Pool roster: RCCS — canonical site recipe catalog (unified serving M6).
#
# Activation: loaded by umrs-server-rccs via UMRS_PROVISION_ROSTER (compose
# environment) and by convention as ${cluster_dir}/pool-${cluster}.yaml.
# This file is the ONLY curated recipe for this cluster today —
# previously-adjacent rosters (pool-rccs-3models/glm5/agents-a1) remain as
# unactivated references until explicitly moved here.
#
# Usage:
#   r4 endpoint up --model <name>           (recipe auto-resolved)
#   r4 pool up umrs/deploy/rccs/pool-rccs.yaml

pool: rccs
defaults:
  tier: system
  ttl_sec: 0
  timeout: 86400

endpoints:
  # Curated: Bonsai-8B-gb10 (control endpoint — preserved exactly)
  - name: bonsai
    model: Bonsai-8B-gb10
    max_model_len: 8192
    node_count: 1
    gpu_count: 1
    env_vars:
      # Co-located LiteLLM DB container (compose ll-postgres is a profile
      # opt-in; without this the stack wedges at create).
      RIVAULT_PROFILES: "harness vllm litellm-db"

  # Curated: Qwen AgentWorld 35B-A3B BF16 (HowToSpark GB10 recipe adapted
  # to RCCS under M6 — one node, one GB10, no tensor parallelism, BF16
  # pre-staged via `r4 model stage`).
  - name: qwen-agentworld-35b-a3b
    model: Qwen-AgentWorld-35B-A3B
    # No partition (2026-10-24, was ng-dgx-m0): the job takes the site
    # candidate list and UMRS submits it to the earliest-starting one.
    node_count: 1
    gpu_count: 1
    max_model_len: 262144
    env_vars:
      # Adopt the stable RCCS GB10 image lane proven by pool-rccs-3models
      # (Qwen3.6-35B-A3B-NVFP4): vllm-openai:latest (the cu130-nightly
      # variant dies on unified/MXFP4 attention — jobs 270324/270340).
      # MoE lane is checkpoint-dependent: marlin only suits NVFP4 quant
      # (rejected for unquantized MoE — job 270372). AgentWorld is BF16
      # (unquantized) and the valid unquantized lane on this arch is triton.
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:latest"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_EXTRA_ARGS: "--moe-backend=triton"
      VLLM_KV_CACHE_MEMORY_BYTES: "8589934592"
      VLLM_MAX_NUM_SEQS: "4"
      VLLM_MAX_NUM_BATCHED_TOKENS: "8192"
      VLLM_MAX_MODEL_LEN: "262144"
      VLLM_LANGUAGE_MODEL_ONLY: "1"
      # Co-located LiteLLM DB container (compose ll-postgres is a profile
      # opt-in; without this the stack wedges at create).
      RIVAULT_PROFILES: "harness vllm litellm-db"
      # REQUIRED for this checkpoint: the stock qwen3_5.py unconditionally
      # builds the 27-block vision tower but this release ships zero
      # visual.* weights (loading dies with 113 uninitialized params).
      # Guard must be active alongside VLLM_LANGUAGE_MODEL_ONLY=1.
      VLLM_PATCH_QWEN3_5: "1"
    patches:
      # Patched FROM docker.io/vllm/vllm-openai:latest (image-version bound:
      # the module layout differs across versions — the nightly-based patch
      # referenced vllm.model_executor.layers.mamba.gdn_linear_attn which does
      # not exist in `latest` and crashed registry inspection at engine init).
      - source: /lvs0/rccs-dmp/masaru.nagaso/umrs_models/patches/qwen3_5-latest.py
        target: /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/qwen3_5.py
        sha256: fc5037687dfa26088eec7ba0a5c5f1c614f4b0cac3e4f309e73effff8adb2fe8

  # Curated: Qwen3.8-27B NVFP4 (NVIDIA modelopt NVFP4-FP8 mixed, 21.9 GiB)
  # — vLLM recipe "dgx_spark_gb10" variant nvfp4_nvidia (recipes.vllm.ai,
  # models/Qwen/Qwen3.8-27B.yaml, 2026-09-14), adapted to RCCS: one GB10,
  # no TP. 0.70 x 121.6 GiB = 85 GiB sits under the ~97 GiB left after the
  # co-located services (the partition cap 0.78 is not reached).
  # Stage first: r4 model stage nvidia/Qwen3.8-27B-NVFP4 --name Qwen3.8-27B-NVFP4
  - name: qwen3.8-27b-nvfp4
    model: Qwen3.8-27B-NVFP4
    # ADR-106 D-1 role alias (2026-11-01): routing only, resolves to READY replicas.
    aliases: [svc-fast]
    # No partition (2026-10-24, was ng-dgx-m0): the job takes the site
    # candidate list and UMRS submits it to the earliest-starting one.
    node_count: 1
    gpu_count: 1
    max_model_len: 262144
    env_vars:
      # Recipe-pinned image (multi-arch; arm64 manifest present). The stock
      # release predates the gated-delta-net MTP fix the recipe relies on.
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:qwen38"
      VLLM_GPU_MEM_UTIL: "0.70"
      VLLM_MAX_MODEL_LEN: "262144"
      VLLM_MAX_NUM_SEQS: "8"
      VLLM_MAX_NUM_BATCHED_TOKENS: "8192"
      VLLM_TOOL_CALL_PARSER: "qwen3_xml"
      VLLM_REASONING_PARSER: "qwen3"
      # In-checkpoint MTP head; GB10 recipe depth 5 (needs the compose
      # VLLM_SPECULATIVE_CONFIG declaration — single-node dropped it before).
      VLLM_SPECULATIVE_CONFIG: '{"method":"mtp","num_speculative_tokens":5}'
      VLLM_EXTRA_ARGS: "--kv-cache-dtype fp8 --enable-chunked-prefill --async-scheduling --enable-prefix-caching --load-format fastsafetensors"
      # Co-located LiteLLM DB container (compose ll-postgres is a profile
      # opt-in; without this the stack wedges at create).
      RIVAULT_PROFILES: "harness vllm litellm-db"

  # Curated: Bespoke-Nimble-9B — Jev-style decision model (ADR-076). Qwen3.5-9B
  # + Bespoke LoRA (hub rev bd792f44, adapter sha256 29ef39b0…, Apache-2.0),
  # merged to BF16 before staging (scripts in docs/development/
  # decision-model-nimble-2026-10-01.md). It never generates text: R4 sends one
  # /v1/completions request per question with max_tokens=1 and
  # logprob_token_ids=[A..Z] (vLLM >= 0.26 exposes it on the OpenAI routes) and
  # softmaxes the candidate logprobs itself (r4.decisions).
  # Always-on: keep_alive hands the endpoint to a successor job before the
  # 24 h walltime (umrs.orchestrator.endpoint_relay); the successor starts
  # wherever the earliest start is, so it normally runs beside the old job
  # (no gap).
  - name: bespoke-nimble-9b
    model: Bespoke-Nimble-9B
    # ADR-106 D-1 role alias (2026-11-01): routing only, resolves to READY replicas.
    aliases: [svc-decision]
    # Candidates, ng-dgx-s first (8 standalone nodes; preferred on ties),
    # ng-dgx-m3 last (the step lane's partition).
    # 2026-10-24: one partition per job, the earliest sbatch --test-only
    # start, and the next one on a per-partition quota refusal — so the
    # relay successor no longer queues behind one busy partition (2026-10-08
    # it waited behind another user's job on m1-11, docs/development/
    # dgx-spark-fleet-plan-2026-10-08.md §1). Fallback venue: the bdrt
    # replica (deploy/bdrt/pool-bdrt-step.yaml).
    partition: ng-dgx-s,ng-dgx-m1,ng-dgx-m2,ng-dgx-m0,ng-dgx-m3
    node_count: 1
    gpu_count: 1
    max_model_len: 8192
    ttl_sec: 0
    # ADR-078: every authenticated caller may route to it, whatever their
    # project (the endpoint is owned + billed by project `default`).
    access: [system]
    keep_alive:
      project_id: default         # the rccs-cloud profile's project (X-Project-ID)
      user: mnagaso               # Slurm submitter under per_user_ssh delegation
      renew_before_sec: 7200      # ~45 min Lustre load + queue headroom
      handover_grace_sec: 300
    env_vars:
      # Pinned release: logprob_token_ids on /v1/completions needs >= v0.26
      # (vllm#43463); v0.30.0 has an arm64 manifest (same digest as `latest`
      # on 2026-10-01, the lane proven for Qwen3.5 on GB10).
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.30.0"
      # 9B BF16 ≈ 19 GiB + 8k-context state; 0.30 × 121.6 = 36 GiB.
      VLLM_GPU_MEM_UTIL: "0.30"
      VLLM_MAX_MODEL_LEN: "8192"
      VLLM_MAX_NUM_SEQS: "32"     # one sequence per question; 32 parallel
      # Text-only decision scoring; the merged checkpoint keeps the base's
      # visual.* weights, so the AgentWorld qwen3_5 patch is not needed.
      VLLM_LANGUAGE_MODEL_ONLY: "1"
      RIVAULT_PROFILES: "harness vllm litellm-db"

  # ══ ADR-106 service tier on rccs (maintainer 2026-11-01: "whole service
  # models will be run on rccs completely (using both ng-dgx-s and -m)") ══
  # Role aliases are routing only. None of these entries carries a
  # `service:` block yet: a converged block provisions on its own, and an
  # unstaged model would fail every relay cycle. The blocks are added after
  # staging (docs/development/service-model-fleet-plan-2026-11-01.md §10.3).
  # Model paths come from the model registry (`r4 model register`) except
  # for the TensorFold entry, whose prepared files are named below.

  # ── DeepSeek-V4-Flash → svc-chat (2 nodes, QSFP m pairs, vLLM TP=2) ──
  #  Maintainer, 2026-11-01: DeepSeek-V4.1-Flash-1017 (TensorFold) cannot run
  #  here. The engine refuses below 112 GiB free per node, and an idle,
  #  exclusive ng-dgx-m node has ~99-100 GiB (measured: 18.5 GB unreclaimable
  #  kernel slab, Lustre client; root-only). So rccs svc-chat is the previous
  #  release of the same family, DeepSeek-V4-Flash, on the vLLM recipe proven on
  #  bdrt (Spark Arena, 37.8 tok/s on 2x Spark). V4.1 serves bdrt.
  #  Fit under the rccs 0.78 cap: checkpoint 148.7 GiB / 2 = 74.4 GiB per rank,
  #  budget 0.78 x 119.7 = 93.4 GiB, so ~19 GiB per rank for MLA KV (fp8) +
  #  activations + MTP. Context and seqs start below the bdrt recipe's.
  #  Fabric: the QSFP link is enP2p1s0f1np1 (192.168.1.x/24) on m1 and m2
  #  (probed 2026-11-01); m3 stays the ADR-074 step lane.
  #  Weights: hf download deepseek-ai/DeepSeek-V4-Flash @60d8d707 into
  #  the model root below (local-dir layout).
  - name: deepseek-v4-flash
    model: DeepSeek-V4-Flash
    aliases: [svc-chat, deepseek-v4-flash]
    partition: ng-dgx-m0,ng-dgx-m2,ng-dgx-m1
    node_count: 2
    max_model_len: 131072
    access: [system]
    env_vars:
      VLLM_HOST_MODEL_PATH: "/lvs0/rccs-dmp/masaru.nagaso/umrs_models/DeepSeek-V4-Flash"
      VLLM_PATH_TO_HUGGINGFACE: "/lvs0/rccs-dmp/masaru.nagaso/umrs_models"
      VLLM_MAX_MODEL_LEN: "131072"
      VLLM_GPU_MEM_UTIL: "0.78"
      VLLM_TP: "2"
      VLLM_TENSOR_PARALLEL_SIZE: "2"
      NCCL_SOCKET_IFNAME: "enP2p1s0f1np1"
      # GB10 unified memory: Ray's monitor counts CPU+GPU and would SIGTERM the
      # worker during the 74 GiB/rank load (same as bdrt).
      RAY_memory_monitor_refresh_ms: "0"
      RIVAULT_MN_MEMORY_CAP: "96g"
      MAX_JOBS: "4"
      # Official image, CUDA 13.0.2 (matches the 580.x driver), DeepSeek-V4
      # stack native at this tag; never :latest.
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.26.0"
      VLLM_TOOL_CALL_PARSER: "deepseek_v4"
      VLLM_REASONING_PARSER: "deepseek_v4"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_SPECULATIVE_CONFIG: '{"method":"mtp","num_speculative_tokens":2}'
      VLLM_EXTRA_ARGS: >-
        --max-num-seqs 8
        --max-num-batched-tokens 6144
        --tokenizer-mode deepseek_v4
        --kv-cache-dtype fp8
        --enable-prefix-caching
        --max-cudagraph-capture-size 8
        --compilation-config {"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}
      RCCS_SKIP_CDI: "1"
      RIVAULT_PROFILES: "harness vllm litellm-db"

  # ── Qwen3.6-35B-A3B-NVFP4 → svc-vision (1 node) ──────────────────────
  #  Figures, plots, microscopy; multimodal KG anchors. 35B/3B MoE, Apache-2.0.
  - name: qwen3.6-35b-a3b-nvfp4
    model: Qwen3.6-35B-A3B-NVFP4
    aliases: [svc-vision]
    partition: ng-dgx-s,ng-dgx-m1
    node_count: 1
    gpu_count: 1
    max_model_len: 65536
    access: [system]
    env_vars:
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.30.0"
      VLLM_GPU_MEM_UTIL: "0.45"
      VLLM_MAX_MODEL_LEN: "65536"
      VLLM_MAX_NUM_SEQS: "8"
      VLLM_TOOL_CALL_PARSER: "qwen3_xml"
      VLLM_REASONING_PARSER: "qwen3"
      VLLM_EXTRA_ARGS: '--kv-cache-dtype fp8 --enable-prefix-caching --limit-mm-per-prompt {"image":8}'
      RIVAULT_PROFILES: "harness vllm litellm-db"

  # ── Qwen3-Embedding-0.6B → svc-embed (1 node) ────────────────────────
  #  New ADR-083 embedding space; the e5-base-v2 space stays default until
  #  its backfill and the P1 retrieval set (plan §6.7, M-6). Verify the
  #  pooling flags on first launch (vLLM v0.30 spelling).
  - name: qwen3-embedding-0.6b
    model: Qwen3-Embedding-0.6B
    aliases: [svc-embed]
    partition: ng-dgx-s,ng-dgx-m1
    node_count: 1
    gpu_count: 1
    max_model_len: 32768
    access: [system]
    env_vars:
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.30.0"
      VLLM_GPU_MEM_UTIL: "0.10"
      VLLM_MAX_MODEL_LEN: "32768"
      VLLM_EXTRA_ARGS: "--runner pooling --convert embed"
      RIVAULT_PROFILES: "harness vllm litellm-db"

  # ── Qwen3-Reranker-0.6B → svc-rerank (1 node) ────────────────────────
  #  Served as a sequence classifier (the model card's vLLM recipe).
  #  Verify on first launch.
  - name: qwen3-reranker-0.6b
    model: Qwen3-Reranker-0.6B
    aliases: [svc-rerank]
    partition: ng-dgx-s,ng-dgx-m1
    node_count: 1
    gpu_count: 1
    max_model_len: 32768
    access: [system]
    env_vars:
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.30.0"
      VLLM_GPU_MEM_UTIL: "0.10"
      VLLM_MAX_MODEL_LEN: "32768"
      VLLM_EXTRA_ARGS: '--runner pooling --hf-overrides {"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      RIVAULT_PROFILES: "harness vllm litellm-db"

  # ── PaddleOCR-VL-1.6 → svc-ocr (1 node) ──────────────────────────────
  #  0.9B page-level VLM (Apache-2.0); KNOWLEDGE_OCR_* points at svc-ocr.
  #  Japanese pages are evaluated before it becomes the ingest default.
  - name: paddleocr-vl-1.6
    model: PaddleOCR-VL-1.6
    aliases: [svc-ocr]
    partition: ng-dgx-s,ng-dgx-m1
    node_count: 1
    gpu_count: 1
    max_model_len: 16384
    access: [system]
    env_vars:
      VLLM_DOCKER_IMAGE: "docker.io/vllm/vllm-openai:v0.30.0"
      VLLM_GPU_MEM_UTIL: "0.12"
      VLLM_MAX_MODEL_LEN: "16384"
      VLLM_TRUST_REMOTE_CODE: "1"
      VLLM_EXTRA_ARGS: "--max-num-batched-tokens 16384"
      RIVAULT_PROFILES: "harness vllm litellm-db"
