# Pool roster: RCCS Cloud — GLM-5.2 UD-IQ1_S — SINGLE endpoint (validation)
#
# Isolated single-endpoint roster derived from pool-rccs-3models.yaml, containing
# ONLY the 2-node glm-5.2-iq1s endpoint on ng-dgx-m3. Used to validate the
# multi-node Ray/vLLM pipeline-parallel stack (fix13 worker retry + NVML gate,
# userns/caps parity) without also launching the ng-dgx-m0 endpoints (those
# nodes run the live pool).
#
# IQ1_S merged GGUF is 202 GB (~188 GiB). Split across 2 GB10 nodes (PP=2) that
# is ~94 GiB/node of weights. GB10 uses UNIFIED memory (128 GB shared CPU+GPU),
# so GPU allocations count against the same pool as host RAM. The serve-model
# script shrinks the multi-node containers' /dev/shm to 4g (the Ray object store
# is unused in the PP path) which frees ~12 GiB of the pool, and raises Ray's
# OOM-monitor threshold to 0.97. With that headroom, util 0.80 (97.3 GiB desired)
# holds the ~94 GiB weights + ~3 GiB KV while keeping total node usage ~91%,
# safely below the OOM threshold.
#
# max_model_len: GLM-5.2 is a DeepSeek-V2-style MLA model (model_type
# deepseek_v2, kv_lora_rank 512, qk_rope_head_dim 64, 79 layers), so the KV
# cache is only (512+64)*2 = 1152 bytes/token/layer — ~44.5 KiB/token/node across
# 79 layers split over PP=2. The ~3 GiB KV headroom (util 0.80 budget minus the
# ~94 GiB weights) holds ~70k tokens, so 32768 fits comfortably. Push higher only
# after a successful run reports the actual "GPU KV cache size: N tokens" line.
#
# Usage: r4 pool up umrs/deploy/rccs/pool-rccs-glm5-iq1s-only.yaml

pool: rccs-glm5-iq1s-only
defaults:
  tier: user
  ttl_sec: 0              # never expires
  timeout: 86400

endpoints:
  - name: glm-5.2-iq1s
    model: glm-5.2-iq1s
    tier: user
    node_count: 2
    partition: ng-dgx-m3
    max_model_len: 32768
    env_vars:
      VLLM_PATH_TO_HUGGINGFACE: "/lvs0/rccs-dmp/masaru.nagaso/umrs_models"
      # vLLM GGUF layout: directory with config.json + model.gguf symlink + tokenizer files
      VLLM_MODEL: "glm-5.2-iq1s-vllm"
      VLLM_GPU_MEM_UTIL: "0.80"
      VLLM_MAX_NUM_SEQS: "4"
      VLLM_ENFORCE_EAGER: "1"        # GLM-5.2 requires eager mode
      RCCS_SKIP_CDI: "1"
