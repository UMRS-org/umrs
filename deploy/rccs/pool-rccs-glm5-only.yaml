# Pool roster: RCCS Cloud — GLM-5.2 UD-IQ2_M — SINGLE endpoint (validation)
#
# Isolated single-endpoint roster derived from pool-rccs-glm5.yaml, containing
# ONLY the 2-node glm-5.2-iq2m endpoint on ng-dgx-m3. Used to validate the
# multi-node Ray/vLLM pipeline-parallel stack (fix13 worker retry + NVML gate,
# userns/caps parity) without also launching the ng-dgx-m0 endpoints from the
# full roster (those nodes are in use).
#
# max_model_len is deliberately conservative (4096) for this validation: after
# ~223 GB of weights across 2 x 128 GB GB10 nodes there is only a few GB/node
# left for KV cache, so the model's native 1M context cannot fit. Raise once
# the stack is proven healthy and KV fit is measured.
#
# Usage: r4 pool up umrs/deploy/rccs/pool-rccs-glm5-only.yaml

pool: rccs-glm5-iq2m-only
defaults:
  tier: user
  ttl_sec: 0              # never expires
  timeout: 86400

endpoints:
  - name: glm-5.2-iq2m
    model: glm-5.2-iq2m
    tier: user
    node_count: 2
    partition: ng-dgx-m3
    max_model_len: 4096
    env_vars:
      VLLM_PATH_TO_HUGGINGFACE: "/lvs0/rccs-dmp/masaru.nagaso/umrs_models"
      VLLM_MODEL: "glm-5.2-iq2m-vllm"
      VLLM_GPU_MEM_UTIL: "0.90"
      VLLM_MAX_NUM_SEQS: "4"
      RCCS_SKIP_CDI: "1"
