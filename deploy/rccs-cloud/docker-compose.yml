# UMRS deployment for rccs-cloud login node.
#
# Services: postgres (pgvector), minio (S3), umrs-server.
# Embedding computation runs via mini-rivault (vLLM + LiteLLM) on Slurm compute nodes.
#
# Usage:
#   cd deploy/rccs-cloud
#   podman compose up -d
#
# Prerequisites:
#   - Set environment variables in .env or export before running
#   - Lustre path /lvs0/rccs-dmp/ accessible

services:
  postgres:
    image: docker.io/ankane/pgvector:latest
    container_name: umrs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umrs_rccs}
      POSTGRES_DB: ${POSTGRES_DB:-umrs_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../docker/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:latest
    container_name: umrs-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_BIND:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  umrs-server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: umrs-server
    depends_on:
      - postgres
      - minio
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
      # Database — accessible via localhost since postgres publishes 5432
      DB_HOST: "127.0.0.1"
      DB_SUPERUSER: ${POSTGRES_USER:-umrs}
      DB_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-umrs_rccs}
      # Do NOT set UMRS_SERVER_HOST — default 127.0.0.1 is correct for
      # SSH-tunneled clients (advertised data-queue URLs must use localhost).
      #
      # S3 presigned URL endpoint: compute nodes access MinIO via an SSH
      # tunnel (localhost:9000 on compute → login node MinIO).
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      # Model cache on Lustre (shared with compute nodes)
      SENTENCE_TRANSFORMERS_HOME: ${MODEL_DIR:-/lvs0/rccs-dmp/mnagaso/umrs_models}/sentence_transformers
      HF_HOME: ${MODEL_DIR:-/lvs0/rccs-dmp/mnagaso/umrs_models}/hf
      UMRS_MODEL_STAGING_ROOT: ${MODEL_DIR:-/lvs0/rccs-dmp/mnagaso/umrs_models}
    volumes:
      - ./conf_umrs.json:/root/conf_umrs.json:ro
      - ./s3cfg:/root/.s3cfg:ro
      - ./user_files:/root/user_files:ro
      # Lustre — shared model cache visible from compute nodes
      - ${MODEL_DIR:-/lvs0/rccs-dmp/mnagaso/umrs_models}:/shared/models
    restart: unless-stopped
    # Remove baked-in user s3cfg files so the server regenerates them
    # with the correct host (127.0.0.1 from admin .s3cfg) instead of
    # the Docker-DNS default (minio:9000) that doesn't work with network_mode:host.
    command: ["sh", "-c", "rm -f /root/.s3cfg_user* && python src/server_umrs.py -c /root/conf_umrs.json"]

volumes:
  pg_data:
  minio_data:
