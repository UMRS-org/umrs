# Pool roster: RCCS Cloud — Qwen3.6-35B-A3B-NVFP4 · DeepSeek-V4-Flash · GLM-5.2 IQ1_S
# Usage: R4_GATEWAY_URL=https://data0.ai.r-ccs.riken.jp/rccs r4 pool up pool-rccs-3models.yaml
#
# Target: rccs-front → SSH → rccs-cloud (DGX Spark / GB10 Blackwell, 128 GiB unified).
#
# STATUS (2026-07-08):
#   - Qwen3.6-35B-A3B-NVFP4 : weights staged; endpoint previously provisioned (Slurm 197795).
#   - DeepSeek-V4-Flash     : weights downloaded; needs 3-gate registration + chat-template fix.
#   - GLM-5.2 IQ1_S (GGUF)  : STILL DOWNLOADING — do not `pool up` this entry until staged.
#
# Each model must be registered in the rccs catalog before `pool up`:
#   umrs-client --profile rccs-cloud model register <name> <path> --type llm --scope user
# The `model:` field below must match the registered catalog name.

pool: rccs-3models
defaults:
  tier: user
  ttl_sec: 0              # never expires
  timeout: 86400

endpoints:
  # ── Qwen3.6-35B-A3B-NVFP4 ────────────────────────────────────────────
  #  35B MoE (3B active), NVFP4 (Blackwell-native 4-bit float) quantization.
  #  Fits comfortably on 1× GB10 (128 GiB unified). qwen3_moe architecture,
  #  tool calling + reasoning.
  - name: qwen3.6-35b-a3b-nvfp4
    model: Qwen3.6-35B-A3B-NVFP4
    tier: user
    node_count: 1
    partition: ng-dgx-m0
    max_model_len: 262144
    env_vars:
      VLLM_PATH_TO_HUGGINGFACE: "/lvs0/rccs-dmp/masaru.nagaso/umrs_models"
      VLLM_MODEL: "Qwen3.6-35B-A3B-NVFP4"
      VLLM_TOKENIZER: "Qwen3.6-35B-A3B-NVFP4"
      VLLM_GPU_MEM_UTIL: "0.90"
      VLLM_MAX_NUM_SEQS: "4"
      VLLM_TOOL_CALL_PARSER: "qwen3_xml"
      VLLM_REASONING_PARSER: "qwen3"
      VLLM_TRUST_REMOTE_CODE: "1"
      RCCS_SKIP_CDI: "1"

  # ── DeepSeek-V4-Flash ────────────────────────────────────────────────
  #  DeepSeek-V4 family MoE (lightweight "Flash" variant).
  #  NOTE: DeepSeek-V4 produces NaN/garbage logits under CUDA-graph capture —
  #    enforce-eager is REQUIRED regardless of context length (model property,
  #    see deepseek-v4-eager-graphs-garbage note).
  #  TODO(chat-template): this checkpoint ships NO Jinja chat template. Provide
  #    one via VLLM_CHAT_TEMPLATE=<path-to-template.jinja> (uncomment below and
  #    point to the staged template) before the endpoint will serve /chat.
  #  TODO(sizing): confirm node_count/quant. If the checkpoint does not fit a
  #    single 128 GiB GB10, switch to node_count: 2 / partition: ng-dgx-m3 (PP=2).
  - name: deepseek-v4-flash
    model: DeepSeek-V4-Flash
    tier: user
    node_count: 1
    partition: ng-dgx-m0
    max_model_len: 262144
    env_vars:
      VLLM_PATH_TO_HUGGINGFACE: "/lvs0/rccs-dmp/masaru.nagaso/umrs_models"
      VLLM_MODEL: "DeepSeek-V4-Flash"
      VLLM_TOKENIZER: "DeepSeek-V4-Flash"
      VLLM_GPU_MEM_UTIL: "0.90"
      VLLM_MAX_NUM_SEQS: "4"
      VLLM_ENFORCE_EAGER: "1"        # DeepSeek-V4 NaN guard (cudagraph capture unsafe)
      VLLM_REASONING_PARSER: "deepseek_r1"
      VLLM_TRUST_REMOTE_CODE: "1"
      # VLLM_CHAT_TEMPLATE: "/lvs0/rccs-dmp/masaru.nagaso/umrs_models/DeepSeek-V4-Flash/chat_template.jinja"
      RCCS_SKIP_CDI: "1"

  # ── GLM-5.2 IQ1_S (1-bit GGUF) — STILL DOWNLOADING ───────────────────
  #  GLM-5.2 744B MoE, 1-bit GGUF (IQ1_S). Single merged .gguf served by vLLM
  #  with tokenizer loaded separately. Mirrors the proven glm-5.2-iq2m entry
  #  (2× ng-dgx-m3, PP=2). GLM requires enforce-eager.
  #  DO NOT `pool up` until the weights finish downloading and the model is
  #  registered as `glm-5.2-iq1s` in the catalog.
  - name: glm-5.2-iq1s
    model: glm-5.2-iq1s
    tier: user
    node_count: 2
    partition: ng-dgx-m3
    max_model_len: 1048576
    env_vars:
      VLLM_PATH_TO_HUGGINGFACE: "/lvs0/rccs-dmp/masaru.nagaso/umrs_models"
      # vLLM GGUF layout: directory with config.json + model.gguf symlink + tokenizer files
      VLLM_MODEL: "glm-5.2-iq1s-vllm"
      VLLM_GPU_MEM_UTIL: "0.90"
      VLLM_MAX_NUM_SEQS: "4"
      VLLM_ENFORCE_EAGER: "1"        # GLM-5.2 requires eager mode
      RCCS_SKIP_CDI: "1"
