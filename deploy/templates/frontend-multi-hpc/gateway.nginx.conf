# =============================================================================
# gateway.nginx.conf — path routing to per-cluster UMRS servers (TEMPLATE)
# =============================================================================
# One frontend, many clusters. The gateway routes:
#   /cluster-a/...  → UMRS server for cluster A (HTTP port 8000)
#   /cluster-b/...  → UMRS server for cluster B (HTTP port 8002)
#
# In production this NGINX runs with an auth sidecar (auth_request). This
# template shows only the path-routing shape; add TLS + auth_request for real
# deployments (see the production gateway config for the full set of directives).
# =============================================================================

upstream umrs_cluster_a {
    server 127.0.0.1:8000;   # matches UMRS_A_PORT
}

upstream umrs_cluster_b {
    server 127.0.0.1:8002;   # matches UMRS_B_PORT
}

server {
    listen 8080;
    server_name <frontend-host>;   # e.g. frontend.example.org

    client_max_body_size 10g;      # large uploads (models/datasets) via gateway
    proxy_read_timeout 600s;

    # ─── cluster A ───
    location /cluster-a/ {
        # auth_request /_auth;     # enable with the auth sidecar in production
        proxy_pass http://umrs_cluster_a/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # UMRS reads the caller identity from X-User-ID (forwarded by the sidecar).
        proxy_set_header X-User-ID $http_x_user_id;
    }

    # ─── cluster B ───
    location /cluster-b/ {
        # auth_request /_auth;
        proxy_pass http://umrs_cluster_b/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-ID $http_x_user_id;
    }

    # Add a location + upstream per additional cluster.
}
