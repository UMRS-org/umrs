# =============================================================================
# docker-compose.yaml — login-node infra (Postgres + MinIO)
# =============================================================================
# The UMRS server itself runs NATIVELY on the login node (see start.sh) so it
# can call the Slurm CLI and open SSH tunnels to compute nodes. Only the
# stateful infra runs in containers.
#
#   podman compose up -d      # infra only
#   ./start.sh                # infra + native UMRS server (preferred)
# =============================================================================

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg15
    container_name: umrs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-umrs_db}
    # Rootless Podman cannot chmod the Unix socket → TCP only.
    command: ["postgres", "-c", "unix_socket_directories="]
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # SeaweedFS object store (ADR-055; MinIO support stays via S3_BACKEND=minio
  # adapter only — no profile deploys it anymore).
  seaweedfs:
    image: ${S3_IMAGE:-docker.io/chrislusf/seaweedfs:4.47}
    container_name: umrs-seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_USER:-${MINIO_ROOT_USER:?Set S3_ROOT_USER in .env}}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:-${MINIO_ROOT_PASSWORD:?Set S3_ROOT_PASSWORD in .env}}
    command: >
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
      -volume.max=0 -volume.index=leveldb
      -s3 -s3.port=9000 -s3.iam -s3.iam.config=/etc/seaweedfs/iam.json
      -iam -iam.port=8111
      -metricsPort=9327
    # Bind to loopback by default; compute nodes reach the store via SSH tunnel.
    ports:
      - "${S3_BIND:-127.0.0.1}:9000:9000"
      - "127.0.0.1:8111:8111"
      - "127.0.0.1:9327:9327"
    volumes:
      - s3_data:/data:z
      - ./seaweedfs/iam.json:/etc/seaweedfs/iam.json:ro,z
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/status"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # NOTE: the umrs-server runs NATIVELY on the login node, launched by
  # ./start.sh — it is intentionally NOT a service here.

volumes:
  pg_data:
  s3_data:
