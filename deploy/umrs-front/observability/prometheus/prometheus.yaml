# Ansible managed
# Prometheus scrape config for the umrs-front observability stack.
#
# Targets that bind on the data0 host (UMRS HTTP servers, MinIO) are reached
# through host.containers.internal (see extra_hosts in the compose template).
# Bridge-network services are reached by their compose service name.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'umrs-front'
    env: 'production'

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # MinIO exposes cluster metrics without auth (MINIO_PROMETHEUS_AUTH_TYPE=public).
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ['host.containers.internal:9000']

  - job_name: 'loki'
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'jaeger'
    metrics_path: /metrics
    static_configs:
      - targets: ['jaeger:14269']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # UMRS HTTP servers (host-networked).  Each server exposes a /metrics
  # endpoint (see umrs/src/umrs/server/http_sidecar.py) that serves the
  # umrs.metrics.METRICS registry — job lifecycle, transport health,
  # reconciler, and per-LLM-request token counters.
  - job_name: 'umrs-bdrt'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.containers.internal:8004']
        labels:
          umrs_cluster: 'bdrt'

  # vLLM endpoint metrics (auto-discovered via UMRS).
  # The observability sidecar writes /etc/prometheus/targets/vllm-targets.json
  # from UMRS's ready endpoint list.  Each target uses the UMRS proxy route
  # /umrs/endpoints/{job_id}/metrics because endpoint ports are bound to
  # loopback and are not directly reachable from the Prometheus container.
  - job_name: 'vllm'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vllm-targets.json
        refresh_interval: 15s
    scrape_interval: 10s
    scrape_timeout: 9s

  # vLLM KV Cache & token throughput (same targets, higher scrape frequency).
  - job_name: 'vllm_kv_cache'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vllm-targets.json
        refresh_interval: 15s
    scrape_interval: 5s
    scrape_timeout: 4s
