      UMRS_STEP_IMAGE: ${UMRS_OCTOPUS_STEP_IMAGE:-}
      UMRS_STEP_IMAGE_ARCHIVE_DIR: ${UMRS_OCTOPUS_STEP_IMAGE_ARCHIVE_DIR:-}
