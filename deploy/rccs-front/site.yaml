# yaml-language-server: $schema=../../src/umrs/orchestrator/site-config.schema.json
# ─────────────────────────────────────────────────────────────
# UMRS Site Configuration — RCCS Front-End Server
# ─────────────────────────────────────────────────────────────
# Front-end server deployment: persistent services (UMRS, Gateway,
# Postgres, MinIO) run here. Slurm jobs are submitted remotely via
# SSH to the rccs-cloud login node.
#
# Topology (no-tunnel production):
#   client --HTTP--> umrs-front (direct) --SSH--> rccs-cloud (login) --sbatch--> compute
#
# Topology (tunnel mode):
#   client --SSH--> umrs-front --SSH--> rccs-cloud (login) --sbatch--> compute
#
# Key differences from rccs-cloud:
#   - scheduler.kind = slurm-remote (SSH-based Slurm access)
#   - No Lustre filesystem access (models only on login+compute)
#   - Reverse tunnel for MinIO: compute→login:9000→front-end:9000
#   - Forward tunnels per endpoint for LLM proxy traffic
# ─────────────────────────────────────────────────────────────

name: rccs-front
description: >-
  RIKEN RCCS front-end server — Linux VM with Podman running persistent
  services. Slurm commands routed via SSH to rccs-cloud login node.
  No Lustre access. Clients connect via VPN (direct HTTP).

scheduler:
  kind: slurm-remote
  # Candidates, not a Slurm list (2026-10-24): RCCS rejects --partition=a,b
  # ("Multiple partitions are not allowed") and caps each user per partition
  # (2 x 72 node-hours). UMRS submits each job to ONE of them, the earliest
  # `sbatch --test-only` start, and moves to the next on a quota refusal
  # (orchestrator/partition_choice.py). Ties (starts within 60 s) go to the
  # partition this server picked least in the last 2 min, then to this
  # order: ng-dgx-s first (8 standalone nodes; singletons there, pairs kept
  # for pair work, dgx-spark-fleet-plan-2026-10-08 §3/R8), ng-dgx-m3 last
  # (the step lane's only partition, step_executor.partition below).
  partition: ng-dgx-s,ng-dgx-m0,ng-dgx-m1,ng-dgx-m2,ng-dgx-m3
  partition_choice: earliest_start
  account: cloud-users
  qos: ""
  time_limit: "23:00:00"  # ng-dgx-m* max is 1-00:00:00; 23h gives clean RIVAULT_JOB_TIMEOUT exit headroom
  # --time-min (2026-10-08): Slurm may start a job with a limit cut down to
  # fit before a maintenance reservation (nakao-1009 holds every GB10 node
  # 10-09 13:00 → 10-16) instead of leaving it pending; the walltime relay
  # reads the granted end (squeue %L). 03:00:00 > the 2 h renew window.
  time_min: "03:00:00"
  gpus: 0
  cpus: 8
  memory: ""
  slurm_delegation: per_user_ssh
  service_pubkey_path: /lvs0/rccs-dmp/masaru.nagaso/ai4s-platform/keys/umrs-service.pub
  slurm_proxy_path: /lvs0/rccs-dmp/masaru.nagaso/ai4s-platform/bin/umrs-slurm-proxy
  require_user_slurm_account: false

runtime:
  kind: podman-compose
  rivault_dir: ""  # Not applicable — mini-rivault runs on compute nodes
  repo_dir: ""
  vision_image: ""
  compose_file: docker-compose.yml  # Local services only (Gateway, UMRS, Postgres, MinIO)
  profiles:
    - services
    # Append the co-located LiteLLM DB container to harness provisions
    # (_with_site_support_profiles): required for LITELLM_DATABASE_URL-backed
    # model inventory/routing bookkeeping. Matches bdrt/site.yaml.
    - litellm-db
  gpu_passthrough: auto
  cdi_spec: ""
  cgroup_manager: cgroupfs
  storage_root: ""
  # Compute-side venue knobs (ADR-045: runtime.image_archive_dir,
  # network.private_subnet_pool) live in ../rccs/site.yaml — the file the
  # compute shim hands to the wrapper. This overlay could `extends:` that file
  # once the umrs-front compose mounts it alongside (follow-up in ADR-045).

storage:
  # Durable model_download staging root on the shared Lustre (login+compute
  # view; /etc/umrs/models fallback is not a valid stage target — the
  # registry path validator rejects it, so 'r4 model stage' returns 500).
  # Keep within allowed_patterns entry 1: /lvs0/rccs-dmp/masaru.nagaso/umrs_models/*
  model_cache_dir: ""  # No server-side model cache on the front executor — cluster-side staging is the sanctioned flow (umrs-front compose comment; the earlier #120 value ghost-wrote 99 GiB into the container overlay)
  sam3_model_path: /lvs0/dne1/rccs-dmp/masaru.nagaso/umrs_models/sam3.1
  hmae_model_path: /lvs0/dne1/rccs-dmp/masaru.nagaso/umrs_models/hmae
  hmae_config_path: ""
  hmae_checkpoint: ""
  vision_tarball: ""
  user_model_path: ""
  s3_tunnel_host: ""
  s3_tunnel_port: 9000

network:
  litellm_port: 8001
  litellm_master_key: ""  # Set LITELLM_MASTER_KEY in .env
  port_range_min: 12000   # Local tunnel port range (forward tunnels to compute)
  port_range_max: 12999
  port_strategy: static_range
  # ADR-040 D4 / WP-01 round 3 (2026-09-07): the site's egress proxy image.
  # This is the file the umrs-front rccs server container binds as
  # /etc/umrs/site.yaml (compose volume ../rccs-front/site.yaml). Running
  # inside the existing r4-mcp image (python -m r4_mcp.egress_guard) on
  # podman-compute Slurm nodes; presence/pullability of THIS string is the
  # declared precondition for any egress_domains endpoint (else: refuse 400).
  egress_proxy_image: localhost/r4-mcp:latest

vllm:
  model: intfloat/e5-base-v2
  docker_tag: cu130-nightly-aarch64
  gpu_mem_util: 0.78
  max_model_len: 512
  max_num_seqs: 4
  tensor_parallel_size: 1

# Workflow step execution (production enablement 2026-09-25; step lane
# 2026-09-26, ADR-074 + docs/development/rccs-step-lane-spec-2026-09-26.md).
# Platform-template steps stay in-process. Uploaded step code never runs in
# the server: it goes to this site's HPC lane (RemoteSlurmStepExecutor over
# extra.ssh_target) when the lane is available, else uploaded_code decides
# (refuse = refused by name). The lane is available only with remote_enabled,
# workdir_root, helper_path and a platform image; the umrs-front converge
# sets that image (UMRS_STEP_IMAGE, plus the archive dir, helper and venue
# paths) only after it staged and verified the step image archive on the
# cluster, so image stays "" here.
# - remote_enabled: true since 2026-10-02 — maintainer-approved flip after the
#   R2 receipt passed (converge 36844513817: plain podman + runc, GPU via
#   gpu_form nvidia-devices, kill check). Still needs the verified image the
#   converge composes; uploaded_code: refuse stays the fallback.
# - gpu: true — the site gate only: on the remote lane a step gets the
#   nvidia-devices form ONLY when it also asks with routing_hints.gpu (both
#   are required, remote_slurm_step_executor._needs_gpu). With gpu: false the
#   hint is ignored — R3 2026-10-02 showed a hinted step with no devices.
# - workdir_root: on Lustre (the compute node sees it), outside the git
#   checkout (read-only by rule).
# - helper_path / venue_script: the pinned cluster checkout hpc-code-sync
#   keeps (umrs_front_rccs_hpc_repo_dir).
step_executor:
  kind: inproc
  # One partition: the rccs job_submit policy refuses a comma list ("Multiple
  # partitions are not allowed", R3 2026-10-02). m3 = two GB10 nodes, R2-proven.
  partition: ng-dgx-m3
  gpus: 0              # ng-dgx-m* reject --gres
  cpus: 8
  memory: ""           # ng-dgx-m* reject --mem
  # 2026-10-02/03: partition ng-dgx-m3 MaxTime is 24 h (owner-confirmed
  # 2026-10-03; the endpoint pool's 23 h note above ran against the same
  # ceiling). Spelled as HH:MM:SS to match the partition's actual wording;
  # a full camera-day full_scan cnn job fits in one step job.
  time_limit: "24:00:00"
  account: cloud-users
  image: ""            # composed by the converge after the archive verifies (see above)
  gpu: true            # site gate; a step still needs routing_hints.gpu (see above)
  workdir_root: /lvs0/rccs-dmp/masaru.nagaso/umrs_steps
  remote_enabled: true
  uploaded_code: refuse
  image_archive_dir: /lvs0/rccs-dmp/masaru.nagaso/umrs_models/images
  # D-7 allow-list (admin-curated, 2026-10-02): images a step may name in
  # routing_hints.image besides the platform image. Each must sit in
  # image_archive_dir as <name>-<tag>-aarch64.tar + .id (nodes never pull).
  # opossum CNN (MDv5a + torch 2.14.1+cu130), built by the project's
  # tools/stage_cnn_image.sh on the platform image 7afb44c12c0e; tag =
  # <base sha12>-<lock sha8>, never :latest.
  allowed_images:
    - localhost/umrs-step-opossum-cnn:7afb44c12c0e-a51b1fa4
  helper_path: /lvs0/rccs-dmp/masaru.nagaso/ai4s-platform/umrs/deploy/_common/umrs_step_helper.py
  venue_script: /lvs0/rccs-dmp/masaru.nagaso/ai4s-platform/umrs/src/umrs/mini-rivault-llm/venue.sh
  # 2026-10-01: back to plain podman on the nodes' stock runtime — the
  # no-cgroup posture of 2026-09-26 needs crun (runc refuses NoCgroups) and
  # RCCS cannot install crun (STATE TODO-20260926-CRUN). With cgroups
  # enabled and no limits requested, rootless runc creates no container
  # cgroup here ("rootless needs no limits + no cgrouppath", R2 2026-09-26),
  # so the step still runs inside the job's Slurm cgroup — scancel and the
  # job's limits hold (the node is exclusive). pids_limit stays 0: rootless
  # runc in this venue cannot hold a pids cgroup either (the posture probe
  # would fail every step by name); RLIMIT_NPROC bounds its processes instead.
  cgroups: enabled
  pids_limit: 0
  nproc_limit: 4096
  # R2 2026-10-01: the GPU run failed "setting up CDI devices: unresolvable
  # CDI devices nvidia.com/gpu=all" — podman 4.9.3 on the GB10 nodes has no
  # usable CDI spec (the serving path maps devices directly for the same
  # reason, x_nvidia-override.yaml). Steps that need a GPU get the node's
  # /dev/nvidia* nodes and the host driver libraries instead.
  gpu_form: nvidia-devices

database:
  host: localhost
  port: 5432
  superuser: umrs
  superuser_password: ""  # Set POSTGRES_PASSWORD in .env
  user_password: ""
  registry_dsn: ""

# ─────────────────────────────────────────────────────────────
# SSH Remote Slurm Configuration
# ─────────────────────────────────────────────────────────────
# These values are read by SSHControlConfig.from_site_config()
# when scheduler.kind = slurm-remote.
extra:
  ssh_target: rccs-cloud
  ssh_user: "masaru.nagaso"
  ssh_port: 22
  ssh_connect_timeout: 15
  ssh_command_timeout: 30
  ssh_server_alive_interval: 30
  ssh_server_alive_count_max: 3
  ssh_control_path: "/run/umrs-ssh/rccs-cloud-%p"  # tmpfs inside container
  # Reverse tunnel: expose front-end MinIO (9000) on login node so
  # compute nodes' existing tunnel to login:9000 reaches front-end's MinIO.
  ssh_reverse_tunnels:
    - "127.0.0.1:9000:127.0.0.1:9000"
  # Remote path for job info files (on Lustre, accessed via SSH cat)
  slurm_job_info_dir: /lvs0/rccs-dmp/masaru.nagaso/ai4s-platform/umrs/deploy/rccs/jobs
  # Wrapper script for Podman-based serve on compute nodes
  slurm_wrapper_script: /lvs0/rccs-dmp/masaru.nagaso/ai4s-platform/umrs/deploy/rccs/serve-model.slurm
  knowledge_ingest:
    # Web sites UMRS may fetch for knowledge ingest (r4 knowledge ingest of a URL or git repo).
    # "*" = every public web site (maintainer decision 2026-10-25): an agent can already fetch any
    # public page and save it, so the guards that matter are the address checks below, the
    # 80/443-only ports, the per-hop redirect checks and the size/time caps, which all stay.
    # Stricter site: replace "*" with "@recommended" (umrs/src/umrs/knowledge/ingest_domains_recommended.yaml)
    # and/or explicit entries such as "example.org", "*.example.org" or "host:8443".
    # Quote every entry: an unquoted *.example.org or * is YAML alias syntax and breaks this file.
    # A change takes effect at the next converge deploy. Docs: docs/user-manual/27-knowledge-management.md
    allowed_domains: ["*"]
    # Never fetched, whatever the list says: this front sits inside RIKEN's network, which is
    # public (global unicast) address space, so the global-address check alone would admit the intranet.
    denied_networks: ["134.160.0.0/16"]

# Partition profiles are identical to rccs-cloud — same compute hardware
partition_profiles:
  # ng-dgx-s-[00-07] (8 GB10 nodes, 1-00:00:00 max; partition listing
  # 2026-10-01). First user: the Bespoke-Nimble-9B decision endpoint
  # (pool-rccs.yaml, ADR-076). 2026-10-24: now also in scheduler.partition
  # (first, so ties go to the standalone nodes): generic provisions spread
  # over every GB10 partition instead of queueing on ng-dgx-m0 while the
  # others idle. gpus: 0
  # mirrors m* — relax to 1 only after a job proves the partition accepts --gres.
  ng-dgx-s:
    arch: aarch64
    gpu_vendor: nvidia
    gpu_memory_gb: 128
    oci_runtime: runc
    userns_mode: host
    network_backend: netavark
    vllm_docker_tag: cu130-nightly-aarch64
    gpus: 0
    gpu_mem_util_max: 0.78     # GB10 shared with harness + vision sidecar (~97 GiB free of 121.6)
    needs_netavark_switch: false
  ng-dgx-m0:
    arch: aarch64
    gpu_vendor: nvidia
    gpu_memory_gb: 128
    oci_runtime: runc
    userns_mode: host
    network_backend: netavark
    vllm_docker_tag: cu130-nightly-aarch64
    gpus: 0
    gpu_mem_util_max: 0.78     # GB10 shared with harness + vision sidecar (~97 GiB free of 121.6)
    needs_netavark_switch: false
  ng-dgx-m1:
    arch: aarch64
    gpu_vendor: nvidia
    gpu_memory_gb: 128
    oci_runtime: runc
    userns_mode: host
    network_backend: netavark
    vllm_docker_tag: cu130-nightly-aarch64
    gpus: 0
    gpu_mem_util_max: 0.78     # GB10 shared with harness + vision sidecar (~97 GiB free of 121.6)
    needs_netavark_switch: false
  ng-dgx-m2:
    arch: aarch64
    gpu_vendor: nvidia
    gpu_memory_gb: 128
    oci_runtime: runc
    userns_mode: host
    network_backend: netavark
    vllm_docker_tag: cu130-nightly-aarch64
    gpus: 0
    gpu_mem_util_max: 0.78     # GB10 shared with harness + vision sidecar (~97 GiB free of 121.6)
    needs_netavark_switch: false
  ng-dgx-m3:
    arch: aarch64
    gpu_vendor: nvidia
    gpu_memory_gb: 128
    oci_runtime: runc
    userns_mode: host
    network_backend: netavark
    vllm_docker_tag: cu130-nightly-aarch64
    gpus: 0
    gpu_mem_util_max: 0.78     # GB10 shared with harness + vision sidecar (~97 GiB free of 121.6)
    needs_netavark_switch: false
