# UMRS deployment for rccs-front server — all services in containers.
#
# Unlike rccs-cloud (where UMRS runs natively for Slurm CLI access),
# the front-end server runs EVERYTHING in containers because Slurm
# commands are routed via SSH to the login node.
#
# Topology:
#   - This server: Gateway + UMRS + Postgres + MinIO (all containerized)
#   - Login node: SSH target for sbatch/squeue/scancel (no persistent services)
#   - Compute nodes: Mini-RiVault instances (via Slurm jobs)
#
# Usage:
#   cd deploy/rccs-front
#   ./start.sh
#   # or: podman-compose up -d
#
# Prerequisites:
#   - Set environment variables in .env
#   - SSH key access to rccs-cloud configured (for UMRS SSH control)
#   - VPN accessible for client connections

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg15
    container_name: umrs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-umrs_db}
    command: ["postgres", "-c", "unix_socket_directories="]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../docker/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    restart: unless-stopped

  # SeaweedFS object store (ADR-055 — replaces the archived MinIO community
  # build; MinIO stays reachable via the backend adapter S3_BACKEND=minio for
  # support, but no profile deploys it anymore). Fresh volume: per-cluster
  # object data was scratch; migrate away from the old minio_data on the host
  # before pruning it (operator leg, same as umrs-front).
  seaweedfs:
    image: ${S3_IMAGE:-docker.io/chrislusf/seaweedfs:4.47}
    container_name: umrs-seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_USER:-${MINIO_ROOT_USER:?Set S3_ROOT_USER in .env}}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:-${MINIO_ROOT_PASSWORD:?Set S3_ROOT_PASSWORD in .env}}
    command: >
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
      -volume.max=0 -volume.index=leveldb
      -s3 -s3.port=9000 -s3.iam -s3.iam.config=/etc/seaweedfs/iam.json
      -iam -iam.port=8111
      -metricsPort=9327
    ports:
      - "0.0.0.0:9000:9000"       # S3 API — preserved: VPN clients + reverse tunnel to login
      - "127.0.0.1:8112:8111"     # IAM API (per-user identities), loopback
      - "127.0.0.1:9328:9327" # Prometheus /metrics, loopback
    volumes:
      - s3_data:/data:z
      - ./seaweedfs/iam.json:/etc/seaweedfs/iam.json:ro,z
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/status"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  umrs-server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: umrs-server
    environment:
      UMRS_SITE_CONFIG: /app/deploy/rccs-front/site.yaml
      UMRS_REGISTRY_POSTGRES_DSN: "postgresql://${POSTGRES_USER:-umrs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-umrs_db}"
      # Canonical S3_* (ADR-055); MINIO_* mirror stays one wave for older
      # step-worker env readers, then it goes (rollout note in ADR-055).
      S3_BACKEND: seaweedfs
      S3_ENDPOINT_URL: http://seaweedfs:9000
      S3_IAM_ENDPOINT_URL: http://seaweedfs:8111
      S3_ACCESS_KEY: ${S3_ROOT_USER:-${MINIO_ROOT_USER}}
      S3_SECRET_KEY: ${S3_ROOT_PASSWORD:-${MINIO_ROOT_PASSWORD}}
      MINIO_ENDPOINT: http://seaweedfs:9000
      MINIO_ACCESS_KEY: ${S3_ROOT_USER:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${S3_ROOT_PASSWORD:-${MINIO_ROOT_PASSWORD}}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RIVAULT_ORCHESTRATOR: slurm-remote
    ports:
      - "0.0.0.0:8000:8000"       # UMRS API (VPN clients)
    volumes:
      # SSH key for ControlMaster to login node
      - ${SSH_KEY_PATH:-~/.ssh}:/home/umrs/.ssh:ro
      # Site config
      - ./site.yaml:/app/deploy/rccs-front/site.yaml:ro
    depends_on:
      - postgres
      - seaweedfs
    restart: unless-stopped

  gateway:
    build:
      context: ../../../gateway
      dockerfile: Dockerfile
    container_name: umrs-gateway
    environment:
      UMRS_BASE_URL: http://umrs-server:8000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
    ports:
      - "0.0.0.0:8080:8080"       # Gateway API (VPN clients)
    depends_on:
      - umrs-server
    restart: unless-stopped

volumes:
  pg_data:
  s3_data:
