# Pool roster: GLM-5.2-NVFP4 — NVIDIA NVFP4 quantized variant
# Usage: R4_GATEWAY_URL=http://localhost:8002 r4 pool up pool-glm52-nvfp4.yaml
#
# glm-5.2-nvfp4   — Standard NVFP4, TP=8 PP=1, 2 nodes (8× B200)
#
# NVFP4: weights+activations of MoE expert linear ops quantized to 4-bit;
# shared expert left in higher precision. ~376 GiB weights.
# vLLM 0.23+ required (--quantization modelopt_fp4).
# Based on: HF nvidia/GLM-5.2-NVFP4 model card.

pool: glm52-nvfp4
defaults:
  tier: system
  ttl_sec: 0
  timeout: 86400

endpoints:
  - name: glm-5.2-nvfp4
    model: GLM-5.2-NVFP4
    tier: system
    gpu_count: 4
    node_count: 2          # 2 nodes × 4 GPU = 8× B200 (TP=8, PP=1)
    partition: 2n4gpu      # NVLink within tray, IB between
    max_model_len: 1048576 # 1M context (NVFP4 weights + FP8 KV fit easily)
    # Default tp_pp strategy: TP=4 PP=2 (same as working GLM-5.2-FP8 recipe).
    # TEP mode (TP=8 PP=1) fails Ray placement: can't fit 8-GPU TP group
    # across 2 nodes with 4 GPUs each.
    env_vars:
      RIVAULT_SIF: /work/hps0/home/ea0022/images/mini-rivault-aarch64-v6.sif
      VLLM_QUANTIZATION: modelopt_fp4    # NVFP4 quantization via Model Optimizer
      VLLM_FORCE_FLASHINFER_MOE: "1"     # NVFP4 needs FlashInfer MoE, not triton
      VLLM_KV_CACHE_DTYPE: fp8           # FP8 KV cache (halves KV memory)
      VLLM_MAX_NUM_SEQS: "32"
      VLLM_MAX_NUM_BATCHED_TOKENS: "32768"
