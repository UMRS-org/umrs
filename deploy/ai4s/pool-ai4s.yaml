# Pool roster: AI4S Supercomputer — 3 large models
# Usage: R4_GATEWAY_URL=http://localhost:8002 r4 pool up pool-ai4s.yaml
#
# Target: ai4s-front → SSH → AI4S login (GB200 NVL4, 173.2 GiB/GPU × 4)
#
# Model sizing notes (GB200 B200 @ 173.2 GiB/GPU, 4/node = 692.8 GiB):
#
#   DeepSeek-V4-Pro (deepseek-ai/DeepSeek-V4-Pro):
#     - 1.6T total params, 49B activated (MoE)
#     - Stored in FP4+FP8 mixed (~862B stored params)
#     - 1M context, Hybrid Attention (CSA+HCA)
#     - Needs 2n4gpu (8× B200 = 1385.6 GiB) for safe loading
#     - vLLM/SGLang supported
#
#   GLM-5.1 (zai-org/GLM-5.1):
#     - 754B stored params (MoE, glm_moe_dsa architecture)
#     - BF16 weights → ~1.5 TB; FP8 → ~754 GiB
#     - Needs 2n4gpu (8× B200) with FP8 quantization
#     - vLLM v0.19.0+, SGLang v0.5.10+ required
#
#   Kimi K2.6 (moonshotai/Kimi-K2.6):
#     - 1T total params, 32B activated (MoE, 384 experts, 8 active)
#     - Native INT4 quantization → ~500 GiB
#     - 256K context, multimodal (MoonViT vision encoder)
#     - Fits in 1n4gpu (4× B200 = 692.8 GiB) with INT4
#     - vLLM/SGLang/KTransformers supported

pool: ai4s-research
defaults:
  tier: system            # system tier → shared, visible to all users
  timeout: 3600           # 60 min — 4-node Ray bootstrap + huge MoE load

endpoints:
  - name: deepseek-v4-pro
    model: DeepSeek-V4-Pro
    tier: system
    gpu_count: 4           # GPUs per node
    node_count: 4          # validated multi-node config (TP=4 × PP=4 = 16× B200, 2770 GiB) serving 1M KV today.
    partition: 4n4gpu-p    # unlimited walltime (MinNodes=0/MaxNodes=unlimited → node_count drives allocation, not the name)
    max_model_len: 1048576 # native 1M context (full token size)
    # NEXT-CANARY: GB200 recipe = 2 nodes TP=8 + --enable-expert-parallel, PP=1 (~960 GiB FP4+FP8 fits 8 GPUs).
    #   Halves GPU count + removes pipeline bubbles, BUT halves aggregate memory → 1M KV must be re-validated
    #   before reducing node_count to 2 (current serve.slurm would give TP=4 PP=2; recipe TP=8 PP=1+EP needs serve.slurm rework).

  - name: glm-5.1
    model: GLM-5.1
    tier: system
    gpu_count: 4
    node_count: 4          # validated multi-node config (TP=4 × PP=4) serving native context today.
    partition: 4n4gpu-p    # unlimited walltime; node_count drives allocation
    max_model_len: 202752  # native context (full token size)
    # NEXT-CANARY: GB200 recipe = 2 nodes TP=8, PP=1 (FP8 ~893 GiB fits 8 GPUs). Same memory-revalidation caveat as DeepSeek
    #   before reducing node_count to 2. Also wire reasoning-parser glm45 (tool-parser glm47 already derived).

  - name: kimi-k2.6
    model: Kimi-K2.6
    tier: system
    gpu_count: 4
    node_count: 1          # vLLM GB200 recipe: INT4 ~714 GiB fits ONE tray (4 GPUs); single-node TP=4 over NVLink avoids cross-node pipeline bubbles + Ray overhead
    partition: 4n4gpu-p    # unlimited walltime; node_count=1 → single-node allocation on this partition
    max_model_len: 245760  # 240K. Canary 10064 showed INT4 weights leave only 16.68 GiB/GPU KV at gpu_mem_util=0.9 → hard ceiling 254816 tokens for native 262144. Trimmed to 245760 for fragmentation margin. (orchestrator does not thread per-model gpu_memory_utilization, so raising util is not available via pool.)
    # 1T MoE (32B active, 384 experts), native INT4; TP=4 × PP=1 (single node)
