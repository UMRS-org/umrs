# Pool roster: AI4S Supercomputer — 3 large models
# Usage: R4_GATEWAY_URL=http://localhost:8002 r4 pool up pool-ai4s.yaml
#
# Target: ai4s-front → SSH → AI4S login (GB200 NVL4, 173.2 GiB/GPU × 4)
#
# Model sizing notes (GB200 B200 @ 173.2 GiB/GPU, 4/node = 692.8 GiB):
#
#   DeepSeek-V4-Pro (deepseek-ai/DeepSeek-V4-Pro):
#     - 1.6T total params, 49B activated (MoE)
#     - Stored in FP4+FP8 mixed (~862B stored params)
#     - 1M context, Hybrid Attention (CSA+HCA)
#     - Needs 2n4gpu (8× B200 = 1385.6 GiB) for safe loading
#     - vLLM/SGLang supported
#
#   GLM-5.1 (zai-org/GLM-5.1):
#     - 754B stored params (MoE, glm_moe_dsa architecture)
#     - BF16 weights → ~1.5 TB; FP8 → ~754 GiB
#     - Needs 2n4gpu (8× B200) with FP8 quantization
#     - vLLM v0.19.0+, SGLang v0.5.10+ required
#
#   Kimi K2.6 (moonshotai/Kimi-K2.6):
#     - 1T total params, 32B activated (MoE, 384 experts, 8 active)
#     - Native INT4 quantization → ~500 GiB
#     - 256K context, multimodal (MoonViT vision encoder)
#     - Fits in 1n4gpu (4× B200 = 692.8 GiB) with INT4
#     - vLLM/SGLang/KTransformers supported

pool: ai4s-research
defaults:
  tier: system            # system tier → shared, visible to all users
  ttl_sec: 0              # 0 = never expires. 4n4gpu-p has unlimited walltime;
                          # system-tier pool models must persist until explicitly torn down.
  timeout: 86400          # HTTP request timeout (seconds) for `pool up`, NOT endpoint TTL.
                          # Endpoint lifetime is controlled by ttl_sec above.

endpoints:
  - name: deepseek-v4-pro
    model: DeepSeek-V4-Pro
    tier: system
    gpu_count: 4           # GPUs per node
    node_count: 4          # validated multi-node config (TP=4 × PP=4 = 16× B200, 2770 GiB) serving 1M KV today.
    partition: 4n4gpu-p    # unlimited walltime (MinNodes=0/MaxNodes=unlimited → node_count drives allocation, not the name)
    max_model_len: 1048576 # native 1M context (full token size)
    # NEXT-CANARY: GB200 recipe = 2 nodes TP=8 + --enable-expert-parallel, PP=1 (~960 GiB FP4+FP8 fits 8 GPUs).
    #   Halves GPU count + removes pipeline bubbles, BUT halves aggregate memory → 1M KV must be re-validated
    #   before reducing node_count to 2 (current serve.slurm would give TP=4 PP=2; recipe TP=8 PP=1+EP needs serve.slurm rework).

  # ── DeepSeek-V4-Pro speedup canaries (2026-06-08) ──────────────────────────
  # See: deepseek-v4-eager-graphs-garbage-2026-06-08 for background on
  # eager-mode requirement (CUDA graphs produce garbled output on this build).

  - name: deepseek-v4-pro-tep
    model: DeepSeek-V4-Pro
    tier: system
    gpu_count: 4
    node_count: 2          # TEP: 2 nodes × 4 GPU = 8× B200 (1385.6 GiB)
    partition: 2n4gpu      # NVLink × 2 trays, InfiniBand between
    max_model_len: 262144  # CANARY: start 256K, validate KV fit before 1M
    parallel_strategy: tep # TP=8 PP=1 + expert-parallel — eliminates pipeline bubbles
    env_vars:
      VLLM_MAX_NUM_SEQS: "32"  # more concurrent headroom with 256K KV
      VLLM_MAX_NUM_BATCHED_TOKENS: "32768"  # faster prefill

  - name: deepseek-v4-pro-128k
    model: DeepSeek-V4-Pro
    tier: system
    gpu_count: 4
    node_count: 4          # same allocation as baseline 1M
    partition: 4n4gpu-p
    max_model_len: 131072  # 128K — ~8× more KV headroom vs 1M
    env_vars:
      VLLM_MAX_NUM_SEQS: "32"
      VLLM_MAX_NUM_BATCHED_TOKENS: "32768"

  - name: deepseek-v4-pro-tep-128k
    model: DeepSeek-V4-Pro
    tier: system
    gpu_count: 4
    node_count: 2          # TEP: 2 nodes × 4 GPU = 8× B200
    partition: 2n4gpu
    max_model_len: 131072  # 128K — max headroom in TEP layout
    parallel_strategy: tep # TP=8 PP=1 — no pipeline bubbles + 128K KV
    env_vars:
      VLLM_MAX_NUM_SEQS: "32"
      VLLM_MAX_NUM_BATCHED_TOKENS: "32768"

  - name: glm-5.1
    model: GLM-5.1
    tier: system
    gpu_count: 4
    node_count: 4          # validated multi-node config (TP=4 × PP=4) serving native context today.
    partition: 4n4gpu-p    # unlimited walltime; node_count drives allocation
    max_model_len: 202752  # native context (full token size)
    # NEXT-CANARY: GB200 recipe = 2 nodes TP=8, PP=1 (FP8 ~893 GiB fits 8 GPUs). Same memory-revalidation caveat as DeepSeek
    #   before reducing node_count to 2. Also wire reasoning-parser glm45 (tool-parser glm47 already derived).

  - name: kimi-k2.6
    model: Kimi-K2.6
    tier: system
    gpu_count: 4
    node_count: 1          # vLLM GB200 recipe: INT4 ~714 GiB fits ONE tray (4 GPUs); single-node TP=4 over NVLink avoids cross-node pipeline bubbles + Ray overhead
    partition: 4n4gpu-p    # unlimited walltime; node_count=1 → single-node allocation on this partition
    max_model_len: 245760  # 240K. Canary 10064 showed INT4 weights leave only 16.68 GiB/GPU KV at gpu_mem_util=0.9 → hard ceiling 254816 tokens for native 262144. Trimmed to 245760 for fragmentation margin. (orchestrator does not thread per-model gpu_memory_utilization, so raising util is not available via pool.)
    # 1T MoE (32B active, 384 experts), native INT4; TP=4 × PP=1 (single node)

  # ── DiffusionGemma 26B-A4B-it (block-diffusion LLM) ──────────────────────
  # Google diffusion model on Gemma 4 MoE backbone.
  # 25.2B total / 3.8B active (128 experts, 8 active + 1 shared), 256K context.
  # KEY CONSTRAINT: --max-num-seqs must be ≤4 — diffusion state tensors
  #   (self_conditioning_probs) pre-allocate max_seqs × canvas_length × vocab_size
  #   (4 × 256 × 262K = 268M floats), higher values cause OOM.
  # Needs vllm-openai:gemma docker image (diffusion model support).
  # Single GPU viable (BF16 ~50 GiB + diffusion buffers + KV). B200 1 GPU safe.
  # Recommended: --generation-config vllm, --gpu-memory-utilization 0.85,
  #   --hf-overrides '{"diffusion_sampler":"entropy_bound","diffusion_entropy_bound":0.1}'
  # TTFT ~10× higher than autoregressive (489ms vs 53ms) but 1.9× output TPS.

  - name: diffusiongemma-26b
    model: diffusiongemma-26B-A4B-it   # registered UMRS name (HF: google/diffusiongemma-26B-A4B-it)
    tier: system
    gpu_count: 1           # BF16 ~50 GiB + diffusion buffers fits B200 (173.2 GiB)
    node_count: 1
    partition: 4n4gpu-p    # single GPU within a 4-GPU node; TP=1 adequate
    max_model_len: 262144  # native 256K context
    env_vars:
      VLLM_MAX_NUM_SEQS: "4"              # hard limit — diffusion state OOM above 4
      VLLM_GPU_MEMORY_UTILIZATION: "0.85" # headroom for denoising activations
    # vLLM flags needed (wire via extra_args or recipe):
    #   --generation-config vllm  (ignore checkpoint's max_tokens:256 override)
    #   --hf-overrides '{"diffusion_sampler":"entropy_bound","diffusion_entropy_bound":0.1}'
    # Needs vllm/vllm-openai:gemma docker image (diffusion model support).
    # Multimodal (text+image+video), thinking mode, function calling supported.
    # Reasoning parser: gemma4 (if thinking mode desired).

  # ── GPT-OSS-Swallow 120B RL MXFP4 (bilingual JA/EN reasoning) ─────────────
  # TokyoTech continual-pretrained GPT-OSS 120B, RLVR-aligned, MXFP4 quantized.
  # 120B params, MXFP4 → ~60 GiB weights. GPT-OSS architecture.
  # Single A100 viable per vLLM recipe. B200 1 GPU with ample KV headroom.
  # 32K recommended max context (trained w/ 32K, YaRN extension available).
  # Reasoning effort: medium (default; low/high not trained — stick to medium).
  # No tool-call training — function calling not supported out of box.
  # Generation params: temperature=0.6, top_p=0.95, top_k=20, min_p=0.

  - name: gpt-oss-swallow-120b
    model: GPT-OSS-Swallow-120B-RL-v0.1-MXFP4   # registered UMRS name (HF: tokyotech-llm/GPT-OSS-Swallow-120B-RL-v0.1-MXFP4)
    tier: system
    gpu_count: 1           # MXFP4 ~60 GiB weights fits B200 (173.2 GiB) with KV headroom
    node_count: 1          # single-node TP=1; scale TP for throughput if needed
    partition: 4n4gpu-p
    max_model_len: 32768   # trained context; 32K recommended per model card
    env_vars:
      VLLM_MAX_NUM_SEQS: "64"               # moderate concurrency
      VLLM_MAX_NUM_BATCHED_TOKENS: "8192"   # per GPT-OSS recipe
      VLLM_GPU_MEMORY_UTILIZATION: "0.85"   # safe headroom
    # No tool-call-parser needed (not trained for tools).
    # Reasoning parser: gpt_oss (via --reasoning-parser gpt_oss).
    # Best practices: temperature=0.6, top_p=0.95, top_k=20, min_p=0.
    # Bilingual JA/EN, strong math/code via RLVR.

  # ── llm-jp-4 32B-A3B thinking (Japanese MoE reasoning model) ──────────────
  # NII LLM-jp-4 MoE: 32B total / 3.8B active (128 experts, 8 active), 64K context.
  # Qwen-based architecture, Harmony response format (OpenAI-compatible).
  # Thinking model with reasoning_effort: low|medium|high.
  # Needs --trust-remote-code (custom tokenizer + harmony parser).
  # Needs --reasoning-parser llmjp4 (custom parser from llm-jp-4-cookbook).
  # Tiny model — BF16 ~64 GiB, fits single B200 with huge KV headroom.

  - name: llm-jp-4-32b-thinking
    model: llm-jp-4-32b-a3b-thinking   # registered UMRS name (HF: llm-jp/llm-jp-4-32b-a3b-thinking)
    tier: system
    gpu_count: 1           # BF16 ~64 GiB fits B200 (173.2 GiB) easily
    node_count: 1
    partition: 4n4gpu-p
    max_model_len: 65536   # native 64K context
    env_vars:
      VLLM_MAX_NUM_SEQS: "64"
      VLLM_GPU_MEMORY_UTILIZATION: "0.90"   # plenty of headroom for small model
    # Needs: --trust-remote-code --reasoning-parser llmjp4
    # Japanese-first MoE thinking model, Harmony response format.
    # reasoning_effort: low|medium|high supported.

  # ── MCP-enabled example ───────────────────────────────────────────────────
  # Users can mount custom MCP servers into mini-RiVaults via the Gateway.
  # The endpoint provisioning API accepts mount specs under:
  #   endpoint_provisioning.mounts.mcp_servers.  The provision request
  #   containerizes the server directories and validates their config.json
  #   manifest (see mcp-servers/src/r4_mcp/runners/custom_mcp.py).
  #
  # Example (not a persistent pool entry, shown as reference):
  #   r4 endpoint up --tier user --model Kimi-K2.6 \
  #     --mount-mcp /home/user/my-mcp:/mcp-servers/my-mcp
  #
  # Each mounted directory must contain a config.json declared per:
  #   docs/user-manual/EXTENDING.md §11.4
  #   example: {"name":"my-mcp","version":"1.0.0","entry_point":"python server.py",
  #             "capabilities":{"tools":["search_db"],"sandbox":{"network":"egress_guard",
  #             "filesystem":"read_only","max_memory_mb":512,"max_runtime_sec":30}}}
